format: protocol/1
protocol:
  id: operator.reply
  revision: 1
  description: >-
    Answer one inbound item from data sources and send the reply: read at least one source about
    the item, propose a reply, then send the proposed reply, or decline the item. Only a reply
    already proposed is sent, and sending needs the reply.send capability.
artifacts:
  item:
    description: >-
      the inbound item a case answers, referenced by its id; its revision moves when the item
      itself changes. The case stores no item text
evidence_kinds:
  source_read:
    description: a verified read of one configured data source, made for the item
  reply_proposed:
    description: a reply proposed for the item, recorded in the case
  reply_sent:
    description: the record that the proposed reply was sent for the item
  reply_declined:
    description: the record that the item gets no reply, recorded in the case
claims:
  item.sourced:
    description: at least one data source was read for the current item revision
    true_when:
      evidence:
        kind: source_read
        subject: item
  reply.proposed:
    description: a reply is proposed for the current item revision
    true_when:
      evidence:
        kind: reply_proposed
        subject: item
  reply.sent:
    description: the proposed reply was sent for the current item revision
    true_when:
      evidence:
        kind: reply_sent
        subject: item
  reply.declined:
    description: the current item revision is declined
    true_when:
      evidence:
        kind: reply_declined
        subject: item
actions:
  source.read:
    description: read one configured data source for the item
    effect: read
    requires:
      - capability: datasource.read
    may_produce:
      - evidence: source_read
  reply.propose:
    description: >-
      record a proposed reply to the item in the case; sending it is reply.send. Not once the item
      is declined
    effect: none
    precondition:
      claim: reply.declined
      is: unknown
    requires:
      - capability: reply.propose
    may_produce:
      - evidence: reply_proposed
  reply.send:
    description: >-
      send the reply proposed for the item; the one action that changes anything outside the
      case. Only once a reply is proposed
    effect: write
    precondition:
      claim: reply.proposed
      is: true
    requires:
      - capability: reply.send
    may_produce:
      - evidence: reply_sent
  reply.decline:
    description: >-
      record in the case that the item gets no reply; sends nothing. Not once a reply is
      proposed
    effect: none
    precondition:
      claim: reply.proposed
      is: unknown
    may_produce:
      - evidence: reply_declined
outcomes:
  answered:
    description: a reply proposed from at least one source read was sent for the item
    requires:
      all:
        - claim: reply.sent
        - claim: reply.proposed
        - claim: item.sourced
  declined:
    description: the item is declined and gets no reply
    requires:
      claim: reply.declined
