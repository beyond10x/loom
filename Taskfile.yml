version: '3'

includes:
  commission: ./Taskfile.commission.yml

tasks:
  default:
    cmds: [{task: check}]

  install:
    desc: Build this checkout and install b10x-loom into ~/.local/bin.
    cmds:
      - 'cargo install --path crates/loom-cli --bin b10x-loom --locked --force --root "$HOME/.local"'

  check:
    desc: Format, lint, test; Loom's steps, every Commission step and intake's specification.
    cmds:
      - task: spec
      - task: commission:spec
      - task: intake-spec
      - task: ess-gate
      - task: commission:ess-gate
      - task: drift
      - task: crd-drift
      - task: chart-check
      - task: commission:drift
      - task: intake-drift
      - task: no-hand-model
      - task: commission:no-hand-model
      - task: conform
      - task: commission:conform
      - task: intake-conform
      - task: commission:deps-guard
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - task: consumer-check
      - task: docs-check
      - task: commission:docs-drift

  spec:
    desc: Validate the ESS specification.
    cmds:
      - ess specify validate --path ess

  intake-spec:
    desc: Validate intake's ESS specification.
    cmds:
      - ess specify validate --path ess/intake --strict-requires

  intake-generate:
    desc: Regenerate intake's Rust types.
    cmds:
      - cargo run -q --locked -p loom-xtask -- intake-generate

  intake-drift:
    desc: Fail on drift in intake's generated Rust model.
    cmds:
      - cargo run -q --locked -p loom-xtask -- intake-drift

  ess-gate:
    desc: ESS hard gate (Atlas ADR 0076) — validate, compile, synthesize with 0 refusals, no open question.
    cmds:
      - cargo test -p b10x-loom-executor --test ess_gate --locked

  generate:
    desc: Rewrite generated/rust/loom/ from a fresh synthesis of ess/.
    cmds:
      - task: generate-bootstrap
      - cargo run -q --locked -p loom-xtask -- generate

  generate-bootstrap:
    desc: Write generated/rust/loom/ when it is absent, so cargo can load the workspace.
    internal: true
    status:
      - test -f generated/rust/loom/Cargo.toml
    cmds:
      - ess generate synthesize --path ess --target rust --layout crate --out generated/rust/loom

  drift:
    desc: Fail when generated/rust/loom/ differs from a fresh synthesis of ess/, naming the file.
    cmds:
      - cargo run -q --locked -p loom-xtask -- drift

  crd-generate:
    desc: Write deploy/crd/loomagents.loom.beyond10x.dev.yaml, the LoomAgent CRD projected from ess/, and its copy in charts/loom-agents/crds/.
    cmds:
      - cargo run -q --locked -p loom-xtask -- crd-generate
      - cp deploy/crd/loomagents.loom.beyond10x.dev.yaml charts/loom-agents/crds/loomagents.loom.beyond10x.dev.yaml

  crd-drift:
    desc: Fail when deploy/crd/loomagents.loom.beyond10x.dev.yaml differs from a fresh projection of ess/, naming the file.
    cmds:
      - cargo run -q --locked -p loom-xtask -- crd-drift

  chart-check:
    desc: Fail when charts/loom-agents/crds/ differs from deploy/crd/, or when Helm cannot lint the chart or render it with its default values and with overrides.
    cmds:
      - cmp deploy/crd/loomagents.loom.beyond10x.dev.yaml charts/loom-agents/crds/loomagents.loom.beyond10x.dev.yaml
      - helm lint charts/loom-agents
      - helm template loom-agents charts/loom-agents --namespace agents > /dev/null
      - >-
        helm template loom-agents charts/loom-agents --namespace agents
        --set 'image.tag=0.0.1-test'
        --set 'agentImage.repository=registry.example/other-agent'
        --set 'modelRoute.url=http://model-route.agents.svc:8080/v1'
        --set 'modelRoute.protocol=messages'
        --set 'modelRoute.model=small-model'
        --set 'allowedSecretNames={platform-operator-secrets}'
        --set 'allowedEgressHosts={chat.example,models.example}'
        --set 'allowedClaimNames={takt-workspace}'
        --set 'allowUnconfinedProfiles=true'
        --set 'allowedSeccompLocalhostProfiles={profiles/takt.json}'
        --set 'allowedAppArmorLocalhostProfiles={takt-delivery}'
        > /dev/null

  no-hand-model:
    desc: Fail when crates/loom-executor/src defines, or renames something to, a type ess/ declares.
    cmds:
      - cargo run -q --locked -p loom-xtask -- no-hand-model

  conform:
    desc: Run the conformance suite synthesized from ess/ with declared coverage against b10x-loom-executor and fail unless its report says conformance_status passed and every check of the report holds.
    cmds:
      - cargo test --locked -p b10x-loom-conformance --test conform

  intake-conform:
    desc: Run the conformance suite synthesized from ess/intake/ with declared coverage against b10x-loom-intake-slice and fail unless its report says conformance_status passed and every check of the report holds.
    cmds:
      - cargo test --locked -p b10x-loom-intake-conformance --test conform

  consumer-check:
    desc: Build and run consumers/pinned, a crate outside the workspace that pins b10x-loom-sdk by path and compiles the SDK example, over the workspace's Cargo.lock.
    cmds:
      - cp Cargo.lock consumers/pinned/Cargo.lock
      - cargo fmt --manifest-path consumers/pinned/Cargo.toml --check
      - cargo test --manifest-path consumers/pinned/Cargo.toml --offline

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  docs-generate:
    desc: Regenerate the derived documentation pages under website/docs/reference/.
    cmds:
      - cargo run --locked -p loom-docs -- generate

  docs-check:
    desc: Fail when the generated documentation pages are missing, stale or edited by hand.
    cmds:
      - cargo run --locked -p loom-docs -- generate --check

  website:
    desc: Build the documentation site, as CI's Documentation validation workflow does.
    dir: website
    cmds:
      - npm ci
      - npm run build
