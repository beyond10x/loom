version: '3'

env:
  CARGO_TARGET_DIR: '{{.HOME}}/.cache/b10x-target/loom'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: Format, lint, test.
    cmds:
      - task: spec
      - task: ess-gate
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - task: docs-check

  spec:
    desc: Validate the ESS specification.
    cmds:
      - ess specify validate --path ess

  ess-gate:
    desc: ESS hard gate (Atlas ADR 0076) — validate, compile, synthesize with 0 refusals, no open question.
    cmds:
      - cargo test -p b10x-loom --test ess_gate --locked

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  docs-generate:
    desc: Regenerate the derived documentation pages under website/docs/reference/.
    cmds:
      - cargo run --locked -p loom-docs -- generate

  docs-check:
    desc: Fail when the generated documentation pages are missing, stale or edited by hand.
    cmds:
      - cargo run --locked -p loom-docs -- generate --check

  website:
    desc: Build the documentation site, as CI's Documentation validation workflow does.
    dir: website
    cmds:
      - npm ci
      - npm run build
