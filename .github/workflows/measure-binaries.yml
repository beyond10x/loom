name: measure-binaries

on:
  pull_request:
    paths:
      - .github/workflows/measure-binaries.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure-binaries / gnu-2.17 and musl on one runner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    container: rust:1.99-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Zig and cargo-zigbuild, each by a pinned version and digest
        env:
          ZIG_VERSION: "0.17.1"
          ZIG_SHA256: 3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          ZIGBUILD_VERSION: "0.24.1"
          ZIGBUILD_SHA256: f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/release-tools"
          mkdir -p "$tools/zig" "$tools/bin"
          curl --fail --silent --show-error --location --output "$tools/zig.tar.xz" \
            "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  $tools/zig.tar.xz" | sha256sum --check --strict
          tar -xJf "$tools/zig.tar.xz" -C "$tools/zig" --strip-components=1
          curl --fail --silent --show-error --location --output "$tools/zigbuild.tar.xz" \
            "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "$ZIGBUILD_SHA256  $tools/zigbuild.tar.xz" | sha256sum --check --strict
          tar -xJf "$tools/zigbuild.tar.xz" -C "$tools/bin" --strip-components=1 \
            cargo-zigbuild-x86_64-unknown-linux-musl/cargo-zigbuild
          echo "$tools/zig" >> "$GITHUB_PATH"
          echo "$tools/bin" >> "$GITHUB_PATH"
          "$tools/zig/zig" version
          "$tools/bin/cargo-zigbuild" --version

      - name: Add the musl target to the toolchain
        run: rustup target add x86_64-unknown-linux-musl

      - name: Fetch the locked dependencies once, for both builds
        run: cargo fetch --locked

      - name: Build both binaries cold, each in its own target directory, and time each build
        run: |
          set -euo pipefail
          nproc
          start=$(date +%s)
          CARGO_TARGET_DIR=target-gnu cargo zigbuild --release --locked -p b10x-loom-cli --bin b10x-loom --target x86_64-unknown-linux-gnu.2.17
          gnu=$(( $(date +%s) - start ))
          start=$(date +%s)
          CARGO_TARGET_DIR=target-musl cargo zigbuild --release --locked -p b10x-loom-cli --bin b10x-loom --target x86_64-unknown-linux-musl
          musl=$(( $(date +%s) - start ))
          echo "build seconds: gnu-2.17 $gnu musl $musl"

      - name: Sizes of the binaries and their archives
        run: |
          set -euo pipefail
          for pair in gnu:target-gnu/x86_64-unknown-linux-gnu/release/b10x-loom musl:target-musl/x86_64-unknown-linux-musl/release/b10x-loom; do
            label=${pair%%:*}
            binary=${pair#*:}
            mkdir "archive-$label"
            install -m 0755 "$binary" "archive-$label/b10x-loom"
            install -m 0644 LICENSE "archive-$label/LICENSE"
            tar -czf "archive-$label.tar.gz" "archive-$label"
            echo "size bytes: $label binary $(stat -c %s "$binary") archive $(stat -c %s "archive-$label.tar.gz")"
            "$binary" --version
          done

      - name: Time both binaries on this runner, interleaved
        run: |
          set -euo pipefail
          gnu=target-gnu/x86_64-unknown-linux-gnu/release/b10x-loom
          musl=target-musl/x86_64-unknown-linux-musl/release/b10x-loom
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_DATA_HOME"
          "$gnu" protocols list > /dev/null
          "$musl" protocols list > /dev/null
          ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
          help_gnu=0; help_musl=0; list_gnu=0; list_musl=0
          for round in 1 2 3 4 5; do
            t=$(date +%s%N); for i in $(seq 40); do "$gnu" --help > /dev/null; done; help_gnu=$(( help_gnu + $(ms "$t") ))
            t=$(date +%s%N); for i in $(seq 40); do "$musl" --help > /dev/null; done; help_musl=$(( help_musl + $(ms "$t") ))
            t=$(date +%s%N); for i in $(seq 10); do "$gnu" protocols list > /dev/null; done; list_gnu=$(( list_gnu + $(ms "$t") ))
            t=$(date +%s%N); for i in $(seq 10); do "$musl" protocols list > /dev/null; done; list_musl=$(( list_musl + $(ms "$t") ))
          done
          echo "--help x200 total ms: gnu-2.17 $help_gnu musl $help_musl"
          echo "protocols list x50 total ms: gnu-2.17 $list_gnu musl $list_musl"
