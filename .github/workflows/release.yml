name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: release / verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # release-check diffs the stable surfaces against the previous tag: full history, tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Read the Rust release rust-toolchain.toml pins
        id: toolchain
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml pins no channel of the form X.Y.Z" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: The tag is the workspace version and its CHANGELOG.md entry names what breaks
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --locked -q -p loom-xtask -- release-check --tag "$TAG"

  check:
    name: release / check
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  images:
    name: release / images
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: true

  binaries:
    name: release / binaries
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/binaries.yml
    with:
      version: ${{ github.ref_name }}
