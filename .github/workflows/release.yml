name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: release / verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: The tag is the workspace version and has a CHANGELOG.md entry
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run --locked -q -p loom-xtask -- release-check --tag "$TAG"

  check:
    name: release / check
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
