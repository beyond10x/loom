name: Dashboard browser checks

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'ess/dashboard/**'
      - '.github/workflows/dashboard-ui.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'ess/dashboard/**'
      - '.github/workflows/dashboard-ui.yml'

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      - run: npm run check:build
      - run: npm test
