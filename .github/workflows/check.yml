name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: loom / task check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Install test backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap e2fsprogs

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: "0.98.0"
          ESS_SHA256: c6c9a3a3d6956ce1a237f0340905dfadc431d31b1a15b104a6d2e64bb5acaa8e
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install helm
        env:
          HELM_VERSION: "3.19.0"
          HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin" cargo-nextest
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies for offline checks
        run: cargo fetch --locked

      - name: Probe a delegated user scope
        run: |
          set -u
          if probe=$(systemd-run --user --scope -p Delegate=yes true 2>&1); then
            echo "delegation probe passed: LOOM_REQUIRE_DELEGATION=1 for task check"
            echo "LOOM_REQUIRE_DELEGATION=1" >> "$GITHUB_ENV"
          else
            echo "delegation probe failed, LOOM_REQUIRE_DELEGATION not set, the delegated tests skip and the test step names them: $probe"
          fi

      - name: task check
        run: task check

  docs-slow:
    name: loom / docs slow lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1

      - name: Install go-task
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install ess
        env:
          ESS_VERSION: "0.98.0"
          ESS_SHA256: c6c9a3a3d6956ce1a237f0340905dfadc431d31b1a15b104a6d2e64bb5acaa8e
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Decide whether the docs slow lane runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/base-stamp.json"
          if [ -n "$BASE_REF" ]; then
            git show "origin/$BASE_REF:website/docs/reference/.generated.json" > "$base" || : > "$base"
          else
            cp website/docs/reference/.generated.json "$base"
          fi
          decision=$(cargo run --locked -q -p loom-xtask -- docs-stamp --slow-needed --base "$base" --event "$EVENT" --ref "$REF")
          echo "docs slow lane: $decision"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: task docs-slow
        if: steps.decide.outputs.decision == 'run'
        run: task docs-slow

  macos:
    name: loom / macos build
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.1

      - name: Fetch locked dependencies for offline checks
        run: cargo fetch --locked

      - name: Build the SDK and the intake slice
        run: cargo build --locked -p b10x-loom-sdk -p b10x-loom-intake-slice --all-targets

      - name: Test the SDK and the intake slice
        env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked --no-fail-fast -p b10x-loom-sdk -p b10x-loom-intake-slice
