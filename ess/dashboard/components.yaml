components:
  - component: dashboard
    summary: The dashboard observation API on one server.
    reached_by: network
    owns: {domains: [loom.observation]}
    accepts: {commands: [loom.observation.ReadSnapshot, loom.observation.ReadAgentSpec]}
  - component: renderer
    summary: The local views a browser derives from the returned snapshot.
    reached_by: network
    owns: {domains: [loom.dashboard]}
