domain: intake.query
summary: >-
  Loom owns the system-query@1 protocol and its system.time.read host binding. The action takes
  an empty object, samples one instant from the host clock and derives UTC and local time with
  its numeric offset. No shell or network is used. A typed observation is bound to the case and
  intent revision; only the trusted verifier submits system_time observed evidence on intent.
  Model text, earlier cases and fabricated observations do not establish completion. The answer
  is rendered directly from that observation, without another model call. Canon's answered outcome
  is successful completion, exit zero. Clock and conversion failures never submit success evidence.
  CLI routing precedes resource initialization. System queries need no workspace, Git, Substrate
  or test runner and ignore supplied workspace paths without accessing them. Software changes
  retain workspace, confinement and merge authority requirements. Installed custom clock protocols
  may reuse the same host binding when they declare only the intent artifact and the read-only
  system.time.read action with the system_time evidence contract. Other definitions remain
  available to embedders but have an explicit missing-executor result in this CLI. Both context
  policies and measurements apply. Legacy remains default. Only local date/time queries are
  supported initially; an unrelated system question must not complete using a clock observation.
types:
  - name: intake.query.TimeObservation
    kind: struct
    fields:
      - {name: case_id, type: String}
      - {name: intent_revision, type: String}
      - {name: utc, type: String}
      - {name: local, type: String}
      - {name: offset_seconds, type: Integer}
