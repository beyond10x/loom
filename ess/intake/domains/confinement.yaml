domain: intake.confinement
summary: >-
  Requested and observed confinement of local test commands. No automatic fallback. A command bound
  to a protocol's action runs outside Substrate, so a run that would start one is refused
  CommandUnconfined unless the operator opts out of confinement for those commands explicitly.
types:
  - name: intake.confinement.Backend
    kind: enum
    variants: [Substrate, None]
  - name: intake.confinement.ConfinementRefusal
    kind: enum
    variants: [BackendMissing, CgroupUndelegated, ScopeInvalid, WorkspaceNameInvalid, CapabilityUnserved, CommandUnconfined]
  - name: intake.confinement.EnvironmentEntry
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: value, type: String}
  - name: intake.confinement.ToolchainRoot
    kind: struct
    fields:
      - {name: host_path, type: String}
      - {name: mount, type: String}
  - name: intake.confinement.ReadOnlyFile
    kind: struct
    fields:
      - {name: host_path, type: String}
      - {name: mount, type: String}
  - name: intake.confinement.ConfinementProfile
    kind: struct
    fields:
      - {name: backend, type: intake.confinement.Backend}
      - {name: network, type: String}
      - {name: writable_scopes, type: "List<String>"}
      - {name: read_only_roots, type: "List<intake.confinement.ToolchainRoot>"}
      - {name: environment, type: "List<intake.confinement.EnvironmentEntry>"}
      - {name: timeout_ms, type: Integer}
      - {name: memory_bytes, type: Integer}
      - {name: processes, type: Integer}
      - {name: cpu_millis, type: Integer}
  # One egress aperture Substrate applied: its declared name, the pinned destination its forwarder
  # dialled, and the loopback address it listened on inside the sandbox, which Substrate reports
  # only for an aperture of a list of several. The applied network lists every aperture applied, in
  # the order requested; an empty list is no network, and an absent one is no network confinement
  # applied at all (an unconfined run), never no network.
  - name: intake.confinement.AppliedAperture
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: destination, type: String}
      - {name: listen, type: "Optional<String>"}
  # The supported driver projection is built from the actual observation, never the request.
  # The full Substrate wire record also accompanies it in the test observation.
  - name: intake.confinement.AppliedConfinement
    kind: struct
    fields:
      - {name: backend, type: intake.confinement.Backend}
      - {name: profile_digest, type: String}
      - {name: capability_snapshot, type: String}
      - {name: cgroup, type: String}
      - {name: filesystem, type: String}
      - {name: network, type: "Optional<List<intake.confinement.AppliedAperture>>"}
      - {name: profile, type: String}
      - {name: writable_scopes, type: "List<String>"}
      - {name: read_only_roots, type: "List<intake.confinement.ToolchainRoot>"}
      - {name: read_only_files, type: "List<intake.confinement.ReadOnlyFile>"}
      - {name: workdir, type: "Optional<String>"}
      # The Substrate confinement adapter the run went through (ADR 0109) and the facts it proved at
      # open, in Substrate's FACT_ORDER spelling. Both are absent on an unconfined run, and on a
      # record written before Loom read them.
      - {name: adapter, type: "Optional<String>"}
      - {name: facts, type: "Optional<List<String>>"}
  - name: intake.confinement.ChildStream
    kind: enum
    variants: [Stdout, Stderr]
  - name: intake.confinement.ChildOutput
    kind: struct
    fields:
      - {name: stdout, type: Bytes}
      - {name: stderr, type: Bytes}
      - {name: stdout_truncated, type: Boolean}
      - {name: stderr_truncated, type: Boolean}
  - name: intake.confinement.ChildExit
    kind: struct
    fields:
      - {name: exit_code, type: "Optional<Integer>"}
      - {name: signal, type: "Optional<Integer>"}
      - {name: timed_out, type: Boolean}
  # A host directory a child would write at a mount outside its workspace (Substrate's writable
  # host root). Declared so a confinement spec can name one; no Loom release honours it yet.
  - name: intake.confinement.WritableRoot
    kind: struct
    fields:
      - {name: host_path, type: String}
      - {name: mount, type: String}
  # A variable of the host's environment a child may keep by name (Substrate's baseline
  # environment): LANG, LC_ALL, PATH, TERM and TZ, in this order.
  - name: intake.confinement.BaselineVariable
    kind: enum
    variants: [Lang, LcAll, Path, Term, Tz]
  # A child's whole environment: the baseline variables it keeps and the variables it is set, each
  # name at most once.
  - name: intake.confinement.ChildEnvironment
    kind: struct
    fields:
      - {name: allow, type: "List<intake.confinement.BaselineVariable>"}
      - {name: set, type: "List<intake.confinement.EnvironmentEntry>"}
  # The sandbox profile a child asks for (Substrate's sandbox profile).
  - name: intake.confinement.ChildProfile
    kind: enum
    variants: [Workspace]
  # The network a child asks for (Substrate's network mode): none, or its egress apertures alone.
  - name: intake.confinement.ChildNetwork
    kind: enum
    variants: [None, Aperture]
  # One egress aperture a child may reach (Substrate's egress aperture): its name, the host and port
  # the host names, the socket address that host was resolved to, and an optional byte ceiling.
  - name: intake.confinement.ChildAperture
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: host, type: String}
      - {name: port, type: Integer}
      - {name: pinned, type: String}
      - {name: max_bytes, type: "Optional<Integer>"}
  # A child's confinement as one value: each field means what the child command's builder of the
  # same name means, and applying the spec runs those builders, so every check at launch is the
  # same. `writable` are workspace directories beside `target`; `host_paths` are read at their own
  # path; `egress` apertures make the network the apertures alone, whatever `network` says;
  # `timeout_ms` absent is the default timeout; `stdin` absent leaves standard input empty.
  # `writable_roots` is refused while it is not empty, naming it: Loom requests no writable root
  # outside the workspace.
  - name: intake.confinement.ConfinementSpec
    kind: struct
    fields:
      - {name: read_only_roots, type: "List<intake.confinement.ToolchainRoot>"}
      - {name: read_only_files, type: "List<intake.confinement.ReadOnlyFile>"}
      - {name: host_paths, type: "List<String>"}
      - {name: writable, type: "List<String>"}
      - {name: writable_roots, type: "List<intake.confinement.WritableRoot>"}
      - {name: workdir, type: "Optional<String>"}
      - {name: environment, type: intake.confinement.ChildEnvironment}
      - {name: profile, type: intake.confinement.ChildProfile}
      - {name: network, type: intake.confinement.ChildNetwork}
      - {name: egress, type: "List<intake.confinement.ChildAperture>"}
      - {name: ca_bundle, type: "Optional<String>"}
      - {name: timeout_ms, type: "Optional<Integer>"}
      - {name: stdin, type: "Optional<Bytes>"}
