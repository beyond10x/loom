domain: intake.events

summary: >-
  The machine-readable record of one b10x-loom run, written as one JSON object per line on
  standard output when the operator asks for it. Every line carries the stream's schema version.
  The records project what the run already does: the route it took, each model turn, each tool
  call a model made, the usage a provider reported, each agent session metaharness ran for it,
  named by its trace-ir/1 digest and summarized, the approvals the run stopped for, and exactly
  one terminal record, last, with the stop reason and the process exit status. A record adds no
  authority and is not evidence.

naming:
  wire: events
  display: Run events

types:
  # The version of the line format. A consumer refuses a line whose version it does not know.
  - name: intake.events.SchemaVersion
    kind: enum
    variants: [V1]

  # One line of the stream: the schema version and one record, its kind the record's tag.
  - name: intake.events.RunEventLine
    kind: struct
    fields:
      - name: schema_version
        type: intake.events.SchemaVersion
      - name: event
        type: intake.events.RunEvent

  # The record kinds. Terminal is written exactly once per run, and last.
  - name: intake.events.RunEvent
    kind: union
    tag: kind
    variants:
      Route: intake.events.RouteEvent
      Turn: intake.events.TurnEvent
      ToolCall: intake.events.ToolCallEvent
      Usage: intake.events.UsageEvent
      Approval: intake.events.ApprovalEvent
      Session: intake.events.SessionEvent
      Terminal: intake.events.TerminalEvent

  # The protocol the router picked, and whether the run went on to execute it. A refused pick
  # names the protocol it refused.
  - name: intake.events.RouteEvent
    kind: struct
    fields:
      - name: protocol
        type: String
      - name: accepted
        type: Boolean

  # One model turn: which request it answered, the model's binding and the provider's turn stop.
  - name: intake.events.TurnEvent
    kind: struct
    fields:
      - name: turn
        type: Integer
      - name: phase
        type: intake.context.RequestPhase
      - name: model
        type: String
      - name: turn_stop
        type: String

  # One tool call a model made in a turn, its arguments as the model wrote them, in JSON text.
  - name: intake.events.ToolCallEvent
    kind: struct
    fields:
      - name: turn
        type: Integer
      - name: call_id
        type: String
      - name: name
        type: String
      - name: arguments
        type: String

  # The counters a provider reported for one turn. A counter the provider did not report is
  # absent, never zero; `final_usage` false marks a partial snapshot.
  - name: intake.events.UsageEvent
    kind: struct
    fields:
      - name: turn
        type: Integer
      - name: model
        type: String
      - name: input_tokens
        type: Optional<Integer>
      - name: output_tokens
        type: Optional<Integer>
      - name: cached_input_tokens
        type: Optional<Integer>
      - name: cache_creation_input_tokens
        type: Optional<Integer>
      - name: reasoning_output_tokens
        type: Optional<Integer>
      - name: final_usage
        type: Boolean

  # The actions the run stopped to await approval for, in frontier order.
  - name: intake.events.ApprovalEvent
    kind: struct
    fields:
      - name: actions
        type: List<String>

  # story:run-record-names-agent-sessions: one agent session metaharness ran for the run, named by
  # its trace-ir/1 document and summarized by metaharness's trace-ir-summary/1 (amendment a42),
  # which metaharness owns: every field after `source` is the summary's field of the same name,
  # absent where the summary is null. `transcript_digest` is the lowercase hex SHA-256 of the
  # session's record, the document's own digest; `source` is the format the record was read as
  # (`claude-code-stream-json`, `codex-rollout`, `harness-json`, or `metaharness.event/1` for the
  # event stream when the session left no vendor record). The session's own turns, tool calls and
  # usage are in that document and have no Turn, ToolCall or Usage record. A record metaharness
  # cannot project leaves every summary field absent and says why in `projection_error`; the run
  # goes on. Written once per session, after the session ended.
  - name: intake.events.SessionEvent
    kind: struct
    fields:
      - name: transcript_digest
        type: Optional<String>
      - name: source
        type: Optional<String>
      - name: adapter
        type: Optional<String>
      - name: model
        type: Optional<String>
      - name: models
        type: Optional<List<intake.events.SessionModel>>
      - name: turns
        type: Optional<Integer>
      - name: tokens_basis
        type: Optional<String>
      - name: input_tokens
        type: Optional<Integer>
      - name: output_tokens
        type: Optional<Integer>
      - name: cache_read_input_tokens
        type: Optional<Integer>
      - name: cache_creation_input_tokens
        type: Optional<Integer>
      - name: cost_usd
        type: Optional<Decimal>
      - name: duration_ms
        type: Optional<Integer>
      - name: duration_api_ms
        type: Optional<Integer>
      - name: first_timestamp_ms
        type: Optional<Integer>
      - name: last_timestamp_ms
        type: Optional<Integer>
      - name: is_error
        type: Optional<Boolean>
      - name: stop_reason
        type: Optional<String>
      - name: tool_calls
        type: Optional<List<intake.events.SessionToolCall>>
      - name: unk
        type: Optional<Integer>
      - name: projection_error
        type: Optional<String>

  # One model a session's summary names, with the figures its record states for that model
  # alone (trace-ir-summary/1 `models`); a figure it does not state is absent.
  - name: intake.events.SessionModel
    kind: struct
    fields:
      - name: name
        type: String
      - name: input_tokens
        type: Optional<Integer>
      - name: output_tokens
        type: Optional<Integer>
      - name: cache_read_input_tokens
        type: Optional<Integer>
      - name: cache_creation_input_tokens
        type: Optional<Integer>
      - name: cost_usd
        type: Optional<Decimal>

  # One tool call a session made, in its record's order (trace-ir-summary/1 `tool_calls`).
  # `answered` says whether a result names the call; `error` is that result's own error flag.
  - name: intake.events.SessionToolCall
    kind: struct
    fields:
      - name: call_id
        type: Optional<String>
      - name: name
        type: Optional<String>
      - name: answered
        type: Boolean
      - name: error
        type: Optional<Boolean>

  # The one last record: why the run stopped and the exit status the process returns. A run that
  # failed has no stop reason, exit status 1 and the failure's message.
  # story:unperformable-names-actions adds `unperformed_actions`: on a `NoLocalExecutor` stop, the
  # actions no local executor performs, each once. A stop before any case opens (the picked
  # protocol is outside what the run executes, or under action bindings an action has no command)
  # names every such action the protocol declares, in the protocol's order; this is the stop the
  # binary makes. A stop after the case opened, which the runtime ended `NoPerformableAction`,
  # names the actions of the frontier it stopped on, in frontier order. Absent on every other stop
  # and on a run that failed. A new optional field, so the stream stays at schema version 1.
  - name: intake.events.TerminalEvent
    kind: struct
    fields:
      - name: stop_reason
        type: Optional<intake.routing.StopReason>
      - name: exit_status
        type: Integer
      - name: protocol
        type: Optional<String>
      - name: steps
        type: Optional<Integer>
      - name: error
        type: Optional<String>
      - name: unperformed_actions
        type: Optional<List<String>>
