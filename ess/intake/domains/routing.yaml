domain: intake.routing

summary: >-
  An intent as given, the references extracted from its text, the protocol the router proposes
  for it, the slice run that works the intent until it is blocked, and the evidence that run
  submits from what it did itself. A pick is a proposal, never authority.

naming:
  wire: routing
  display: Routing

types:
  - name: intake.routing.IntentId
    kind: newtype
    of: Uuid

  - name: intake.routing.ReferenceKind
    kind: enum
    # What a first-level extractor recognises in an intent. Story intent-references ships these
    # kinds.
    variants: [JiraIssue, SlackMessage, GitlabIssue, GitlabMergeRequest, GithubIssue, GithubPullRequest, Url]

  - name: intake.routing.StopReason
    kind: enum
    # Why a slice run ended: the only useful action needs authority, nothing is admissible, the
    # step budget ran out, the picked protocol has no local executor, or the router refused.
    variants: [ApprovalRequired, NothingAdmissible, StepBudget, NoLocalExecutor, Refused, ConfinementUnavailable, Completed]

  # How much proof a software change must carry: `software.change/1`'s case input `risk`, with the
  # values it declares (`trivial`, `standard`, `elevated`, `critical`, in this order). Each level
  # owes every obligation of the level below it and one more.
  - name: intake.routing.Risk
    kind: enum
    variants: [Trivial, Standard, Elevated, Critical]

  # What a software change is: `software.change/1`'s case input `change_kind`, with the values it
  # declares (`feature`, `bugfix`, `refactor`). A bugfix needs its regression reproduced, a test
  # failing on the current implementation revision, before the implementation is edited.
  - name: intake.routing.ChangeKind
    kind: enum
    variants: [Feature, Bugfix, Refactor]

  # The case inputs the host supplies for a run, as trusted context: from the operator's command
  # line or the embedding caller, never from a model, classifier or router. A `software-change@1`
  # case opens with all three (`risk`, `change_kind`, `affects_security_boundary`, whose values
  # `software.change/1` declares as `true` and `false`); a protocol that declares no case input
  # opens with none of them.
  - name: intake.routing.CaseInputs
    kind: struct
    fields:
      - name: risk
        type: intake.routing.Risk
      - name: change_kind
        type: intake.routing.ChangeKind
      - name: affects_security_boundary
        type: Boolean

  # The kind of an evidence record the slice submits (intake.routing.SliceEvidence), one of the
  # kinds `software.change/1` declares: `test_result`, `regression_test_result` and
  # `implementation_change`, in this order.
  - name: intake.routing.SliceEvidenceKind
    kind: enum
    variants: [TestResult, RegressionTestResult, ImplementationChange]

  # What a test run the slice observed found: `pass` when the test command exited 0, `fail` for
  # any other exit, an end by a signal or a timeout.
  - name: intake.routing.SliceEvidenceResult
    kind: enum
    variants: [Pass, Fail]

  # Commission's ids, mirrored as local newtypes rather than named across systems (as
  # ess/domains/governor.yaml mirrors the case id): commission.responsibility.CommissionId,
  # commission.responsibility.AgentRevisionId and commission.responsibility.CaseId.
  - name: intake.routing.CommissionId
    kind: newtype
    of: Uuid

  - name: intake.routing.AgentRevisionId
    kind: newtype
    of: Uuid

  - name: intake.routing.CaseId
    kind: newtype
    of: String

  # commission.responsibility.ActionRequestId, mirrored as the ids above are: the request a
  # commission's Suspension holds, which a grant names and a merge hand-off performs.
  - name: intake.routing.ActionRequestId
    kind: newtype
    of: Uuid

  # The identity of a Mandate approval (`mandate.delegation.Approval`, Mandate's `ApprovalId`)
  # that `approve --mandate` recorded in the approval event log, and that a grant names.
  - name: intake.routing.MandateApprovalId
    kind: newtype
    of: Uuid

  # One entry of the Mandate approval event log a state directory keeps beside its grants
  # (`mandate-approvals.jsonl`: one entry per line, in the order appended; an entry is appended
  # under the directory's lock, the one the commission's Suspension is held under, and never
  # changed). Mandate v0.9.0 has no command that records an approval, and a consumption persists
  # only when the caller keeps the `mandate.authorization.ApprovedDecisionRecorded` event
  # `check_with_approval` returns and applies it again on load. The log is that keeping:
  # `approve --mandate` appends the approval it records (`ApprovalRecorded`), and
  # `resume --mandate` folds every entry into Mandate's delegation records, asks
  # `check_with_approval` for the request the commission's Suspension holds, and appends the event
  # it returns (`ApprovedDecisionRecorded`) before anything is performed, all under that lock. A
  # crash after the append leaves the approval consumed and the request unperformed: it is never
  # performed twice. The log goes when Mandate records approvals itself.
  - name: intake.routing.MandateApprovalEntry
    kind: union
    tag: kind
    variants:
      ApprovalRecorded: intake.routing.MandateApprovalRecorded
      ApprovedDecisionRecorded: intake.routing.MandateApprovedDecision

  # A Mandate approval (`mandate.delegation.Approval`) as `approve --mandate` records it: the
  # approver's one-use approval of the one request the commission's Suspension holds. The ids are
  # Mandate's: the organization, subject and actor of the verified context the host file names
  # (`loom.authority.MandateHost.verified`), the approver it names. The action is the capability the
  # request needs; the resource is the case, of type `loom.case`, its id derived as
  # `loom.authority.CaseResource` declares. It expires `approval_seconds` after `recorded_at`. The
  # commission and the request it was recorded for are kept beside it; Mandate reads neither.
  - name: intake.routing.MandateApprovalRecorded
    kind: struct
    fields:
      - name: approval
        type: intake.routing.MandateApprovalId
      - name: commission_id
        type: intake.routing.CommissionId
      - name: action_request_id
        type: intake.routing.ActionRequestId
      - name: organization
        type: Uuid
      - name: subject
        type: Uuid
      - name: actor
        type: Optional<Uuid>
      - name: action
        type: String
      - name: resource_type
        type: String
      - name: resource_id
        type: Uuid
      - name: approver
        type: Uuid
      - name: recorded_at
        type: Timestamp
      - name: expires_at
        type: Timestamp

  # `mandate.authorization.ApprovedDecisionRecorded` as `resume --mandate` keeps it: the allowed
  # decision `check_with_approval` took and the approval it consumed. `context` is the verified
  # context the request was made in and `decision` the `mandate.core.Decision`, each as Mandate
  # writes it. Folded on load as Mandate's own delegation fold applies the event, it leaves the
  # approval consumed, so the next `check_with_approval` with it is refused `wrong-state`.
  - name: intake.routing.MandateApprovedDecision
    kind: struct
    fields:
      - name: approval
        type: intake.routing.MandateApprovalId
      - name: commission_id
        type: intake.routing.CommissionId
      - name: action_request_id
        type: intake.routing.ActionRequestId
      - name: context
        type: Json
      - name: decision
        type: Json
      - name: recorded_at
        type: Timestamp

  # One protocol of the catalog a route was accepted on, by its registered name and the SHA-256
  # of its definition.
  - name: intake.routing.CatalogDigest
    kind: struct
    fields:
      - name: name
        type: String
      - name: digest
        type: String

  # A route the router's pick was accepted on, bound to the exact intent, catalog, context policy
  # and threshold it was accepted for: what a delegated run hands its child. A route is never
  # authority; a run restored from one checks it against its own intent, catalog and options.
  - name: intake.routing.AcceptedRoute
    kind: struct
    fields:
      # The accepted protocol, `name@major`.
      - name: protocol
        type: String
      # The intent's revision: the digest the case's `intent` artifact carries.
      - name: intent_revision
        type: String
      # Every protocol of the catalog, in catalog order.
      - name: catalog
        type: List<intake.routing.CatalogDigest>
      - name: context_policy
        type: intake.context.ContextPolicy
      # The router's confidence threshold, from 0 to 1, as the run was given it.
      - name: threshold
        type: Decimal

entities:
  # What someone asked for, as given: a prompt, a request or a question.
  - name: intake.routing.Intent
    identity:
      name: intent_id
      type: intake.routing.IntentId
    fields:
      - name: text
        type: String
    relations:
      - name: references
        kind: owns
        target: intake.routing.ExtractedReference
        cardinality: many
        via: intent_id
      - name: pick
        kind: owns
        target: intake.routing.ProtocolPick
        cardinality: one
        via: intent_id
    lifecycle:
      initial: Received
      states: [Received]
      terminal: [Received]

  # A key element found in the intent's text: a tracker key, a chat permalink, a merge request.
  # It carries the canonical value only; fetching what it points at is the next node's work.
  - name: intake.routing.ExtractedReference
    identity:
      name: reference_id
      type: Uuid
    fields:
      - name: intent_id
        type: intake.routing.IntentId
      - name: kind
        type: intake.routing.ReferenceKind
      - name: value
        type: String
    lifecycle:
      initial: Extracted
      states: [Extracted]
      terminal: [Extracted]

  # The router's proposal: one protocol of the ELS registry, with its confidence and reasons.
  # A proposal, never authority: whoever opens the case checks it.
  - name: intake.routing.ProtocolPick
    identity:
      name: pick_id
      type: Uuid
    fields:
      - name: intent_id
        type: intake.routing.IntentId
      - name: protocol
        type: String
      - name: confidence
        type: Decimal
      - name: reasons
        type: List<String>
    lifecycle:
      initial: Proposed
      states: [Proposed]
      terminal: [Proposed]

  # One run of the vertical slice over a picked protocol, ended for a stated reason.
  - name: intake.routing.SliceRun
    identity:
      name: run_id
      type: Uuid
    fields:
      - name: intent_id
        type: intake.routing.IntentId
      - name: protocol
        type: String
      - name: steps
        type: Integer
      - name: stop_reason
        type: intake.routing.StopReason
      # The actions the run awaits approval for, in frontier order; empty unless it stopped
      # ApprovalRequired.
      - name: approvals
        type: List<String>
      # The case inputs the host supplied for the run (intake.routing.CaseInputs): the values a
      # `software-change@1` case opened with. A protocol that declares no case input ignores them.
      - name: risk
        type: intake.routing.Risk
      - name: change_kind
        type: intake.routing.ChangeKind
      - name: affects_security_boundary
        type: Boolean
      # The host's test-path patterns, trusted context like the inputs, never a model's: globs
      # over a path relative to the workspace root, `*` within one path segment and `**` across
      # any number of them (`run --test-path`, repeatable; by default `tests/**`, `**/tests/**`,
      # `test/**`, `**/test/**`, `**/*_test.*`, `**/test_*.*`, `**/*.test.*`, `**/*.spec.*`).
      # The run performs `tests.write` only when every path it changes matches one of them;
      # otherwise the action is refused, naming the first path outside them, before anything is
      # written or committed. This holds for every change kind; `implementation.edit` is not
      # restricted by them.
      - name: test_paths
        type: List<String>
      # The host's regression-test command, trusted context like the test command, never a
      # model's (`run --regression-test-command`): split at white space like the test command,
      # with `{path}` in at least one word, which the run fills with a path its `tests.write`
      # committed. On a `bugfix` case, after each `tests.run` that comes after a `tests.write`
      # that committed, the run runs it once per test path its `tests.write` actions committed,
      # in the order first committed, and only that command's result is a
      # `regression_test_result`. Absent, no run yields a `regression_test_result`.
      - name: regression_test_command
        type: Optional<String>
    relations:
      - name: intent
        kind: references
        target: intake.routing.Intent
        cardinality: one
        via: intent_id
    lifecycle:
      initial: Ended
      states: [Ended]
      terminal: [Ended]

  # One evidence record the slice submits on a `software-change@1` case, made from what the slice
  # did itself and never from what a model says (Atlas ADR 0074), so that `software.change/1`'s
  # order, independence and age rules can decide on it. Which run produces which kind:
  #
  # - `test_result`: every `tests.run` on a committed revision, its `result` `pass` or `fail`;
  # - `regression_test_result`: the result of the host's regression-test command
  #   (SliceRun.regression_test_command) run on one test path a `tests.write` committed, never of
  #   the suite. On a case whose `change_kind` is `bugfix`, after every `tests.run` that comes
  #   after the run's first `tests.write` that committed, the run runs that command once per
  #   committed test path, each its own observation, and each yields one record citing it. It
  #   rests on trusted inputs only, the case's change kind, the host's command and the run's own
  #   history, never on a model's argument; a run before any `tests.write` that committed, every
  #   run of a `feature` or `refactor` case, and every run of a host that gave no regression-test
  #   command yields none. A `tests.write` that commits nothing (it wrote what the files already
  #   held) writes no regression test, a path whose bytes when the run runs equal its bytes
  #   before the run's first write to it (written with what it held, or written and then
  #   written back) is no committed test path, and a refused one writes nothing;
  # - `implementation_change`: every performed `implementation.edit` that committed, moving the
  #   workspace's `HEAD`, with no `result`. A refused edit, an edit that wrote what the files
  #   already held, and a `tests.write` submit none.
  #
  # A run on uncommitted changes is about no revision and yields no record. `subject_revision` is
  # the implementation revision, the `HEAD`, the record is about: the one the tests ran on, or the
  # new one the edit committed. `observation_id` is the observation the slice delivered for the
  # run or the edit, which the record cites. `observed_at` is the host clock's instant of that
  # observation, in UTC to the second, written into the record; the governor reads no clock for
  # it. Canon orders records by it in whole seconds, so two records observed in one second order
  # `unknown`; the slice therefore keeps its observations' instants strictly increasing in whole
  # seconds: an observation's instant is strictly later, in whole seconds, than the previous
  # observation the run's executor recorded. Before it records an observation whose host-clock
  # second is not later than the previous one's, the executor waits for the host clock to pass
  # that second, at most about 2 seconds; a clock that still has not passed it (one that stepped
  # back) fails the step, naming both instants, before the observation is recorded or any record
  # is submitted for it. An edit already committed stays committed, with no record about it.
  # `producer` is the verifier's, the trusted producer of the submission: the governor
  # gives Canon that producer, never one the record's own facts name.
  - name: intake.routing.SliceEvidence
    identity:
      name: evidence_id
      type: Uuid
    fields:
      - name: kind
        type: intake.routing.SliceEvidenceKind
      - name: subject_revision
        type: String
      # Absent for an `implementation_change`.
      - name: result
        type: Optional<intake.routing.SliceEvidenceResult>
      - name: observation_id
        type: Uuid
      - name: observed_at
        type: Timestamp
      - name: producer
        type: String
    lifecycle:
      initial: Submitted
      states: [Submitted]
      terminal: [Submitted]

  # What a later resume needs to rebuild a commission's run without the arguments of the run that
  # started it, kept by `run --state` beside the case and the commission's Suspension, before the
  # commission runs. The run id and the request a resume continues are in the Suspension, not
  # here. It grants nothing: a resume still needs a grant, and revalidates the request against
  # the case as it is then. The classifier model is not kept: a resume classifies nothing.
  #
  # It is kept before the commission runs, so a run that dies after holding the Suspension still
  # leaves what resumes it. A run that ends without the commission's Suspension held removes it
  # (`DropResumeContext`): nothing can resume that commission. A run that dies before it ends
  # leaves its context without a Suspension, so a reader pairs each context with the commission's
  # Suspension and never takes a kept context alone for one that can be resumed.
  - name: intake.routing.ResumeContext
    identity:
      name: commission_id
      type: intake.routing.CommissionId
    fields:
      - name: case_id
        type: intake.routing.CaseId
      - name: agent_revision_id
        type: intake.routing.AgentRevisionId
      # The intent, as given.
      - name: intent
        type: String
      - name: route
        type: intake.routing.AcceptedRoute
      # The workspace the case is about; absent for a protocol that needs none.
      - name: workspace
        type: Optional<String>
      # The test command: the program, then its arguments.
      - name: test_command
        type: List<String>
      # The host's test-path patterns the run's `tests.write` is held to (SliceRun.test_paths),
      # so a resume holds the commission's `tests.write` to the same paths.
      - name: test_paths
        type: List<String>
      # The host's regression-test command (SliceRun.regression_test_command), as given, so a
      # resume runs the commission's regression tests with the same command; absent when the run
      # was given none.
      - name: regression_test_command
        type: Optional<String>
      - name: max_steps
        type: Integer
      # How the test command is confined, and the delegated cgroup root, when one was given.
      - name: confinement
        type: intake.confinement.Backend
      - name: cgroup_root
        type: Optional<String>
      # The agent model: a Codex model name, with `catalog` a route alias of that llm catalog, or
      # with `config` the name the configuration's routes document serves the role `agent` by
      # (a `--model` override included).
      - name: model
        type: String
      - name: catalog
        type: Optional<String>
      # The absolute path of the models configuration (`run --config`) the agent model is a name
      # of; absent for a context kept before it was declared (0.25.0 and earlier) and for a run
      # given none. A context naming both `config` and `catalog` is refused when it is read.
      - name: config
        type: Optional<String>
    lifecycle:
      initial: Kept
      states: [Kept]
      terminal: [Kept]

  # An operator's approval of the one request a commission's Suspension holds, written by
  # `approve` into the directory `run --state` keeps the commission in, and read by `resume`
  # through an authority provider over it. It mirrors commission.responsibility.AuthorityDecision
  # (the action, whether it is granted, the request it belongs to) and names the commission, the
  # capability the request needs and when it was granted. Approval performs nothing: a resume
  # performs the request, after revalidating it against the case as it is then.
  #
  # A grant allows only the request it names: a resume allows the capability only while the
  # commission's Suspension is held for that request, so a grant for another request, or a request
  # proposed again later in the resumed run, is not allowed by it. One grant is kept per
  # commission; a later approval of the commission's next Suspension replaces it.
  #
  # `mandate_approval` names the Mandate approval the grant carries: the one `approve --mandate
  # <FILE>` recorded in the approval event log (intake.routing.MandateApprovalRecorded) for the
  # request. A grant `approve` wrote without `--mandate` names none, and its document has no such
  # member, as on 0.20.0. `resume --mandate <FILE>` refuses a grant that names none, and allows the
  # request only when Mandate's `check_with_approval` clears and consumes the approval it names.
  # Only Mandate clears a grant that names an approval: a `resume` without `--mandate` refuses it
  # (Commission's `NotGranted`) and performs nothing, leaving the approval unconsumed; it reads a grant
  # that names none as on 0.20.0.
  - name: intake.routing.Grant
    identity:
      name: commission_id
      type: intake.routing.CommissionId
    fields:
      # The request's action, as the Suspension holds it.
      - name: action
        type: String
      # The capability the request needs authority for, as the operator approved it.
      - name: capability
        type: String
      - name: granted
        type: Boolean
      - name: action_request_id
        type: intake.routing.ActionRequestId
      - name: granted_at
        type: Timestamp
      - name: mandate_approval
        type: Optional<intake.routing.MandateApprovalId>
    lifecycle:
      initial: Granted
      states: [Granted]
      terminal: [Granted]

  # The hand-off a granted `repository.merge` performs on resume: the commission, the granted
  # request, the workspace and its `HEAD` as the implementation revision, recorded in the state
  # directory. No Git ref moves; merging happens outside Loom. One is recorded per request, so a
  # request performed once leaves exactly one, and one per `HEAD` of a commission: a merge the
  # agent proposes again at a `HEAD` the commission already handed off is not handed off again:
  # the resume holds no Suspension for it (Commission's `HoldSuspension` answers `settled`), so
  # nothing is left to approve, and `approve` still refuses a Suspension that would hand off such
  # a `HEAD` (`HeadAlreadyHandedOff`). New work, a new `HEAD`, may be handed off.
  - name: intake.routing.MergeHandoff
    identity:
      name: action_request_id
      type: intake.routing.ActionRequestId
    fields:
      - name: commission_id
        type: intake.routing.CommissionId
      # The workspace, as the resume context keeps it.
      - name: workspace
        type: String
      # The workspace's `HEAD` commit when the request was performed.
      - name: head
        type: String
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

errors:
  # No resume context is kept for the commission.
  - name: intake.routing.ResumeContextNotFound
    fields:
      - name: commission_id
        type: intake.routing.CommissionId

  # The resume context store could not remove the context: why, as the store reports it.
  - name: intake.routing.ResumeContextStorageFailed
    fields:
      - name: reason
        type: String

  # A merge hand-off is already recorded for the request: it was performed, and is not again.
  - name: intake.routing.MergeHandoffAlreadyRecorded
    fields:
      - name: action_request_id
        type: intake.routing.ActionRequestId

  # The commission already handed off this `HEAD`, under another request: the same work is not
  # handed off twice.
  - name: intake.routing.HeadAlreadyHandedOff
    fields:
      - name: commission_id
        type: intake.routing.CommissionId
      - name: head
        type: String

  # The merge hand-off could not be recorded: why, as the store reports it.
  - name: intake.routing.MergeHandoffStorageFailed
    fields:
      - name: reason
        type: String

commands:
  # A run that ends without the commission's Suspension held removes the commission's resume
  # context: nothing can resume the commission. A run that holds the Suspension keeps it.
  - name: intake.routing.DropResumeContext
    input:
      - name: commission_id
        type: intake.routing.CommissionId
    outcomes:
      - name: dropped
        deletes: intake.routing.ResumeContext
        instance: commission_id
      - name: not-found
        unknown_instance: true
        error: intake.routing.ResumeContextNotFound
        payload:
          intake.routing.ResumeContextNotFound:
            commission_id: input.commission_id
      - name: storage-failed
        external: the resume context store cannot remove the context
        error: intake.routing.ResumeContextStorageFailed

  # A granted `repository.merge` is performed by recording its hand-off, once per request and once
  # per `HEAD` of a commission: a second record for the same request, or for a `HEAD` the
  # commission already handed off under another request, is refused and changes nothing.
  - name: intake.routing.RecordMergeHandoff
    input:
      - name: action_request_id
        type: intake.routing.ActionRequestId
      - name: commission_id
        type: intake.routing.CommissionId
      - name: workspace
        type: String
      - name: head
        type: String
    outcomes:
      - name: already-recorded
        existing_instance: true
        error: intake.routing.MergeHandoffAlreadyRecorded
        payload:
          intake.routing.MergeHandoffAlreadyRecorded:
            action_request_id: input.action_request_id
      - name: head-already-handed-off
        when_related:
          entity: intake.routing.MergeHandoff
          where:
            all: [commission_id == input.commission_id, head == input.head]
          exists: true
        error: intake.routing.HeadAlreadyHandedOff
        payload:
          intake.routing.HeadAlreadyHandedOff:
            commission_id: input.commission_id
            head: input.head
      - name: recorded
        creates: intake.routing.MergeHandoff
        instance: action_request_id
        sets:
          commission_id: input.commission_id
          workspace: input.workspace
          head: input.head
        emits: [intake.routing.MergeHandedOff]
        payload:
          intake.routing.MergeHandedOff:
            action_request_id: input.action_request_id
            commission_id: input.commission_id
            workspace: input.workspace
            head: input.head
      - name: storage-failed
        external: the state directory cannot record the hand-off
        error: intake.routing.MergeHandoffStorageFailed

events:
  # A granted merge was handed off: its record names the request, the commission, the workspace
  # and its `HEAD`.
  - name: intake.routing.MergeHandedOff
    fields:
      - name: action_request_id
        type: intake.routing.ActionRequestId
      - name: commission_id
        type: intake.routing.CommissionId
      - name: workspace
        type: String
      - name: head
        type: String
