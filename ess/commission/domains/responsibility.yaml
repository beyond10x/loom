# Draft domain for Commission (story M-001). Nouns and relations are read from
# docs/commission/design/commission-design.md, docs/commission/contracts/{commission-executor,frontier,evidence}.md and
# Atlas ADR 0070. A relation the sources do not settle stays out of the model until a story decides
# it; its open question is a decision-blocker in the planning store, not a note here (Atlas ADR
# 0076). One lifecycle state per entity until a command outcome moves it.
domain: commission.responsibility

summary: >-
  An agent revision commissioned to a durable case. The governor owns the case's truth and returns
  a frontier; a run is one bounded period of execution against it. The executor proposes; it never
  completes a case.

naming:
  wire: responsibility
  display: Responsibility

types:
  - name: commission.responsibility.AgentId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.AgentRevisionId
    kind: newtype
    of: Uuid

  # A case id is issued by the governor (for example AEP) and is opaque here.
  - name: commission.responsibility.CaseId
    kind: newtype
    of: String

  - name: commission.responsibility.CommissionId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.RunId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.FrontierId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.EvidenceId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.ObservationId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.AuthorityDecisionId
    kind: newtype
    of: Uuid

  - name: commission.responsibility.ActionRequestId
    kind: newtype
    of: Uuid

  # The principal a commission acts for. Commission-local (operator, 2026-10-04).
  - name: commission.responsibility.PrincipalId
    kind: newtype
    of: String

  # What the principal delegated to this commission. Commission-local (operator, 2026-10-04). It is
  # opaque to Commission: passed to the AuthorityProvider unchanged and read by nobody else.
  - name: commission.responsibility.AuthorityContext
    kind: newtype
    of: Json

  # The payload of a union variant that carries nothing; its value is always true. A stand-in until
  # ESS supports unit variants, removed then (story:port-skeleton, coordinator decision 1).
  - name: commission.responsibility.Unit
    kind: newtype
    of: Boolean

  # story:governor-port: why a governor could not answer.
  # story:hosted-governor: unavailable includes failed case-store reads/writes and failed
  # trusted evaluation-time lookup. Neither may be reported as an unknown case, a successful
  # evidence/observation write, or an instruction to retry case-id allocation. Protocols are
  # host-admitted Canon definitions; models cannot replace them or supply evaluation time.
  - name: commission.responsibility.GovernorError
    kind: enum
    variants: [UnknownCase, GovernorUnavailable]

  # story:governor-port: whether the governor holds a case complete. Completion is the governor's
  # determination, never the executor's.
  - name: commission.responsibility.CompletionDetermination
    kind: union
    tag: kind
    variants:
      Open: commission.responsibility.Unit
      Complete: commission.responsibility.CompletionDeterminationComplete

  # The governor's outcome identifier, as the governor reports it.
  - name: commission.responsibility.CompletionDeterminationComplete
    kind: struct
    fields:
      - name: outcome
        type: String

  # docs/commission/contracts/commission-executor.md: the arguments of a proposed action, as the model wrote them.
  - name: commission.responsibility.ProposedActionArguments
    kind: newtype
    of: Json

  # What a human is asked to decide. Commission's sources declare no structure for it.
  - name: commission.responsibility.HumanDecisionRequest
    kind: newtype
    of: Json

  # docs/history/beyond10x-agent-sdk-design-pre-commission-name.md:1477-1485: why a run is
  # suspended. A payload Commission's sources declare nowhere is carried as Json, and no entity is
  # invented for it.
  #
  # story:budget-stop-cause adds LoopBudget: an executor's model loop stopped on one of its own
  # budgets (turns, input or output tokens, cost, wall time, or a ceiling it could no longer
  # observe). Its payload is the loop's stop as the executor's specification writes it, tagged
  # `kind` with that cause's figures beside it (for Loom, loom.run.LoopStop, for example
  # {"kind": "max-input-tokens", "limit": 100, "reported": 150}); Commission's own specification
  # cannot name another system's type, so it is Json. Distinct from Budget, which a run's own
  # budgets suspend for.
  #
  # story:run-and-action-budgets adds RunBudget: a run or action budget the host set was reached
  # (`Budget` stays the step budget's and a model-loop budget's).
  #
  # story:host-stop-before-step adds HostStop: the host stopped the run before a step, for a reason
  # only the host can read (HostStop). The runtime asks the host where it reads the run's deadline
  # before a step, right after the deadline: before each executor call and before a pending request
  # is invoked again, and on a resume before the Suspension is taken and right before the held
  # request is invoked. A stop suspends the Run for HostStop, the run ending Suspended, or Waiting
  # while a request is pending (`JudgeBudgetStop`), as at any budget stop; on a resume, one before
  # the take takes nothing and leaves the Suspension Pending, and one right before the invoke
  # releases the Suspension and performs nothing. A host that supplies no stop is never stopped.
  # story:host-stop-when-a-step-follows: the host is asked only where a step would follow the
  # admissibility and authority checks. Before an executor call it is asked, after the deadline,
  # only when the frontier the executor is handed admits an action without a grant. When that
  # frontier admits none (each action it lists needs a grant or is blocked, or it lists none), the
  # executor runs unasked, and the run ends as the authority or admissibility outcome says
  # (NeedsAuthority, NoAdmissibleAction), never HostStop. A request admitted after such a call, the
  # authority provider's allow included, is asked about once the case revision was read again and
  # right before the effect is invoked: a stop there suspends the Run for HostStop, the run ending
  # Suspended, with nothing invoked. The deadline stays where it was read, a pending request is
  # still asked about before it is invoked again and a resume as above; no effect is invoked past
  # a host stop.
  - name: commission.responsibility.SuspensionReason
    kind: union
    tag: kind
    variants:
      Authority: Json
      Human: commission.responsibility.HumanDecisionRequest
      Evidence: List<String>
      Time: Json
      Dependency: List<commission.responsibility.CaseId>
      Budget: Json
      LoopBudget: Json
      ExternalAvailability: Json
      RunBudget: commission.responsibility.RunBudgetBreach
      HostStop: commission.responsibility.HostStop

  # story:host-stop-before-step: why the host stopped a run before a step, as the host names it.
  # `name` is the host's label for the stop (for takt, ActiveTime, its wall time less its own
  # pauses inside an effect, or DiskLow, the free space of a file system under its threshold);
  # `detail` is the host's own data about it, which Commission carries and never reads. Commission
  # measures neither: it reads no disk and sees no pause inside an effect. The host supplies the
  # stop, asked once per check and never after the run ended; the model never supplies it.
  # story:host-stop-when-a-step-follows: "before a step" is before a step that follows the
  # admissibility and authority checks: before the executor call when its frontier admits an
  # action without a grant, otherwise right before an admitted request's effect is invoked.
  - name: commission.responsibility.HostStop
    kind: struct
    fields:
      - name: name
        type: String
      - name: detail
        type: Json

  # docs/commission/contracts/commission-executor.md: what an executor may hand back. It proposes; it never
  # completes a case. story:executor-reports-usage: the runtime takes it in an ExecutorStep, beside
  # what the call reports it spent.
  - name: commission.responsibility.ExecutorOutcome
    kind: union
    tag: kind
    variants:
      ProposedAction: commission.responsibility.ExecutorOutcomeProposedAction
      ProposedReads: commission.responsibility.ExecutorOutcomeProposedReads
      NeedsHumanJudgment: commission.responsibility.ExecutorOutcomeNeedsHumanJudgment
      Suspended: commission.responsibility.ExecutorOutcomeSuspended
      NoUsefulAction: commission.responsibility.Unit
      CompletedLocalReasoning: commission.responsibility.Unit
      CaseMoved: commission.responsibility.ExecutorOutcomeCaseMoved

  # The action is a FrontierAction's `action`; identity, authority and case revision are not part
  # of a proposal (AGENTS.md § Rules).
  - name: commission.responsibility.ExecutorOutcomeProposedAction
    kind: struct
    fields:
      - name: action
        type: String
      - name: arguments
        type: commission.responsibility.ProposedActionArguments

  # story:dw-read-fanout (architecture-decision-record:read-fan-out): several reads proposed
  # together, non-empty and at most 16, each an action and its arguments as in a single proposal.
  # A read is an action the effect port reports it reads (for a Connector-backed port, one whose
  # binding's `effect` is `Read`). The runtime admits the fan-out only when every listed action is
  # a read, the frontier the executor was handed lists it admissible, needing no authority, and no
  # two reads list the same action and arguments; otherwise the whole proposal is refused and
  # nothing is invoked. A Connector-backed port invokes a fan-out only through bindings whose
  # `effect` is `Read`, and one holding any other invokes nothing. Each admitted read becomes its
  # own ActionRequest of the Run at the frontier's revision and is revalidated before any is
  # invoked; one that fails revalidation is refused and not invoked, and the others are invoked
  # concurrently, each once, through its binding, and recorded in the order proposed. A read whose
  # revalidation answers stale shows that somebody else moved the case: after the others are
  # recorded the move is judged as after a stale single proposal (CaseMovedOn when the moved case
  # still admits an action), never adopted as one the Run's own effect made. Writes, and any action
  # that needs authority, are proposed one at a time.
  - name: commission.responsibility.ExecutorOutcomeProposedReads
    kind: struct
    fields:
      - name: reads
        type: List<commission.responsibility.ExecutorOutcomeProposedAction>

  - name: commission.responsibility.ExecutorOutcomeNeedsHumanJudgment
    kind: struct
    fields:
      - name: request
        type: commission.responsibility.HumanDecisionRequest

  - name: commission.responsibility.ExecutorOutcomeSuspended
    kind: struct
    fields:
      - name: reason
        type: commission.responsibility.SuspensionReason

  # story:moved-case-outcome (decision-blocker:run-stale-outcome, C): the case moved to another
  # revision while the executor worked, so it proposes nothing. Names the revision of the frontier
  # it was handed. The runtime reads the current revision and frontier from the governor, never
  # from this outcome, and judges the run on them.
  - name: commission.responsibility.ExecutorOutcomeCaseMoved
    kind: struct
    fields:
      - name: expected_case_revision
        type: Integer

  # story:executor-reports-usage: what one executor call reports it spent, as a performed effect
  # reports its usage (EffectUsage): the input and output tokens, the wall time in milliseconds and
  # the cost in millionths of a US dollar. A cost the executor could not price is absent, never
  # zero. An executor that is not a model loop (an agent session, a remote executor) reports it. One
  # whose model calls go through a metered model port of the run reports none of them, since the
  # port counted them already, so nothing is counted twice.
  - name: commission.responsibility.ExecutorUsage
    kind: struct
    fields:
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: duration_ms
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>

  # story:executor-reports-usage: one executor call as the runtime takes it, the step: what the
  # executor proposes (`outcome`) and what the call reports it spent (`usage`, absent when it
  # reports nothing). The runtime charges the usage to the run as it charges a performed effect's
  # usage (a negative figure charges nothing, and a usage with no cost leaves the run's cost
  # unknown), never to an action and never as a trial, and delivers it in the step's observation as
  # `usage`. Once the step was observed, the run budget's spending limits are checked: a charge past
  # one ends the run there, before the outcome is acted on (no request is made from it, and an
  # executor's own suspension is not the Run's), the Run suspended for `RunBudget` naming the limit.
  # story:run-budget-tokens-and-deadline: that is the stop policy's DiscardStep, the default; under
  # its KeepStep the outcome is acted on and the Run is suspended for the breach before the next
  # step, unless the outcome ends the run.
  # story:metaharness-session-executor: an agent session's step also names its trace and what the
  # session said it did, each absent when the executor states none: `transcript_digest`, the SHA-256
  # of the session's transcript as lowercase hex, and `summary`, the session's one line. The runtime
  # delivers both in the step's observation beside `usage`; neither is evidence, and neither is part
  # of the proposed action, so two sessions proposing the same change are the same request.
  - name: commission.responsibility.ExecutorStep
    kind: struct
    fields:
      - name: outcome
        type: commission.responsibility.ExecutorOutcome
      - name: usage
        type: Optional<commission.responsibility.ExecutorUsage>
      - name: transcript_digest
        type: Optional<String>
      - name: summary
        type: Optional<String>

  # story:authority-provider-port: what an AuthorityProvider answers at the call. Distinct from the
  # stored AuthorityDecision entity.
  - name: commission.responsibility.AuthorityVerdict
    kind: union
    tag: kind
    variants:
      Allow: commission.responsibility.Unit
      Deny: commission.responsibility.AuthorityVerdictDeny
      ApprovalRequired: commission.responsibility.AuthorityVerdictApprovalRequired

  - name: commission.responsibility.AuthorityVerdictDeny
    kind: struct
    fields:
      - name: reason
        type: String

  - name: commission.responsibility.AuthorityVerdictApprovalRequired
    kind: struct
    fields:
      - name: request
        type: String

  # story:run-outcomes: how a run ended or paused. story:runtime-merge adds AwaitingApproval (a
  # step left a frontier listing actions that need approval unchanged; a step whose request needed
  # authority, was allowed by the authority provider and performed is not one, and the run goes
  # on, story:granted-gate-ends-run) and NoPerformableAction
  # (the frontier lists no action the effect port performs, so no executor is run). An empty
  # frontier goes to the executor; only a non-empty frontier none of whose actions the effect port
  # performs ends NoPerformableAction. story:moved-run-named-outcome adds CaseMovedOn (the case
  # moved to a revision whose frontier still admits an action; the run stays bound to its own
  # revision, and the caller starts a new run at the current one). story:refused-effect-ends-run adds
  # EffectRefused (the effect port refused an admitted request as final, `ends_run`).
  # story:idle-bound-outcome adds IdleBound (a run with no step budget made no progress for as many
  # iterations in a row as the idle bound allows, `JudgeIdleIteration`, `bound`, where it would
  # otherwise go on: a case its own performed effect completed ends it Completed);
  # NoAdmissibleAction stays for a frontier that admits nothing.
  # story:unperformable-names-actions gives NoPerformableAction its payload
  # (RunOutcomeNoPerformableAction): the actions no effect performs and the frontier's open claims,
  # as `JudgePerformableActions` answers `unperformable` for them.
  # story:pending-effect adds Waiting (a budget ended the run while the effect port's last answer
  # for a request was Pending, `JudgeBudgetStop`, `waiting`): where the run would otherwise be
  # Suspended for that budget, it names the pending requests and the budget's reason.
  # story:pending-answer-ends-run: a run also ends Waiting when the effect port answers Pending
  # with `ends_run`, the reason Time carrying the port's report.
  - name: commission.responsibility.RunOutcome
    kind: union
    tag: kind
    variants:
      Completed: commission.responsibility.RunOutcomeCompleted
      Suspended: commission.responsibility.RunOutcomeSuspended
      NeedsAuthority: commission.responsibility.RunOutcomeNeedsAuthority
      NeedsHumanJudgment: commission.responsibility.RunOutcomeNeedsHumanJudgment
      NeedsExternalEvidence: commission.responsibility.RunOutcomeNeedsExternalEvidence
      NoAdmissibleAction: commission.responsibility.Unit
      AwaitingApproval: commission.responsibility.RunOutcomeAwaitingApproval
      NoPerformableAction: commission.responsibility.RunOutcomeNoPerformableAction
      CaseMovedOn: commission.responsibility.RunOutcomeCaseMovedOn
      EffectRefused: commission.responsibility.RunOutcomeEffectRefused
      IdleBound: commission.responsibility.RunOutcomeIdleBound
      Waiting: commission.responsibility.RunOutcomeWaiting

  # The governor's outcome identifier, as the governor reports it.
  - name: commission.responsibility.RunOutcomeCompleted
    kind: struct
    fields:
      - name: outcome
        type: String

  - name: commission.responsibility.RunOutcomeSuspended
    kind: struct
    fields:
      - name: reason
        type: commission.responsibility.SuspensionReason

  - name: commission.responsibility.RunOutcomeNeedsAuthority
    kind: struct
    fields:
      - name: request
        type: String

  - name: commission.responsibility.RunOutcomeNeedsHumanJudgment
    kind: struct
    fields:
      - name: request
        type: commission.responsibility.HumanDecisionRequest

  - name: commission.responsibility.RunOutcomeNeedsExternalEvidence
    kind: struct
    fields:
      - name: requirements
        type: List<String>

  # story:moved-run-named-outcome (decision-blocker:moved-run-admissible-frontier, A): the revision
  # the run is bound to (the run's case_revision) and the current revision the runtime loaded,
  # whose frontier still admits an action.
  - name: commission.responsibility.RunOutcomeCaseMovedOn
    kind: struct
    fields:
      - name: bound_case_revision
        type: Integer
      - name: current_case_revision
        type: Integer

  # story:refused-effect-ends-run: the admitted request the effect port refused as final and the
  # reason it gave, as `JudgeEffectRefusal` answers `final` for it.
  - name: commission.responsibility.RunOutcomeEffectRefused
    kind: struct
    fields:
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: reason
        type: String

  # story:idle-bound-outcome: the idle iterations in a row that ended the run, as
  # `JudgeIdleIteration` answers `bound` for them.
  - name: commission.responsibility.RunOutcomeIdleBound
    kind: struct
    fields:
      - name: idle_iterations
        type: Integer

  # story:stop-policy-gate-and-idle-bound: how a run stops where its frontier does not change. The
  # host supplies it, per run; the model never does. `approval_gate` true, the default, keeps the
  # approval gate: a step that leaves unchanged a frontier listing actions that need approval ends
  # the run AwaitingApproval. False turns the gate off: such a step goes to the executor and is
  # judged as any other step, idle when it admitted no new request; authority is untouched, so a
  # request needing approval is still asked about and one the provider does not allow is never
  # handed to the effect port. `idle_bound` is how many idle iterations in a row end the run
  # IdleBound (`JudgeIdleIteration`, `bound`), with or without a step budget; a value below 1 is
  # read as 1, so it never turns the bound off. Absent, the default, the bound is two and applies
  # only to a run with no step budget.
  # story:run-budget-tokens-and-deadline: `on_breach` is what becomes of an executor step whose
  # reported usage took the run past a spending limit of its RunBudget (ExecutorStep), or that
  # ended at or after its deadline. DiscardStep, the default, ends the run before the step's
  # outcome is acted on. KeepStep acts on it as with no breach, and suspends the Run for the breach
  # before the next step.
  # story:breach-choice-per-limit: `breach_by_limit` chooses per limit of the run budget. A limit
  # it lists takes its own `step`; a limit it does not list takes `on_breach`, so the empty list,
  # the default, gives `on_breach` for every limit. A limit listed twice is refused before the Run
  # starts, naming the limit. MaxSteps and MaxTrials are count limits that stop the run before a
  # step and are never an executor step's breach: listing them is allowed and changes nothing.
  - name: commission.responsibility.StopPolicy
    kind: struct
    fields:
      - name: approval_gate
        type: Boolean
      - name: idle_bound
        type: Optional<Integer>
      - name: on_breach
        type: commission.responsibility.BreachStep
      - name: breach_by_limit
        type: List<commission.responsibility.LimitBreachStep>

  # story:breach-choice-per-limit: what becomes of an executor step that breached `limit`, the
  # host's choice for that limit alone (StopPolicy.breach_by_limit).
  - name: commission.responsibility.LimitBreachStep
    kind: struct
    fields:
      - name: limit
        type: commission.responsibility.BudgetLimit
      - name: step
        type: commission.responsibility.BreachStep

  # story:run-budget-tokens-and-deadline: what becomes of an executor step whose reported usage
  # took the run past a spending limit, or whose call ended at or after the run's deadline (the
  # trusted time read once the step was observed). DiscardStep: the Run is suspended for the
  # breach once the step was observed, and its outcome is not acted on; its proposal is never
  # revalidated or performed. KeepStep: the step's outcome is acted on as with no breach (a
  # proposal is revalidated, asked about and performed only when admitted), and where the run
  # would then go on the Run is suspended for the breach before the next step; a step whose outcome
  # ends the run ends it with that outcome. KeepStep performs a proposal after a spending limit or
  # the deadline was passed. A spending limit is checked first, so a step past both is suspended
  # for the spending limit. An effect's own usage breach is the same under both: that effect is
  # already performed.
  # story:breach-choice-per-limit: once an executor call was observed, every run limit it breached
  # is collected, the spending limits in the order they are checked and then the deadline, which
  # is read whether or not a spending breach was kept; each takes its own choice
  # (StopPolicy.breach_by_limit, else `on_breach`). The step is discarded when any breached limit's
  # choice is DiscardStep, and the Run is suspended for the first breached limit whose choice is
  # DiscardStep. When every breached limit's choice is KeepStep the step is kept, and the Run is
  # suspended before the next step for the first breached limit.
  - name: commission.responsibility.BreachStep
    kind: enum
    variants: [DiscardStep, KeepStep]

  # story:unperformable-names-actions: what no effect performs, as `JudgePerformableActions`
  # answers `unperformable` for it. `actions` are the actions the run needed performed that the
  # effect port does not perform, each once, in frontier order: every action a frontier lists, when
  # the port performs none of them, or the action of an admitted request the port does not perform.
  # `open_claims` are the claims of that frontier whose value is not True, in frontier order. The
  # frontier relates no action to a claim, so the open claims are the frontier's, not any one
  # action's; a host that knows the protocol relates them. Commission names what is missing and
  # decides nothing about who performs it.
  - name: commission.responsibility.RunOutcomeNoPerformableAction
    kind: struct
    fields:
      - name: actions
        type: List<String>
      - name: open_claims
        type: List<String>

  # story:pending-effect: the requests the effect port last answered Pending when a budget ended
  # the run, in the order they were made (one, or the pending reads of one fan-out), and the reason
  # the Run was suspended for that budget, as `JudgeBudgetStop` answers `waiting` for them.
  # story:pending-answer-ends-run: or the requests pending when the effect port answered Pending
  # with `ends_run` (EffectOutcomePending): the request so answered, or every read of its fan-out
  # answered Pending, in proposal order, and the reason Time carrying the report of the first that
  # asked to end the run; a run budget breach found after the same answer ends the run first, with
  # the breach as the reason.
  # story:host-stop-before-step: or the requests pending when the host stopped the run before
  # invoking them again, and the reason HostStop as the host named it.
  - name: commission.responsibility.RunOutcomeWaiting
    kind: struct
    fields:
      - name: action_request_ids
        type: List<commission.responsibility.ActionRequestId>
      - name: reason
        type: commission.responsibility.SuspensionReason

  # story:runtime-merge: the actions that need approval, in frontier order, on a frontier a step
  # left unchanged; none of them was denied by an authority verdict in the run.
  - name: commission.responsibility.RunOutcomeAwaitingApproval
    kind: struct
    fields:
      - name: actions
        type: List<String>

  # story:runtime-merge (Atlas ADR 0082): what the effect port reports for one admitted action
  # request it was handed. The runtime delivers it to the governor as an observation, never as
  # evidence. story:pending-effect adds Pending (EffectOutcomePending): the work the request
  # started has not finished, and the port asks to be invoked again for the same request.
  - name: commission.responsibility.EffectOutcome
    kind: union
    tag: kind
    variants:
      Performed: commission.responsibility.EffectOutcomePerformed
      Refused: commission.responsibility.EffectOutcomeRefused
      Pending: commission.responsibility.EffectOutcomePending

  # story:pending-effect: the effect port started the work the admitted request asks for (a CI job,
  # a review) and it has not finished: observe again. `report` is what the port saw of it so far.
  # The runtime invokes the same request again, under its own id and at its own revision, at the
  # next iteration of the run, until the port answers Performed or Refused, revalidating it before
  # each invocation exactly as before the first: a request whose case moved, that the frontier no
  # longer admits, or whose authority the provider no longer allows is not invoked again. No wait
  # or timer comes between two invocations; how long one takes is the port's. Each invocation is a
  # step and one trial of the request's action against the run budget, and each answer is recorded
  # and delivered as one observation, never as evidence. A pending answer is no idle iteration and
  # leaves the count of idle iterations where it was (`JudgeIdleIteration`): the step that admitted
  # the request is judged once the port answers otherwise. A budget that ends the run while a
  # request is pending ends it Waiting, naming the request (`JudgeBudgetStop`). Nothing it reports
  # was performed, so the case moves only after a Performed.
  # story:pending-answer-ends-run: `ends_run` asks the runtime not to invoke the request again in
  # this run: once the answer was recorded, charged and observed, and the run budget's spending
  # limits checked (a breach ends the run as at any budget stop), the run ends Waiting, naming the
  # request, the Run suspended through `SuspendRun` for the reason Time carrying this `report`
  # (`JudgeBudgetStop`, `waiting`). In a fan-out the run ends so once every read joined, naming
  # every read answered Pending, in proposal order, with the report of the first that asked to end
  # the run. A resumed request answered so releases its Suspension first. False is today's answer:
  # the request is invoked again. How a host continues such a run is the host's.
  - name: commission.responsibility.EffectOutcomePending
    kind: struct
    fields:
      - name: report
        type: Json
      - name: ends_run
        type: Boolean

  # What the effect did, as the effect port reports it. Commission declares no structure for it.
  # story:effect-invocation (decision-blocker:invocation-attempt-record, A): the one Connector
  # attempt the invocation produced, present exactly when the effect was invoked through a
  # Connector operation whose binding's effect is Write; an effect port that reaches no Connector
  # names none. A request refused at the recheck is never invoked and names none; a retry is a new
  # action request.
  # story:connector-read-performed: Connectors records an attempt only for a write. The
  # invocation of a binding whose effect is Read names, instead of an attempt, the execution audit
  # record Connectors completed for it; `audit` is present exactly then. A Performed of a Connector
  # binding names exactly one of the two, the one its binding's effect requires.
  # story:run-and-action-budgets: `usage` is what the effect reports it spent on its own model
  # calls, charged to the run and to the request's action; absent when it spent nothing it meters.
  - name: commission.responsibility.EffectOutcomePerformed
    kind: struct
    fields:
      - name: report
        type: Json
      - name: attempt
        type: Optional<commission.responsibility.ConnectorAttemptId>
      - name: audit
        type: Optional<commission.responsibility.ConnectorAuditRef>
      - name: usage
        type: Optional<commission.responsibility.EffectUsage>

  # story:run-and-action-budgets: what one performed effect reports it spent on its own model
  # calls, which the runtime charges to the run and to the effect's action: the input and output
  # tokens, the wall time in milliseconds, and the cost in millionths of a US dollar. A cost the
  # effect could not price is absent, never zero. An effect that spent nothing it meters reports
  # no usage at all.
  - name: commission.responsibility.EffectUsage
    kind: struct
    fields:
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: duration_ms
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>

  # story:run-and-action-budgets: the limits of one action of a run, every one optional (absent is
  # no limit). `max_trials` bounds how often a request for the action is handed to the effect
  # port; the others bound what the action's performed effects reported they spent.
  - name: commission.responsibility.ActionBudget
    kind: struct
    fields:
      - name: action
        type: String
      - name: max_trials
        type: Optional<Integer>
      - name: max_tokens_in
        type: Optional<Integer>
      - name: max_tokens_out
        type: Optional<Integer>
      - name: max_duration_ms
        type: Optional<Integer>
      - name: max_cost_micro_usd
        type: Optional<Integer>

  # story:run-and-action-budgets: the limits of one run, every one optional (absent is no limit),
  # and the limits of each action it lists, at most one entry per action. `max_steps` bounds the
  # executor calls as the step budget does; the others bound what every performed effect of the
  # run reported it spent, and, for the run's own limits, what its executor calls reported they
  # spent (story:executor-reports-usage, ExecutorStep). The host supplies it; the model never does.
  # story:run-budget-tokens-and-deadline: `max_tokens` bounds the input and output tokens charged
  # to the run together, from its effects and its executor calls, checked with the other spending
  # limits. `deadline` is an RFC 3339 instant read against the trusted time (`now`) before each
  # step: before each executor call and before a pending request is invoked again. At or after it,
  # the Run is suspended for the deadline (limit Deadline), the run ending Suspended, or Waiting
  # while a request is pending, as at any budget stop. It is read again once an executor call was
  # observed, before its outcome is acted on: a call that ended at or after it is a breach the
  # stop policy's `on_breach` decides, as for a spending limit, so by default nothing it proposed
  # is performed. A deadline that is not RFC 3339 is refused
  # before the Run starts. Neither is an action's limit: ActionBudget has no counterpart.
  # story:pending-answer-ends-run: a resumed request is checked against the deadline too, before
  # its Suspension is taken and again right before the request is invoked, where the case revision
  # is read again. At or after the deadline the first takes nothing and the Suspension stays
  # Pending; the second releases the Suspension; neither performs anything, and the resume ends as
  # a passed deadline ends a run before an executor call.
  # story:breach-choice-per-limit: the stop policy decides an executor call's breach per limit
  # (`breach_by_limit`, else `on_breach`), the deadline read after the call whether or not a
  # spending breach was kept.
  - name: commission.responsibility.RunBudget
    kind: struct
    fields:
      - name: max_steps
        type: Optional<Integer>
      - name: max_tokens_in
        type: Optional<Integer>
      - name: max_tokens_out
        type: Optional<Integer>
      - name: max_duration_ms
        type: Optional<Integer>
      - name: max_cost_micro_usd
        type: Optional<Integer>
      - name: max_tokens
        type: Optional<Integer>
      - name: deadline
        type: Optional<Timestamp>
      - name: per_action
        type: List<commission.responsibility.ActionBudget>

  # story:run-and-action-budgets: which limit of a run budget or an action budget was reached.
  # story:run-budget-tokens-and-deadline adds MaxTokens (input and output tokens together) and
  # Deadline (the run's wall-clock deadline), both the run's own.
  - name: commission.responsibility.BudgetLimit
    kind: enum
    variants:
      [MaxSteps, MaxTrials, MaxTokensIn, MaxTokensOut, MaxDurationMs, MaxCostMicroUsd, MaxTokens,
       Deadline]

  # story:run-and-action-budgets: what one run, or one action of it, was charged: the requests
  # handed to the effect port (`trials`), and the sums of the usage its performed effects reported.
  # The cost is absent once a charged usage reported none. A run's steps are counted by the loop.
  # story:executor-reports-usage: a run's sums also hold the usage its executor calls reported
  # (ExecutorStep), which no action's do and which takes no trial.
  - name: commission.responsibility.ChargedUsage
    kind: struct
    fields:
      - name: trials
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: duration_ms
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>

  # story:run-and-action-budgets: what one action of a run was charged.
  - name: commission.responsibility.ActionCharge
    kind: struct
    fields:
      - name: action
        type: String
      - name: charged
        type: commission.responsibility.ChargedUsage

  # story:run-and-action-budgets: what one run was charged against its budget, in total and for
  # each action a request was handed to the effect port for, in the order each was first handed.
  # It covers one process segment of the run. story:executor-reports-usage: `run` is the actions'
  # sums and the usage the run's executor calls reported.
  - name: commission.responsibility.RunCharges
    kind: struct
    fields:
      - name: run
        type: commission.responsibility.ChargedUsage
      - name: actions
        type: List<commission.responsibility.ActionCharge>

  # story:run-and-action-budgets: why a run was suspended for its run or action budget, distinct
  # from a model-loop budget stop: the action whose budget was reached (absent for the run's), the
  # limit, its value and what was charged against it (absent for a cost limit whose charge is
  # unknown, since an effect reported usage without a cost). A count limit (steps, trials) stops
  # the run before the step or request that would pass it; a spending limit stops it once an
  # effect's reported usage took the charge past it, after that effect was recorded and observed,
  # or once an executor call's reported usage did, after that step was observed and before its
  # outcome is acted on (story:executor-reports-usage, ExecutorStep), or, under the stop policy's
  # KeepStep, before the next step (story:run-budget-tokens-and-deadline). The Deadline limit stops
  # it before an executor call or a pending request's invocation, and, once an executor call that
  # ended at or after it was observed, as a spending limit does after that call. For the Deadline limit,
  # `max` is the deadline and `charged` the time read, both in whole seconds since the Unix epoch;
  # `charged` is absent when the time read is not RFC 3339, which is taken as past the deadline.
  - name: commission.responsibility.RunBudgetBreach
    kind: struct
    fields:
      - name: action
        type: Optional<String>
      - name: limit
        type: commission.responsibility.BudgetLimit
      - name: max
        type: Integer
      - name: charged
        type: Optional<Integer>

  # The effect port did not perform the request, and changed nothing; why.
  # story:refused-effect-ends-run: `ends_run` marks the refusal final: the port says no later step
  # of the run can succeed where this request failed, so the run ends at once with `EffectRefused`
  # naming the request and this reason (`JudgeEffectRefusal`, `final`). False is an ordinary
  # refusal, an idle iteration as before; nothing is ever retried.
  - name: commission.responsibility.EffectOutcomeRefused
    kind: struct
    fields:
      - name: reason
        type: String
      - name: ends_run
        type: Boolean

  # story:effect-invocation: a Connector operation is the pair (instance_id, operation_id), as
  # Connectors names it. Which Connection serves it is Connectors' choice and is not modelled here.
  - name: commission.responsibility.ConnectorInstanceId
    kind: newtype
    of: String

  - name: commission.responsibility.ConnectorOperationId
    kind: newtype
    of: String

  # story:connectors-invoker: the base URL of a Connectors service, as the host configures it.
  - name: commission.responsibility.ConnectorEndpointUrl
    kind: newtype
    of: String

  # story:connectors-invoker: the name under which the host's secret resolver holds the service
  # credential of an endpoint. A reference, never the secret: the credential itself is resolved by
  # the host at each invocation and is not modelled here.
  - name: commission.responsibility.ConnectorCredentialRef
    kind: newtype
    of: String

  # The id of the connectors.mutations.AttemptRecord an invocation produced; Connectors owns the
  # attempt. An identifier, not a relation: ESS refuses a relation to another system's entity
  # (undeclared_reference).
  - name: commission.responsibility.ConnectorAttemptId
    kind: newtype
    of: String

  # story:connector-read-performed: the public `audit_ref` of the execution audit record
  # Connectors completed for one admitted invocation (`audit_status` `complete`). Connectors owns
  # the record; an identifier, not a relation.
  - name: commission.responsibility.ConnectorAuditRef
    kind: newtype
    of: String

  # story:connector-read-performed: what a bound Connector operation does. Write is an operation
  # Connectors describes with the mutation profile (`external_write`), for which it records an
  # attempt; Read is every other operation, for which it records none. The host declares it on the
  # binding, and an operation the service describes otherwise is not invoked.
  - name: commission.responsibility.ConnectorOperationEffect
    kind: enum
    variants: [Read, Write]

  # What identifies an ActionBinding: one per action id of a commission.
  - name: commission.responsibility.ActionBindingKey
    kind: struct
    fields:
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: action
        type: String

  # story:approval-suspend-resume-slice: what identifies a Suspension, the commission it belongs to,
  # so a commission holds at most one.
  - name: commission.responsibility.SuspensionKey
    kind: struct
    fields:
      - name: commission_id
        type: commission.responsibility.CommissionId

  # docs/contracts/protocol-core.md: three-valued truth.
  - name: commission.responsibility.Truth
    kind: enum
    variants: ["True", "False", "Unknown"]

  # docs/commission/contracts/frontier.md: what the frontier says about one action.
  - name: commission.responsibility.ActionStatus
    kind: enum
    variants: [Admissible, ApprovalRequired, Blocked]

  # docs/commission/contracts/frontier.md: one claim of a frontier and its three-valued value.
  - name: commission.responsibility.FrontierClaim
    kind: struct
    fields:
      - name: claim
        type: String
      - name: value
        type: commission.responsibility.Truth

  # docs/commission/contracts/frontier.md: one obligation of a frontier, open or not. `open` is
  # true exactly when the governor reports the obligation owed: an obligation discharged is not
  # open, and neither is one that does not apply to the case (the case's inputs do not select it).
  - name: commission.responsibility.FrontierObligation
    kind: struct
    fields:
      - name: obligation
        type: String
      - name: open
        type: Boolean

  # docs/commission/contracts/frontier.md: one action of a frontier, the capability an approval needs and the
  # reasons a block names.
  - name: commission.responsibility.FrontierAction
    kind: struct
    fields:
      - name: action
        type: String
      - name: status
        type: commission.responsibility.ActionStatus
      - name: capability
        type: Optional<String>
      - name: reasons
        type: List<String>

  # story:frontier-admission: how the current frontier sorts one proposed action. An action the
  # frontier does not list, or lists as ApprovalRequired with no capability to ask for, is refused.
  - name: commission.responsibility.Admission
    kind: union
    tag: kind
    variants:
      Admissible: commission.responsibility.Unit
      NeedsAuthority: commission.responsibility.AdmissionNeedsAuthority
      Refused: commission.responsibility.AdmissionRefused

  # The capability the frontier names for an ApprovalRequired action.
  - name: commission.responsibility.AdmissionNeedsAuthority
    kind: struct
    fields:
      - name: capability
        type: String

  # The refused action and the reasons the frontier gives for it; empty when it gives none.
  - name: commission.responsibility.AdmissionRefused
    kind: struct
    fields:
      - name: action
        type: String
      - name: reasons
        type: List<String>

entities:
  # Reusable worker configuration.
  - name: commission.responsibility.Agent
    identity:
      name: agent_id
      type: commission.responsibility.AgentId
    fields:
      - name: name
        type: String
    relations:
      # A revision has no meaning without its agent.
      - name: revisions
        kind: owns
        target: commission.responsibility.AgentRevision
        cardinality: many
        via: agent_id
    lifecycle:
      initial: Registered
      states: [Registered]
      terminal: [Registered]

  - name: commission.responsibility.AgentRevision
    identity:
      name: agent_revision_id
      type: commission.responsibility.AgentRevisionId
    fields:
      - name: agent_id
        type: commission.responsibility.AgentId
      - name: revision
        type: Integer
    lifecycle:
      initial: Published
      states: [Published]
      terminal: [Published]

  # Durable undertaking under a protocol. Commission holds a reference; the governor holds truth.
  - name: commission.responsibility.Case
    identity:
      name: case_id
      type: commission.responsibility.CaseId
    fields:
      - name: protocol
        type: String
      - name: revision
        type: Integer
    lifecycle:
      initial: Open
      states: [Open]
      terminal: [Open]

  # Binds one agent revision to one case under a governor (ADR 0070).
  # A case may hold many commissions at once, in parallel (operator, 2026-10-04). Each commission
  # references exactly one case.
  # Principal and authority context are Commission-local types (operator, 2026-10-04); binding them
  # to Mandate is phase-7 work (Atlas epic:ga-governed-effects).
  - name: commission.responsibility.Commission
    identity:
      name: commission_id
      type: commission.responsibility.CommissionId
    fields:
      - name: agent_revision_id
        type: commission.responsibility.AgentRevisionId
      - name: case_id
        type: commission.responsibility.CaseId
      - name: principal
        type: commission.responsibility.PrincipalId
      - name: authority_context
        type: commission.responsibility.AuthorityContext
    relations:
      - name: agent_revision
        kind: references
        target: commission.responsibility.AgentRevision
        cardinality: one
        via: agent_revision_id
      - name: case
        kind: references
        target: commission.responsibility.Case
        cardinality: one
        via: case_id
      # A run is one bounded period of execution of this commission.
      - name: runs
        kind: owns
        target: commission.responsibility.Run
        cardinality: many
        via: commission_id
      # The host's composition declares the commission's bindings (story:effect-invocation).
      - name: bindings
        kind: owns
        target: commission.responsibility.ActionBinding
        cardinality: many
        via: commission_id
      # story:approval-suspend-resume-slice (decision-blocker:suspension-durable-record, B): the
      # commission's suspension pending an approval, at most one. It lives and dies with the
      # commission, never with the case, and is kept by a suspension port the host implements.
      - name: suspension
        kind: owns
        target: commission.responsibility.Suspension
        cardinality: one
        via: commission_id
    lifecycle:
      initial: Assigned
      states: [Assigned]
      terminal: [Assigned]

  # story:effect-invocation (decision-blocker:action-operation-binding, B): a frontier action id
  # the host can execute for a commission binds to exactly one Connector operation. The identity
  # holds at most one binding per action id of a commission; `commission_id` repeats the key's for
  # the relation, since `via` names a field, not a member of the identity. Protocol definitions
  # and the Connectors catalog carry no binding. An action no binding names, and that needs no
  # authority, is not offered to an executor (decision-blocker:gated-unbound-action-visibility, B).
  - name: commission.responsibility.ActionBinding
    identity:
      name: binding
      type: commission.responsibility.ActionBindingKey
    fields:
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: instance_id
        type: commission.responsibility.ConnectorInstanceId
      - name: operation_id
        type: commission.responsibility.ConnectorOperationId
      # story:connector-read-performed: whether the bound operation is a read or a write, which
      # decides what its Performed names (an attempt for Write, an audit record for Read).
      - name: effect
        type: commission.responsibility.ConnectorOperationEffect
    relations:
      # story:connectors-invoker: the bound operation's instance is served by the one endpoint the
      # host declares for it.
      - name: endpoint
        kind: references
        target: commission.responsibility.ConnectorEndpoint
        cardinality: one
        via: instance_id
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # story:connectors-invoker: the host's Connectors service for one Connector instance. The
  # identity holds one endpoint per instance; the invoker describes the endpoint and invokes the
  # bound operation there. `allow_plaintext` admits an `http` URL, which the client otherwise
  # refuses. The host's composition declares its endpoints; Connectors owns what they serve.
  - name: commission.responsibility.ConnectorEndpoint
    identity:
      name: instance_id
      type: commission.responsibility.ConnectorInstanceId
    fields:
      - name: url
        type: commission.responsibility.ConnectorEndpointUrl
      - name: credential
        type: commission.responsibility.ConnectorCredentialRef
      - name: allow_plaintext
        type: Boolean
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: commission.responsibility.Run
    identity:
      name: run_id
      type: commission.responsibility.RunId
    fields:
      - name: commission_id
        type: commission.responsibility.CommissionId
      # The case revision the run started against. A proposal made on another revision is stale,
      # except a revision the run's own effect moved the case to (story:runtime-merge).
      - name: case_revision
        type: Integer
    relations:
      # A request is made inside one run, against that run's case revision or one its own effect
      # moved the case to, and never outlives it (decision-blocker:action-request-commission). The
      # commission is reached through the run.
      - name: requests
        kind: owns
        target: commission.responsibility.ActionRequest
        cardinality: many
        via: run_id
    # Resuming after a restart continues this same run (operator, 2026-10-04), so run state is
    # durable. Resume keeps the run id and the case revision.
    lifecycle:
      initial: Running
      states: [Running, Suspended]
      terminal: []
      transitions:
        - {name: suspend, from: [Running], to: Suspended}
        - {name: resume, from: [Suspended], to: Running}

  # story:approval-suspend-resume-slice (decision-blocker:suspension-durable-record, B): a run
  # suspended on an approval, as a new process resumes it from durable state alone. Its identity
  # holds the commission's id, so a commission holds at most one; `commission_id` repeats it for the
  # relation, as on ActionBinding. It holds the run it suspended (its id and
  # the case revision the run started against, `run_case_revision`), the pending action request
  # (its id, case, `expected_case_revision`, action and arguments, as the run made it) and the
  # reason the run was suspended for. Resuming continues that same run (`ResumeRun`) at the
  # request's revision.
  #
  # It is held `Pending` (`HoldSuspension`); a commission already holding one is refused. A resume
  # takes it (`TakeSuspension`, `take`: `Pending` -> `Resuming`) before anything is performed, so
  # one take wins and every other is refused: none stored is `not-found`, one already `Resuming` is
  # `wrong-state`, naming the request it holds. A take and a release name the action request the
  # resume read and revalidated, and a Suspension held for another request is refused
  # (`other-request`, naming both) and kept as it is: a resume that read one Suspension never takes
  # or releases a later one the commission holds for another request. A `Resuming` Suspension is a
  # request that may have been performed or not (the process that took it stopped before releasing
  # it): it stays stored and is never taken again, so the request is never performed twice and never
  # dropped without a durable trace; settling it is the host's. Once the request was performed the
  # Suspension is released (`ReleaseSuspension`), removed; a `Pending` one is not released. So is
  # one whose request can never be performed: a resume that took it and finds the case moved off
  # the request's revision before the request is invoked releases it and performs nothing.
  #
  # story:handoff-holds-no-suspension: a hold the host already settled (`HoldSuspension`,
  # `settled`) leaves nothing held: the host has already done what an approval of the request
  # would lead to, so no Suspension is stored, none is left for an approval to name and nothing
  # can resume the Run from one.
  - name: commission.responsibility.Suspension
    identity:
      name: suspension
      type: commission.responsibility.SuspensionKey
    fields:
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: run_id
        type: commission.responsibility.RunId
      - name: run_case_revision
        type: Integer
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: case_id
        type: commission.responsibility.CaseId
      - name: expected_case_revision
        type: Integer
      - name: action
        type: String
      - name: arguments
        type: commission.responsibility.ProposedActionArguments
      - name: reason
        type: commission.responsibility.SuspensionReason
    relations:
      - name: run
        kind: references
        target: commission.responsibility.Run
        cardinality: one
        via: run_id
      - name: action_request
        kind: references
        target: commission.responsibility.ActionRequest
        cardinality: one
        via: action_request_id
      - name: case
        kind: references
        target: commission.responsibility.Case
        cardinality: one
        via: case_id
    lifecycle:
      initial: Pending
      states: [Pending, Resuming]
      terminal: [Resuming]
      transitions:
        - {name: take, from: [Pending], to: Resuming}

  # docs/commission/contracts/frontier.md: the bridge between governance and execution, for one case revision.
  # Its claims, obligations and actions are Commission's own value types (story M-002): none has an
  # identity or a lifecycle of its own outside the frontier issued for one case revision.
  - name: commission.responsibility.Frontier
    identity:
      name: frontier_id
      type: commission.responsibility.FrontierId
    fields:
      - name: case_id
        type: commission.responsibility.CaseId
      - name: case_revision
        type: Integer
      - name: claims
        type: List<commission.responsibility.FrontierClaim>
      - name: obligations
        type: List<commission.responsibility.FrontierObligation>
      - name: actions
        type: List<commission.responsibility.FrontierAction>
    relations:
      - name: case
        kind: references
        target: commission.responsibility.Case
        cardinality: one
        via: case_id
    lifecycle:
      initial: Issued
      states: [Issued]
      terminal: [Issued]

  # docs/commission/contracts/evidence.md: a raw report from a runtime, integration or verifier.
  - name: commission.responsibility.Observation
    identity:
      name: observation_id
      type: commission.responsibility.ObservationId
    fields:
      - name: source
        type: String
      - name: subject
        type: String
      - name: observed_at
        type: Timestamp
      - name: payload
        type: Json
    lifecycle:
      initial: Reported
      states: [Reported]
      terminal: [Reported]

  # Typed, attributable information admitted by the governor. A trace is not evidence (ADR 0074).
  - name: commission.responsibility.Evidence
    identity:
      name: evidence_id
      type: commission.responsibility.EvidenceId
    fields:
      - name: case_id
        type: commission.responsibility.CaseId
      - name: kind
        type: String
      - name: subject_revision
        type: Integer
      - name: producer
        type: String
      - name: observation_ids
        type: List<commission.responsibility.ObservationId>
      - name: facts
        type: Json
      - name: provenance
        type: Json
    relations:
      - name: case
        kind: references
        target: commission.responsibility.Case
        cardinality: one
        via: case_id
      # An evidence record interprets one or more observations (docs/commission/contracts/evidence.md;
      # operator, 2026-10-04).
      - name: observations
        kind: references
        target: commission.responsibility.Observation
        cardinality: many
        via: observation_ids
    lifecycle:
      initial: Submitted
      states: [Submitted]
      terminal: [Submitted]

  # A proposed action bound to the case revision of the frontier it was chosen from
  # (docs/history/beyond10x-agent-sdk-design-pre-commission-name.md § 36). The expected revision
  # comes from the frontier the run was given, never from executor output. The action is a
  # FrontierAction's `action`. Revalidation takes the request as its input and changes nothing.
  - name: commission.responsibility.ActionRequest
    identity:
      name: action_request_id
      type: commission.responsibility.ActionRequestId
    fields:
      - name: run_id
        type: commission.responsibility.RunId
      - name: case_id
        type: commission.responsibility.CaseId
      - name: expected_case_revision
        type: Integer
      - name: action
        type: String
      - name: arguments
        type: commission.responsibility.ProposedActionArguments
    relations:
      - name: case
        kind: references
        target: commission.responsibility.Case
        cardinality: one
        via: case_id
    lifecycle:
      initial: Requested
      states: [Requested]
      terminal: [Requested]

  # Authority stays outside the model; a decision is supplied by an AuthorityProvider.
  # A decision belongs to exactly one action request at one case revision (operator, 2026-10-04);
  # a later action needs a new decision.
  - name: commission.responsibility.AuthorityDecision
    identity:
      name: authority_decision_id
      type: commission.responsibility.AuthorityDecisionId
    fields:
      - name: action
        type: String
      - name: granted
        type: Boolean
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
    relations:
      - name: action_request
        kind: references
        target: commission.responsibility.ActionRequest
        cardinality: one
        via: action_request_id
    lifecycle:
      initial: Decided
      states: [Decided]
      terminal: [Decided]

errors:
  - name: commission.responsibility.RunStateConflict
    fields:
      - name: state
        type: commission.responsibility.Run.State

  # The request was made at a revision the case has moved past. Names both revisions.
  - name: commission.responsibility.ActionRequestStale
    fields:
      - name: expected_case_revision
        type: Integer
      - name: current_case_revision
        type: Integer

  # The current frontier does not admit the action: it does not list it, blocks it, or lists it as
  # ApprovalRequired with no single capability to ask for. Carries the frontier's reasons.
  - name: commission.responsibility.ActionNotAdmitted
    fields:
      - name: action
        type: String
      - name: reasons
        type: List<String>

  # The current frontier lists the action as ApprovalRequired: it is not admitted without an
  # authority decision for this capability.
  - name: commission.responsibility.ActionNeedsAuthority
    fields:
      - name: action
        type: String
      - name: capability
        type: String

  - name: commission.responsibility.RunStorageFailed
    fields:
      - name: reason
        type: String

  # story:approval-suspend-resume-slice: the commission already holds a Suspension; nothing was
  # stored over it.
  - name: commission.responsibility.SuspensionAlreadyHeld
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey

  # story:approval-suspend-resume-slice: the commission holds no Suspension.
  - name: commission.responsibility.SuspensionNotFound
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey

  # story:approval-suspend-resume-slice: the Suspension is not in a state the command acts from.
  # Taken when it is already `Resuming`, it names the request whose performance is in doubt.
  - name: commission.responsibility.SuspensionStateConflict
    fields:
      - name: state
        type: commission.responsibility.Suspension.State
      - name: action_request_id
        type: commission.responsibility.ActionRequestId

  # story:approval-suspend-resume-slice: the commission's Suspension is held for another action
  # request than the one the command names; nothing was changed. It names both.
  - name: commission.responsibility.SuspensionRequestMismatch
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: held_action_request_id
        type: commission.responsibility.ActionRequestId
      - name: action_request_id
        type: commission.responsibility.ActionRequestId

  # story:handoff-holds-no-suspension: the host already settled the request the Suspension would
  # hold; nothing was stored. It names the Suspension, the request and the host's reason.
  - name: commission.responsibility.SuspensionSettled
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: reason
        type: String

  # story:approval-suspend-resume-slice: the suspension port cannot read or write.
  - name: commission.responsibility.SuspensionStorageFailed
    fields:
      - name: reason
        type: String

  # story:refused-effect-ends-run: the run cannot go on past this request, which the effect port
  # refused as final. It names the request and the port's reason.
  - name: commission.responsibility.EffectRefusedFinal
    fields:
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: reason
        type: String

  # story:idle-bound-outcome: the run made no progress for as many iterations in a row as the idle
  # bound allows, and cannot go on. It names how many.
  - name: commission.responsibility.IdleBoundReached
    fields:
      - name: idle_iterations
        type: Integer

  # story:unperformable-names-actions: the run cannot go on, since the effect port performs none of
  # the actions it needs. It names them and the frontier's open claims.
  - name: commission.responsibility.ActionsUnperformable
    fields:
      - name: actions
        type: List<String>
      - name: open_claims
        type: List<String>

  # story:pending-effect: a budget ended the run while these requests were pending. It names them
  # and the reason the Run was suspended for the budget.
  - name: commission.responsibility.RequestsWaiting
    fields:
      - name: action_request_ids
        type: List<commission.responsibility.ActionRequestId>
      - name: reason
        type: commission.responsibility.SuspensionReason

commands:
  - name: commission.responsibility.StartRun
    input:
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: case_revision
        type: Integer
    outcomes:
      - name: started
        creates: commission.responsibility.Run
        instance: run_id
        sets:
          commission_id: input.commission_id
          case_revision: input.case_revision
        emits: [commission.responsibility.RunStarted]
        payload:
          commission.responsibility.RunStarted:
            run_id: {generated: true}
            commission_id: input.commission_id
            case_revision: input.case_revision
      - name: storage-failed
        external: the run store cannot hold the new run
        error: commission.responsibility.RunStorageFailed

  # The reason is carried by the command and its event, not stored on Run. A run suspended on an
  # approval keeps its reason on the commission's Suspension, with the pending request
  # (story:approval-suspend-resume-slice, decision-blocker:suspension-durable-record, B).
  - name: commission.responsibility.SuspendRun
    input:
      - name: run_id
        type: commission.responsibility.RunId
      - name: reason
        type: commission.responsibility.SuspensionReason
    outcomes:
      - name: suspended
        moves: commission.responsibility.Run.suspend
        instance: run_id
        emits: [commission.responsibility.RunSuspended]
        payload:
          commission.responsibility.RunSuspended:
            run_id: input.run_id
            reason: input.reason
      - name: wrong-state
        wrong_state: true
        error: commission.responsibility.RunStateConflict
      - name: storage-failed
        external: the run store cannot record the suspension
        error: commission.responsibility.RunStorageFailed

  - name: commission.responsibility.ResumeRun
    input:
      - name: run_id
        type: commission.responsibility.RunId
    outcomes:
      - name: resumed
        moves: commission.responsibility.Run.resume
        instance: run_id
        emits: [commission.responsibility.RunResumed]
        payload:
          commission.responsibility.RunResumed:
            run_id: input.run_id
      - name: wrong-state
        wrong_state: true
        error: commission.responsibility.RunStateConflict
      # story:approval-suspend-resume-slice: a durable run store that cannot write the resumption.
      - name: storage-failed
        external: the run store cannot record the resumption
        error: commission.responsibility.RunStorageFailed

  # story:approval-suspend-resume-slice: a run suspended on an approval holds the commission's
  # Suspension, `Pending`, through the suspension port. A commission holds at most one: holding a
  # second is refused and keeps the first.
  #
  # story:handoff-holds-no-suspension: the host answers first whether it already settled the
  # request the Suspension would hold (`settled`, naming the Suspension, the request and why); then
  # nothing is stored and the run ends with nothing held.
  - name: commission.responsibility.HoldSuspension
    input:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: run_id
        type: commission.responsibility.RunId
      - name: run_case_revision
        type: Integer
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: case_id
        type: commission.responsibility.CaseId
      - name: expected_case_revision
        type: Integer
      - name: action
        type: String
      - name: arguments
        type: commission.responsibility.ProposedActionArguments
      - name: reason
        type: commission.responsibility.SuspensionReason
    outcomes:
      - name: settled
        external: the host already settled the request the Suspension would hold
        error: commission.responsibility.SuspensionSettled
        payload:
          commission.responsibility.SuspensionSettled:
            suspension: input.suspension
            action_request_id: input.action_request_id
      - name: held
        creates: commission.responsibility.Suspension
        instance: suspension
        sets:
          commission_id: input.commission_id
          run_id: input.run_id
          run_case_revision: input.run_case_revision
          action_request_id: input.action_request_id
          case_id: input.case_id
          expected_case_revision: input.expected_case_revision
          action: input.action
          arguments: input.arguments
          reason: input.reason
        emits: [commission.responsibility.SuspensionHeld]
        payload:
          commission.responsibility.SuspensionHeld:
            suspension: input.suspension
            run_id: input.run_id
            action_request_id: input.action_request_id
      - name: already-held
        existing_instance: true
        error: commission.responsibility.SuspensionAlreadyHeld
        payload:
          commission.responsibility.SuspensionAlreadyHeld:
            suspension: input.suspension
      - name: storage-failed
        external: the suspension port cannot hold the Suspension
        error: commission.responsibility.SuspensionStorageFailed

  # story:approval-suspend-resume-slice: a resume takes the commission's Suspension before it
  # performs anything, so of two resumes one takes it and the other is refused. It names the
  # request the resume revalidated: a Suspension held for another request is refused, naming both,
  # and kept as it is. A Suspension already `Resuming` is refused, naming its request: that request
  # may have been performed, and is never performed again from it.
  - name: commission.responsibility.TakeSuspension
    input:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
    outcomes:
      - name: other-request
        when_subject:
          predicate: action_request_id != input.action_request_id
        error: commission.responsibility.SuspensionRequestMismatch
        payload:
          commission.responsibility.SuspensionRequestMismatch:
            suspension: input.suspension
            held_action_request_id: {subject: action_request_id}
            action_request_id: input.action_request_id
      - name: taken
        moves: commission.responsibility.Suspension.take
        instance: suspension
        emits: [commission.responsibility.SuspensionTaken]
        payload:
          commission.responsibility.SuspensionTaken:
            suspension: input.suspension
            action_request_id: {subject: action_request_id}
      - name: not-found
        unknown_instance: true
        error: commission.responsibility.SuspensionNotFound
        payload:
          commission.responsibility.SuspensionNotFound:
            suspension: input.suspension
      - name: wrong-state
        wrong_state: true
        error: commission.responsibility.SuspensionStateConflict
        payload:
          commission.responsibility.SuspensionStateConflict:
            action_request_id: {subject: action_request_id}
      - name: storage-failed
        external: the suspension port cannot record the take
        error: commission.responsibility.SuspensionStorageFailed

  # story:approval-suspend-resume-slice: once the request a resume took the Suspension for was
  # performed, the Suspension is removed. It names that request: a Suspension held for another
  # request is refused, naming both, and kept as it is. A `Pending` one, which no resume took, is
  # not removed. story:authority-sees-the-request: a resume that took the Suspension and finds the
  # case moved off the request's revision before invoking it releases it the same way, since the
  # request bound to that revision can never be performed, and performs nothing.
  - name: commission.responsibility.ReleaseSuspension
    input:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
    outcomes:
      - name: other-request
        when_subject:
          predicate: action_request_id != input.action_request_id
        error: commission.responsibility.SuspensionRequestMismatch
        payload:
          commission.responsibility.SuspensionRequestMismatch:
            suspension: input.suspension
            held_action_request_id: {subject: action_request_id}
            action_request_id: input.action_request_id
      - name: not-taken
        when_subject:
          predicate: state == Pending
        error: commission.responsibility.SuspensionStateConflict
        payload:
          commission.responsibility.SuspensionStateConflict:
            action_request_id: {subject: action_request_id}
      - name: released
        deletes: commission.responsibility.Suspension
        instance: suspension
        emits: [commission.responsibility.SuspensionReleased]
        payload:
          commission.responsibility.SuspensionReleased:
            suspension: input.suspension
      - name: not-found
        unknown_instance: true
        error: commission.responsibility.SuspensionNotFound
        payload:
          commission.responsibility.SuspensionNotFound:
            suspension: input.suspension
      - name: storage-failed
        external: the suspension port cannot remove the Suspension
        error: commission.responsibility.SuspensionStorageFailed

  # Immediately before anything is done with a request, the request as the run built it is
  # revalidated. The case's current revision and frontier come from the governor, never from the
  # input, and the action is re-checked with frontier admission. A stale request is refused even
  # when its action is admissible now. Answered in this order.
  - name: commission.responsibility.RevalidateActionRequest
    input:
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: run_id
        type: commission.responsibility.RunId
      - name: case_id
        type: commission.responsibility.CaseId
      - name: expected_case_revision
        type: Integer
      - name: action
        type: String
      - name: arguments
        type: commission.responsibility.ProposedActionArguments
    outcomes:
      - name: stale
        external: the governor's current revision of the case is not the request's expected case revision
        error: commission.responsibility.ActionRequestStale
        payload:
          commission.responsibility.ActionRequestStale:
            expected_case_revision: input.expected_case_revision
      - name: not-admitted
        external: the current frontier refuses the action
        error: commission.responsibility.ActionNotAdmitted
        payload:
          commission.responsibility.ActionNotAdmitted:
            action: input.action
      - name: needs-authority
        external: the current frontier lists the action as ApprovalRequired, naming one capability
        error: commission.responsibility.ActionNeedsAuthority
        payload:
          commission.responsibility.ActionNeedsAuthority:
            action: input.action
      - name: admitted
        accepts: nothing

  # story:refused-effect-ends-run: whether a run goes on after the effect port refused one of its
  # admitted requests, decided once the refusal was recorded and observed. A refusal the port marks
  # final (`ends_run`) ends the run at once, and the run outcome is `EffectRefused`, naming the
  # request and the port's reason as `final` does; an ordinary one changes nothing, and the
  # iteration counts toward the idle bound as before.
  - name: commission.responsibility.JudgeEffectRefusal
    input:
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: reason
        type: String
      - name: ends_run
        type: Boolean
    outcomes:
      - name: final
        when: ends_run == true
        error: commission.responsibility.EffectRefusedFinal
        payload:
          commission.responsibility.EffectRefusedFinal:
            action_request_id: input.action_request_id
            reason: input.reason
      - name: ordinary
        accepts: nothing

  # story:idle-bound-outcome: whether a run with no step budget goes on after an iteration that made
  # no progress: it admitted no request, or only requests with the action and arguments of ones
  # already admitted in the Run, at whatever revision. `idle_iterations` counts such iterations in a
  # row, this one included; a newly admitted request starts the count again, and a stale proposal
  # is not counted, since the next iteration judges the move. As many as the input `bound` end the
  # run (outcome `bound`), and the run outcome is `IdleBound`, naming the count as `bound` does;
  # fewer change nothing. A completed case comes first: when the iteration's own effect was
  # performed, the case is loaded before the run ends, as at a step budget, and a case the governor
  # holds complete ends the run completed, not `IdleBound`. story:stop-policy-gate-and-idle-bound:
  # the input `bound` is the host's `StopPolicy.idle_bound`, read as 1 when below 1, and then the
  # run is judged here whether or not it has a step budget. A policy that sets none makes it two,
  # and a run with a step budget is then bounded by its budget alone and is never judged here.
  # story:pending-effect: an iteration whose request the effect port answered Pending, and each
  # that invokes it again and is answered Pending, is not judged and leaves `idle_iterations` where
  # it was; the iteration whose invocation is answered otherwise is judged as the one that admitted
  # the request would have been.
  - name: commission.responsibility.JudgeIdleIteration
    input:
      - name: idle_iterations
        type: Integer
      - name: bound
        type: Integer
    outcomes:
      - name: bound
        when: idle_iterations >= bound
        error: commission.responsibility.IdleBoundReached
        payload:
          commission.responsibility.IdleBoundReached:
            idle_iterations: input.idle_iterations
      - name: below
        accepts: nothing

  # story:unperformable-names-actions: whether a run goes on when the effect port performs none of
  # the actions it needs. Before the executor runs, those are the actions the frontier lists:
  # `performed` counts the listed actions the port performs, and `unperformed` lists the others,
  # each once, in frontier order. After a proposal, it is the action of the admitted request:
  # `performed` is 1 when the port performs it, else 0 with that action alone in `unperformed`.
  # When the port performs none and at least one is unperformed, the run ends (`unperformable`):
  # the port is handed nothing, and the run outcome is `NoPerformableAction`, naming the
  # unperformed actions and `open_claims`, the claims of the frontier whose value is not True, in
  # frontier order, as `unperformable` does. Otherwise nothing changes (`performable`), so a
  # frontier that lists no action at all goes on.
  - name: commission.responsibility.JudgePerformableActions
    input:
      - name: performed
        type: Integer
      - name: unperformed
        type: List<String>
      - name: open_claims
        type: List<String>
    outcomes:
      - name: unperformable
        when:
          all:
            - performed == 0
            - unperformed.count >= 1
        error: commission.responsibility.ActionsUnperformable
        payload:
          commission.responsibility.ActionsUnperformable:
            actions: input.unperformed
            open_claims: input.open_claims
      - name: performable
        accepts: nothing

  # story:pending-effect: how a run ends that a budget stops: the step budget, or a limit of the
  # run budget (`RunBudgetBreach`). `reason` is what the Run is suspended for, through `SuspendRun`,
  # in either case. `pending` lists the requests the effect port last answered Pending, which the
  # run would otherwise invoke again, in the order they were made. With one or more, the run
  # outcome is `Waiting`, naming them and the reason as `waiting` does: the work they started has
  # not finished. With none, nothing changes (`suspended`), and the run outcome is `Suspended` with
  # the reason, as before.
  # story:pending-answer-ends-run: a Pending answer with `ends_run` stops the run as a budget does
  # and is judged here the same way: `pending` lists the request so answered (for a fan-out, every
  # read answered Pending, in proposal order), and `reason` is Time carrying the port's report, so
  # the outcome is `waiting`.
  # story:host-stop-before-step: a host's stop before a step is judged here the same way, `reason`
  # HostStop as the host named it: `waiting` before a pending request is invoked again, otherwise
  # `suspended`.
  - name: commission.responsibility.JudgeBudgetStop
    input:
      - name: pending
        type: List<commission.responsibility.ActionRequestId>
      - name: reason
        type: commission.responsibility.SuspensionReason
    outcomes:
      - name: waiting
        when: pending.count >= 1
        error: commission.responsibility.RequestsWaiting
        payload:
          commission.responsibility.RequestsWaiting:
            action_request_ids: input.pending
            reason: input.reason
      - name: suspended
        accepts: nothing

events:
  - name: commission.responsibility.RunStarted
    fields:
      - name: run_id
        type: commission.responsibility.RunId
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: case_revision
        type: Integer

  - name: commission.responsibility.RunSuspended
    fields:
      - name: run_id
        type: commission.responsibility.RunId
      - name: reason
        type: commission.responsibility.SuspensionReason

  - name: commission.responsibility.RunResumed
    fields:
      - name: run_id
        type: commission.responsibility.RunId

  - name: commission.responsibility.SuspensionHeld
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: run_id
        type: commission.responsibility.RunId
      - name: action_request_id
        type: commission.responsibility.ActionRequestId

  - name: commission.responsibility.SuspensionTaken
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: action_request_id
        type: commission.responsibility.ActionRequestId

  - name: commission.responsibility.SuspensionReleased
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey

views:
  - name: commission.responsibility.RunStates
    source: commission.responsibility.Run
    consistency: read_your_writes
    fields:
      - name: run_id
        type: commission.responsibility.RunId
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: case_revision
        type: Integer
      - name: state
        type: commission.responsibility.Run.State

  # story:approval-suspend-resume-slice: each commission's Suspension and its state, as the
  # suspension port holds it.
  - name: commission.responsibility.SuspensionStates
    source: commission.responsibility.Suspension
    consistency: read_your_writes
    fields:
      - name: suspension
        type: commission.responsibility.SuspensionKey
      - name: commission_id
        type: commission.responsibility.CommissionId
      - name: run_id
        type: commission.responsibility.RunId
      - name: action_request_id
        type: commission.responsibility.ActionRequestId
      - name: state
        type: commission.responsibility.Suspension.State
