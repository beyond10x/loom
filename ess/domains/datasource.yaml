# A data source a plugin reads through the Connectors command line (story connectors-cli-reads).
# Nouns are read from the `connectors` CLI as it answers `--output json`: `operations describe`
# answers the operation's schema identity (`schema`), the descriptor `revision` and the operation
# with its `profile` and `input_schema`; `operations invoke` answers `result` and, where the
# owner recorded one, `source_audit.audit_ref`. A source is configuration the host reads: it has no
# lifecycle, so the domain declares types only.
#
# A governed write (story connectors-governed-write) is the other use of the command line: one
# `operations invoke` of an operation `describe` reports with the `mutation` profile, for a request
# the runtime admitted, with `--approval-file` naming the proof the person's confirmation wrote
# (`connectors approvals issue --proof-output`) and `--idempotency-key` derived from the admitted
# request id. Connectors classifies the write `not_attempted`, `refused`, `applied` or `unknown`
# (`mutation.classification`), beside its `request_id` and `source_audit`.
domain: loom.datasource

summary: >-
  A data source read through the Connectors command line: the configured source (a Connectors
  adapter alias, a connection and the read operation it declares for each kind of read), how the
  command line is run, what `operations describe` reports for an operation and what one read
  answers; and a governed write: the operation written, the person's approval proof it passes and
  what Connectors answers for it. A read never carries a credential and never runs an operation
  Connectors describes as a mutation. A write carries no credential either; it runs only for a
  request the runtime admitted, with the path of the approval proof, and is never retried.

naming:
  wire: datasource
  display: Data source

types:
  # The host's name for a configured source; a refusal names it.
  - name: loom.datasource.SourceName
    kind: newtype
    of: String

  # A configured Connectors adapter, as `--adapter` names it.
  - name: loom.datasource.AdapterAlias
    kind: newtype
    of: String

  # A Connectors connection, as `--connection` names it.
  - name: loom.datasource.ConnectionId
    kind: newtype
    of: String

  # An operation of the adapter's descriptor, as `--operation` names it.
  - name: loom.datasource.OperationId
    kind: newtype
    of: String

  # The three kinds of read a plugin asks a source for.
  - name: loom.datasource.ReadKind
    kind: enum
    variants: [List, Search, Get]

  # One configured source: the adapter and connection every read of it uses, and the read
  # operation it declares for each kind. A kind with no operation is not read.
  - name: loom.datasource.DataSource
    kind: struct
    fields:
      - name: name
        type: loom.datasource.SourceName
      - name: adapter
        type: loom.datasource.AdapterAlias
      - name: connection
        type: loom.datasource.ConnectionId
      - name: list
        type: Optional<loom.datasource.OperationId>
      - name: search
        type: Optional<loom.datasource.OperationId>
      - name: get
        type: Optional<loom.datasource.OperationId>

  # How the command line is run: the program, and the `--config` file and `--state-dir`
  # directory passed to every command when given (Connectors' defaults otherwise).
  # `timeout_seconds` bounds each command, describe and invoke alike: one still running after it
  # is killed and reaped, and the read fails naming the timeout. Absent, the bound is 60 seconds.
  - name: loom.datasource.ConnectorsCliConfig
    kind: struct
    fields:
      - name: program
        type: String
      - name: config
        type: Optional<String>
      - name: state_dir
        type: Optional<String>
      - name: timeout_seconds
        type: Optional<Integer>

  # What `operations describe` reports for one read operation: its exact schema identity (the
  # value `operations invoke --schema` takes), its input schema as a JSON Schema document and the
  # descriptor revision (`--revision`).
  - name: loom.datasource.SourceEntity
    kind: struct
    fields:
      - name: operation
        type: loom.datasource.OperationId
      - name: schema
        type: String
      - name: input_schema
        type: Json
      - name: revision
        type: String

  # What one read answers: the provider's answer as a JSON value, and the execution audit
  # record Connectors names for it (`source_audit.audit_ref`), absent when the CLI names none.
  - name: loom.datasource.ReadResult
    kind: struct
    fields:
      - name: body
        type: Json
      - name: audit_ref
        type: Optional<String>

  # A read that was not made, or that Connectors refused. `code` is `undeclared-kind` (the
  # source declares no operation for the kind; no process started), `write-operation` (the
  # operation is described with the `mutation` profile; not invoked), or Connectors' own failure
  # code (`not_granted`, `not_found`, …). `source` is present when the read named a source.
  - name: loom.datasource.ReadRefusal
    kind: struct
    fields:
      - name: source
        type: Optional<loom.datasource.SourceName>
      - name: adapter
        type: loom.datasource.AdapterAlias
      - name: operation
        type: Optional<loom.datasource.OperationId>
      - name: code
        type: String
      - name: message
        type: String

  # The operation a governed write performs: the adapter and connection it is written through and
  # the operation, as `--adapter`, `--connection` and `--operation` name them. `describe` must
  # report the operation with the `mutation` profile, or nothing is invoked.
  - name: loom.datasource.WriteOperation
    kind: struct
    fields:
      - name: adapter
        type: loom.datasource.AdapterAlias
      - name: connection
        type: loom.datasource.ConnectionId
      - name: operation
        type: loom.datasource.OperationId

  # The person's confirmation of one write: the absolute path of the proof
  # `connectors approvals issue --proof-output` wrote, passed as `--approval-file`. Loom never
  # reads, writes or stores the proof. An empty path is refused `approval-missing` and a path that
  # is not absolute `approval-not-absolute`, before any process starts.
  - name: loom.datasource.WriteApproval
    kind: struct
    fields:
      - name: proof_file
        type: String

  # How Connectors classifies a write's effect (`mutation.classification`): `not_attempted` and
  # `refused` changed nothing, `applied` changed the target, and `unknown` may have. An answer
  # Loom cannot read once the invoke started (no JSON, a lost answer, a timeout, no
  # classification) is Unknown too.
  - name: loom.datasource.MutationClassification
    kind: enum
    variants: [NotAttempted, Refused, Applied, Unknown]

  # What one governed write answers once its invoke started: the classification, the idempotency
  # key it was invoked with (derived from the admitted request id, so the same admitted request
  # always has the same key), Connectors' `request_id` and execution audit record
  # (`source_audit`, and its `audit_ref`) when it names them, the provider's answer for an applied
  # write (`body`), and Connectors' failure code (`code`) when the invoke failed. A write is invoked
  # once and an Unknown one is never invoked again.
  - name: loom.datasource.WriteResult
    kind: struct
    fields:
      - name: classification
        type: loom.datasource.MutationClassification
      - name: idempotency_key
        type: String
      - name: request_id
        type: Optional<String>
      - name: body
        type: Optional<Json>
      - name: source_audit
        type: Optional<Json>
      - name: audit_ref
        type: Optional<String>
      - name: code
        type: Optional<String>

  # A governed write that was never invoked. `code` is `approval-missing` or
  # `approval-not-absolute` (no process started), `not-a-write` (`describe` reports the
  # operation with another profile than `mutation`; not invoked), or the code Connectors refused
  # the describe with.
  - name: loom.datasource.WriteRefusal
    kind: struct
    fields:
      - name: adapter
        type: loom.datasource.AdapterAlias
      - name: operation
        type: Optional<loom.datasource.OperationId>
      - name: code
        type: String
      - name: message
        type: String
