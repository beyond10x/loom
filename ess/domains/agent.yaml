# An agent as data (story agent-domain): the typed form of one `loom.agent/1` document. Sources
# read: the story's Outcome; the Kubernetes design's § 3 table (`loom-kubernetes.md`, D1), merged
# with the SDK design's `AgentSpec` and `ToolPolicy` (`loom-sdk.md` § 3.2) as one domain
# (`approval-record:loom-kubernetes-filing`, D1); `loom.plugin.PluginConfig` and
# `loom.slack.SlackConfig`, whose field names a spec reuses where the meaning is the same, so a
# spec lowers to a `PluginConfig` without translation.
#
# `commission.responsibility.Agent` is the worker an assignment names; an `AgentSpec` defines how
# such an assigned agent runs and does not shadow it. ESS cannot name another system's type, so a
# session's run budget and stop policy are declared here field for field as Commission declares
# them (`RunBudget`, `ActionBudget`, `StopPolicy`, `LimitBreachStep`, `BreachStep`,
# `BudgetLimit`), and convert one to one. A spec is a document a host reads: it has no lifecycle,
# so the domain declares types, and one stateless command, `CheckAgentSpec` (story agent-check):
# whether the document at a path can be served, answered before anything runs.
domain: loom.agent

summary: >-
  An agent as data: one `loom.agent/1` document naming the agent and its brief, its models, the
  harness session it may run (kind, run budget, stop policy, confinement and tool policy), its
  outer and inner loop, the states an item is projected by, the bindings it reads and writes
  through, its channel, write policy, capabilities, exposure, runtime and deployment.

naming:
  wire: agent
  display: Agent

types:
  # The agent's id, stable across revisions of its spec.
  - name: loom.agent.AgentId
    kind: newtype
    of: String

  # Who the agent is: its id, a display name, and its brief, the standing text of every turn.
  - name: loom.agent.AgentIdentity
    kind: struct
    fields:
      - name: id
        type: loom.agent.AgentId
      - name: name
        type: String
      - name: brief
        type: String

  # What confines the children an agent starts. Q6 A: one value today, `none`; no confinement of
  # the `connectors` child.
  - name: loom.agent.ConfinementMode
    kind: enum
    variants: [none]

  # Who decides a session's tool calls, as metaharness names the modes: `frame`, the adapter from
  # the allowed set; `ask`, the embedder, one round trip per call; `observe`, every call allowed
  # and recorded. Loom never answers a call itself.
  - name: loom.agent.DecisionMode
    kind: enum
    variants: [frame, ask, observe]

  # One network destination a session may reach: Substrate's aperture, its name, host, port and
  # byte ceiling over both directions summed (absent, none).
  - name: loom.agent.EgressAperture
    kind: struct
    fields:
      - name: name
        type: String
      - name: host
        type: String
      - name: port
        type: Integer
      - name: max_bytes
        type: Optional<Integer>

  # What a session's harness may do: the tools allowed and denied by name, the egress apertures
  # it may reach, and who decides each tool call. Set by the host, never per call.
  - name: loom.agent.ToolPolicy
    kind: struct
    fields:
      - name: allow
        type: List<String>
      - name: deny
        type: List<String>
      - name: egress
        type: List<loom.agent.EgressAperture>
      - name: decisions
        type: loom.agent.DecisionMode

  # The limits of one action of a run: commission.responsibility.ActionBudget, field for field.
  - name: loom.agent.ActionBudget
    kind: struct
    fields:
      - name: action
        type: String
      - name: max_trials
        type: Optional<Integer>
      - name: max_tokens_in
        type: Optional<Integer>
      - name: max_tokens_out
        type: Optional<Integer>
      - name: max_duration_ms
        type: Optional<Integer>
      - name: max_cost_micro_usd
        type: Optional<Integer>

  # The limits of one run: commission.responsibility.RunBudget, field for field.
  - name: loom.agent.RunBudget
    kind: struct
    fields:
      - name: max_steps
        type: Optional<Integer>
      - name: max_tokens_in
        type: Optional<Integer>
      - name: max_tokens_out
        type: Optional<Integer>
      - name: max_duration_ms
        type: Optional<Integer>
      - name: max_cost_micro_usd
        type: Optional<Integer>
      - name: max_tokens
        type: Optional<Integer>
      - name: deadline
        type: Optional<Timestamp>
      - name: per_action
        type: List<loom.agent.ActionBudget>

  # Which limit of a run or action budget: commission.responsibility.BudgetLimit, variant for
  # variant.
  - name: loom.agent.BudgetLimit
    kind: enum
    variants:
      [MaxSteps, MaxTrials, MaxTokensIn, MaxTokensOut, MaxDurationMs, MaxCostMicroUsd, MaxTokens,
       Deadline]

  # What becomes of an executor step past a limit: commission.responsibility.BreachStep.
  - name: loom.agent.BreachStep
    kind: enum
    variants: [DiscardStep, KeepStep]

  # The choice for one limit: commission.responsibility.LimitBreachStep, field for field.
  - name: loom.agent.LimitBreachStep
    kind: struct
    fields:
      - name: limit
        type: loom.agent.BudgetLimit
      - name: step
        type: loom.agent.BreachStep

  # How a run stops: commission.responsibility.StopPolicy, field for field.
  - name: loom.agent.StopPolicy
    kind: struct
    fields:
      - name: approval_gate
        type: Boolean
      - name: idle_bound
        type: Optional<Integer>
      - name: on_breach
        type: loom.agent.BreachStep
      - name: breach_by_limit
        type: List<loom.agent.LimitBreachStep>

  # The harness session an agent runs, for an agent that runs one: the session's kind, its run
  # budget and stop policy, what confines it, and its tool policy.
  - name: loom.agent.SessionSpec
    kind: struct
    fields:
      - name: kind
        type: loom.session.SessionKind
      - name: budget
        type: loom.agent.RunBudget
      - name: stop
        type: loom.agent.StopPolicy
      - name: confinement
        type: loom.agent.ConfinementMode
      - name: tools
        type: loom.agent.ToolPolicy

  # The outer loop, the poll: the seconds between two polls (`PluginConfig.poll_interval_seconds`),
  # the bindings polled for items, the minutes an item must have aged before it is one
  # (`SlackConfig.min_age_minutes`), and how far back a source never read before is read (absent,
  # the plugin's default; `SlackConfig.lookback_minutes`).
  - name: loom.agent.OuterLoop
    kind: struct
    fields:
      - name: poll_interval_seconds
        type: Integer
      - name: sources
        type: List<loom.datasource.SourceName>
      - name: min_age_minutes
        type: Integer
      - name: lookback_minutes
        type: Optional<Integer>

  # The inner loop, one turn: its protocol by catalog reference (`name@major`), the steps and model
  # requests a turn may take, and the classification threshold. Q9 C: absent, no classifier
  # request is made and the spec has one state; present, the classifier's intent keys the states
  # and an item below it is recorded unclassified (`PluginConfig.classify_threshold`).
  - name: loom.agent.InnerLoop
    kind: struct
    fields:
      - name: protocol
        type: String
      - name: step_budget
        type: Integer
      - name: model_budget
        type: Integer
      - name: classify_threshold
        type: Optional<Decimal>

  # Both loops of an agent.
  - name: loom.agent.Loops
    kind: struct
    fields:
      - name: outer
        type: loom.agent.OuterLoop
      - name: inner
        type: loom.agent.InnerLoop

  # When a state applies: the classified intent it handles.
  - name: loom.agent.StateWhen
    kind: struct
    fields:
      - name: intent
        type: loom.plugin.Intent

  # One state of the agent: its name, when it applies, and the actions and sources a turn in it
  # may use, which lower to one `loom.plugin.Projection` field for field. An intent no state names
  # gets no turn.
  - name: loom.agent.AgentState
    kind: struct
    fields:
      - name: name
        type: String
      - name: when
        type: loom.agent.StateWhen
      - name: actions
        type: List<String>
      - name: sources
        type: List<loom.datasource.SourceName>

  # A binding read and written through the Connectors command line: the fields of a
  # `loom.datasource.DataSource`, with the same names, plus the write operation it may perform.
  - name: loom.agent.ConnectorsBinding
    kind: struct
    fields:
      - name: name
        type: loom.datasource.SourceName
      - name: adapter
        type: loom.datasource.AdapterAlias
      - name: connection
        type: loom.datasource.ConnectionId
      - name: list
        type: Optional<loom.datasource.OperationId>
      - name: search
        type: Optional<loom.datasource.OperationId>
      - name: get
        type: Optional<loom.datasource.OperationId>
      - name: write
        type: Optional<loom.datasource.OperationId>

  # A binding read over HTTP: its base URL, the paths it may request, the method, the environment
  # variable holding a bearer token (absent, none), and the most bytes an answer may hold. Each
  # allowed path starts with `/` and holds no `\`, no `.` or `..` segment, no percent-encoded
  # separator or dot, no `?` or `#` and no whitespace or control character; a document listing
  # another is malformed.
  - name: loom.agent.HttpBinding
    kind: struct
    fields:
      - name: name
        type: loom.datasource.SourceName
      - name: base_url
        type: String
      - name: allow_paths
        type: List<String>
      - name: method
        type: String
      - name: bearer_env
        type: Optional<String>
      - name: max_bytes
        type: Integer

  # One binding a source of the spec names. On the wire the tag is `kind` and the binding's fields
  # sit beside it.
  - name: loom.agent.Binding
    kind: union
    tag: kind
    variants:
      connectors: loom.agent.ConnectorsBinding
      http: loom.agent.HttpBinding

  # The channel items come from and replies go to: the binding, the only channel ids read or
  # written, and the bot's user id (`SlackConfig.bot_user_id`).
  - name: loom.agent.ChannelSpec
    kind: struct
    fields:
      - name: binding
        type: loom.datasource.SourceName
      - name: allow
        type: List<String>
      - name: bot_user_id
        type: String

  # How a write is admitted: sent once admitted (`auto`), after a person's approval (`approval`),
  # or never (`none`).
  - name: loom.agent.WriteMode
    kind: enum
    variants: [auto, approval, none]

  # The write policy: the mode, and the most writes an hour.
  - name: loom.agent.WritesSpec
    kind: struct
    fields:
      - name: mode
        type: loom.agent.WriteMode
      - name: max_per_hour
        type: Integer

  # The capabilities the agent's authority grants; every other is denied.
  - name: loom.agent.PolicySpec
    kind: struct
    fields:
      - name: capabilities
        type: List<String>

  # The card an A2A listener publishes: a name, a description and the skills it names.
  - name: loom.agent.A2aCard
    kind: struct
    fields:
      - name: name
        type: String
      - name: description
        type: String
      - name: skills
        type: List<String>

  # An A2A listener: its port, its path and its card.
  - name: loom.agent.A2aExposure
    kind: struct
    fields:
      - name: port
        type: Integer
      - name: path
        type: String
      - name: card
        type: loom.agent.A2aCard

  # What the agent exposes; absent, no listener.
  - name: loom.agent.ExposeSpec
    kind: struct
    fields:
      - name: a2a
        type: Optional<loom.agent.A2aExposure>

  # Where the agent runs: its state directory, the Connectors command line it reads and writes
  # through, and what confines the children it starts. Without `connectors` the spec decodes and
  # `agent serve` refuses to start, as it does without `runtime` (story loom-agent-trial-fixes).
  - name: loom.agent.RuntimeSpec
    kind: struct
    fields:
      - name: state_dir
        type: String
      - name: connectors
        type: Optional<loom.datasource.ConnectorsCliConfig>
      - name: confinement
        type: loom.agent.ConfinementMode

  # One label of a Kubernetes selector.
  - name: loom.agent.Label
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: String

  # The resources a pod requests, as Kubernetes spells them.
  - name: loom.agent.KubernetesResources
    kind: struct
    fields:
      - name: cpu
        type: String
      - name: memory
        type: String

  # One destination the pod may reach: a host outside the cluster, or the pods a selector picks in
  # a namespace, at a port.
  - name: loom.agent.KubernetesEgress
    kind: struct
    fields:
      - name: name
        type: String
      - name: host
        type: Optional<String>
      - name: namespace
        type: Optional<String>
      - name: selector
        type: List<loom.agent.Label>
      - name: port
        type: Integer

  # One source the pod may be reached from: a namespace, at a port.
  - name: loom.agent.KubernetesIngress
    kind: struct
    fields:
      - name: name
        type: String
      - name: from_namespace
        type: String
      - name: port
        type: Integer

  # A Kubernetes deployment of the agent, read only when it is projected, never when it is served.
  # `image_repository` is read by nothing and may be absent (story loom-agent-trial-fixes).
  - name: loom.agent.KubernetesDeploy
    kind: struct
    fields:
      - name: namespace
        type: String
      - name: service_account
        type: String
      - name: image_repository
        type: Optional<String>
      - name: resources
        type: loom.agent.KubernetesResources
      - name: egress
        type: List<loom.agent.KubernetesEgress>
      - name: ingress
        type: List<loom.agent.KubernetesIngress>

  # How the agent is deployed; absent, nowhere.
  - name: loom.agent.DeploySpec
    kind: struct
    fields:
      - name: kubernetes
        type: Optional<loom.agent.KubernetesDeploy>

  # One `loom.agent/1` document: its format (`loom.agent/1`), who the agent is, its models (a role
  # it does not use is left out), the harness session it runs, its loops, states, bindings,
  # channel, write policy, capabilities, exposure, runtime and deployment. Only the format, the
  # agent and its models are required, so one type serves an agent a product runs as a session and
  # an agent served from its spec; a section left out is absent and a list left out is empty.
  - name: loom.agent.AgentSpec
    kind: struct
    fields:
      - name: format
        type: String
      - name: agent
        type: loom.agent.AgentIdentity
      - name: model
        type: loom.models.ModelsConfig
      - name: session
        type: Optional<loom.agent.SessionSpec>
      - name: loops
        type: Optional<loom.agent.Loops>
      - name: states
        type: List<loom.agent.AgentState>
      - name: bindings
        type: List<loom.agent.Binding>
      - name: channel
        type: Optional<loom.agent.ChannelSpec>
      - name: writes
        type: Optional<loom.agent.WritesSpec>
      - name: policy
        type: Optional<loom.agent.PolicySpec>
      - name: expose
        type: Optional<loom.agent.ExposeSpec>
      - name: runtime
        type: Optional<loom.agent.RuntimeSpec>
      - name: deploy
        type: Optional<loom.agent.DeploySpec>

  # Why a spec cannot be served (story agent-check), one reason per refusal of `CheckAgentSpec`:
  # the document does not decode as a `loom.agent/1` document (`Malformed`); a string of the
  # document holds a credential, where only a reference belongs (`SecretLiteral`); the inner
  # loop's protocol is not in the plugin catalog, or states are declared with no inner loop to
  # check them against (`UnknownProtocol`); a state names an action its protocol lacks
  # (`UnknownAction`); a state, the outer loop or the channel names a source no binding declares
  # (`UnboundSource`); an `http` binding's method is not `GET` (`HttpMethod`); `reply.send` is
  # among the capabilities while writes are `none` or undeclared (`SendWithoutWrites`); the
  # channel's allow list is empty (`EmptyChannelAllow`).
  - name: loom.agent.RefusalReason
    kind: enum
    variants:
      [Malformed, SecretLiteral, UnknownProtocol, UnknownAction, UnboundSource, HttpMethod,
       SendWithoutWrites, EmptyChannelAllow]

  # Why a served agent does not send a proposed reply (story agent-serve), one reason per refusal
  # of `AdmitSend`: the spec's writes are `none` (`WritesNone`); the item's channel is not in
  # `channel.allow` (`OutsideAllowList`); no reply is proposed for the item revision
  # (`NoProposal`); the hour's sends reached `writes.max_per_hour` (`RateLimited`).
  - name: loom.agent.SendRefusalReason
    kind: enum
    variants: [WritesNone, OutsideAllowList, NoProposal, RateLimited]

  # Why a read of an `http` binding answers the model nothing (story agent-http-binding), one
  # reason per refusal of `AdmitHttpRead` and `BoundHttpAnswer`: the binding's method is not
  # `GET` (`MethodNotGet`); the read's path is not exactly one of the binding's `allow_paths`, or
  # holds a `\`, a `.` or `..` segment or an encoded separator (`PathNotAllowed`); the binding
  # names a `bearer_env` that is unset, empty or blank on the host (`BearerMissing`); the endpoint
  # answered a redirect, which is never followed (`Redirected`); the endpoint answered a status
  # outside 2xx (`FailedStatus`).
  - name: loom.agent.HttpReadRefusalReason
    kind: enum
    variants: [MethodNotGet, PathNotAllowed, BearerMissing, Redirected, FailedStatus]

  # Why the A2A listener of a served agent refuses a request (story agent-a2a), one reason per
  # refusal of `AdmitA2aRequest`: the request carries no `Authorization: Bearer` header
  # (`MissingBearer`); it carries one whose token is not the agent's (`WrongBearer`).
  - name: loom.agent.A2aRefusalReason
    kind: enum
    variants: [MissingBearer, WrongBearer]

  # Why `b10x-loom agent serve` does not serve a spec `CheckAgentSpec` accepts (story agent-a2a),
  # one reason per refusal of `AdmitServe`: the spec declares neither a `channel` to poll nor
  # `expose.a2a` to answer on, so the host would run nothing (`NothingToServe`).
  - name: loom.agent.ServeRefusalReason
    kind: enum
    variants: [NothingToServe]

errors:
  # The refusal of `AdmitSend`: why, and whether it is final. A final refusal ends the turn's run
  # (Commission's `EffectOutcomeRefused.ends_run`): the item is handled and its reply never sent. A
  # refusal that is not final leaves the run to go on, as a send proposed before any reply.
  - name: loom.agent.SendRefused
    fields:
      - name: reason
        type: loom.agent.SendRefusalReason
      - name: final
        type: Boolean

  # The refusal of `AdmitHttpRead` or `BoundHttpAnswer`: why. It ends the step refused, never the
  # run: the model is told the refusal as data and the turn goes on.
  - name: loom.agent.HttpReadRefused
    fields:
      - name: reason
        type: loom.agent.HttpReadRefusalReason

  # The one refusal of `CheckAgentSpec`: why, which member of the document (a path such as
  # `states[0].actions[2]` or `bindings[1].method`; `document` when none), and the detail a person
  # reads (the action, source or protocol named, or what the decoder refused).
  - name: loom.agent.SpecRefused
    fields:
      - name: reason
        type: loom.agent.RefusalReason
      - name: member
        type: String
      - name: detail
        type: String

  # The refusal of `AdmitA2aRequest`: why. The listener answers it `401` before it reads the
  # request's body, so a refused request runs no turn and reads nothing.
  - name: loom.agent.A2aRefused
    fields:
      - name: reason
        type: loom.agent.A2aRefusalReason

  # The refusal of `AdmitServe`: why. The host exits before it reads, calls a model or records.
  - name: loom.agent.ServeRefused
    fields:
      - name: reason
        type: loom.agent.ServeRefusalReason

commands:
  # Whether the `loom.agent/1` document at `path` can be served: `b10x-loom agent check --spec`.
  # The document and the plugin catalog it is checked against are outside the input, so every
  # refusal is external; the first refusal found, in declaration order, is the answer, and a
  # document none of them claims is serveable. Nothing runs, nothing is read but the document,
  # and nothing is held between two checks.
  - name: loom.agent.CheckAgentSpec
    input:
      - name: path
        type: String
    outcomes:
      - name: malformed
        external: the document at the path does not decode as a loom.agent/1 document
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: Malformed}
      - name: secret-literal
        external: a string of the document holds a credential
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: SecretLiteral}
      - name: unknown-protocol
        external: the inner loop names a protocol the plugin catalog does not hold, or states are declared with no inner loop
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: UnknownProtocol}
      - name: unknown-action
        external: a state names an action the inner loop's protocol does not declare
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: UnknownAction}
      - name: unbound-source
        external: a state, the outer loop or the channel names a source no binding declares
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: UnboundSource}
      - name: http-method
        external: an http binding's method is not GET
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: HttpMethod}
      - name: send-without-writes
        external: reply.send is a capability while writes are none or undeclared
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: SendWithoutWrites}
      - name: empty-channel-allow
        external: the channel's allow list is empty
        error: loom.agent.SpecRefused
        payload:
          loom.agent.SpecRefused: {reason: EmptyChannelAllow}
      - name: serveable
        accepts: nothing

  # Whether a served agent sends the reply its turn proposed: `b10x-loom agent serve` decides it
  # before `reply.send` reaches the connectors CLI, over what the host already knows. `mode` is
  # the spec's `writes.mode`; `channel_allowed` whether the item's channel is in `channel.allow`;
  # `proposed` whether a reply is recorded for the item revision; `granted` whether a person
  # approved this send (`b10x-loom approve`); `sent_in_window` the sends of the last hour against
  # `max_per_hour`. The first refusal in declaration order is the answer. `held` is approval mode
  # before the grant: the turn ends awaiting approval and the send waits for `resume`. `admitted`
  # is the send. Nothing here is held between two decisions: the counter is the state directory's.
  - name: loom.agent.AdmitSend
    input:
      - name: mode
        type: loom.agent.WriteMode
      - name: channel_allowed
        type: Boolean
      - name: proposed
        type: Boolean
      - name: granted
        type: Boolean
      - name: sent_in_window
        type: Integer
      - name: max_per_hour
        type: Integer
    outcomes:
      - name: writes-none
        when: mode == none
        error: loom.agent.SendRefused
        payload:
          loom.agent.SendRefused: {reason: WritesNone, final: true}
      - name: outside-allow-list
        when: channel_allowed == false
        error: loom.agent.SendRefused
        payload:
          loom.agent.SendRefused: {reason: OutsideAllowList, final: true}
      - name: no-proposal
        when: proposed == false
        error: loom.agent.SendRefused
        payload:
          loom.agent.SendRefused: {reason: NoProposal, final: false}
      - name: rate-limited
        when: sent_in_window >= max_per_hour
        error: loom.agent.SendRefused
        payload:
          loom.agent.SendRefused: {reason: RateLimited, final: true}
      - name: held
        when:
          all:
            - mode == approval
            - granted == false
        accepts: nothing
      - name: admitted
        accepts: nothing

  # Whether a `source.read` of an `http` binding starts a request: `b10x-loom agent serve` decides
  # it before any request, over the binding and the read's path. `method` is the binding's
  # `method`; `path_allowed` whether the read's path is exactly one of the binding's
  # `allow_paths`, holding no `\`, no `.` or `..` segment and no encoded separator, which the host
  # decides over the two texts even for a path the list names; `bearer_missing` whether the
  # binding names a `bearer_env` that is unset, or set to empty or blank text, on the host: an
  # empty token is no bearer, and no request goes out without one. The first refusal in declaration order is the answer; `admitted` is one GET of the path
  # under the binding's `base_url`. Nothing is held between two decisions.
  - name: loom.agent.AdmitHttpRead
    input:
      - name: method
        type: String
      - name: path_allowed
        type: Boolean
      - name: bearer_missing
        type: Boolean
    outcomes:
      - name: method-not-get
        when: method != GET
        error: loom.agent.HttpReadRefused
        payload:
          loom.agent.HttpReadRefused: {reason: MethodNotGet}
      - name: path-not-allowed
        when: path_allowed == false
        error: loom.agent.HttpReadRefused
        payload:
          loom.agent.HttpReadRefused: {reason: PathNotAllowed}
      - name: bearer-missing
        when: bearer_missing == true
        error: loom.agent.HttpReadRefused
        payload:
          loom.agent.HttpReadRefused: {reason: BearerMissing}
      - name: admitted
        accepts: nothing

  # What a turn reads of an `http` binding's answer: `status` is the response status, `bytes` how
  # many bytes of the body the host read (it reads at most one past the bound), `max_bytes` the
  # binding's bound. A redirect is never followed (`redirected`), and the refusal names at most
  # 256 bytes of its location and no more than `max_bytes`, cut on a character boundary and marked
  # as cut; a status outside 2xx
  # answers nothing (`failed-status`); an answer past the bound reaches the model cut at
  # `max_bytes` and marked as cut (`cut`); any other reaches it whole (`whole`). The text the model
  # reads is never longer than `max_bytes` bytes: the body is cut in bytes, backed off to a
  # character boundary, and a byte that is not UTF-8 is dropped from it rather than replaced.
  - name: loom.agent.BoundHttpAnswer
    input:
      - name: status
        type: Integer
      - name: bytes
        type: Integer
      - name: max_bytes
        type: Integer
    outcomes:
      - name: redirected
        when:
          all:
            - status >= 300
            - status <= 399
        error: loom.agent.HttpReadRefused
        payload:
          loom.agent.HttpReadRefused: {reason: Redirected}
      - name: failed-status
        when:
          any:
            - status <= 199
            - status >= 400
        error: loom.agent.HttpReadRefused
        payload:
          loom.agent.HttpReadRefused: {reason: FailedStatus}
      - name: cut
        when: bytes > max_bytes
        accepts: nothing
      - name: whole
        accepts: nothing

  # Whether the A2A listener of a served agent (`expose.a2a`, story agent-a2a) answers a request:
  # decided on the request line and its headers, before the body is read. `probe` is whether the
  # request is `GET /ready` or `GET /live`, which the pod's probes send without a bearer;
  # `bearer_presented` whether it carries an `Authorization: Bearer` header; `bearer_matches`
  # whether that token is the one the agent's Secret gives it. A probe is answered whatever it
  # carries; every other request (the agent card, `message/send`, the task status, any other path)
  # needs the bearer. The first refusal in declaration order is the answer, so a request with no
  # header is `missing-bearer` whatever `bearer_matches` says. Nothing is held between two
  # decisions.
  - name: loom.agent.AdmitA2aRequest
    input:
      - name: probe
        type: Boolean
      - name: bearer_presented
        type: Boolean
      - name: bearer_matches
        type: Boolean
    outcomes:
      - name: missing-bearer
        when:
          all:
            - probe == false
            - bearer_presented == false
        error: loom.agent.A2aRefused
        payload:
          loom.agent.A2aRefused: {reason: MissingBearer}
      - name: wrong-bearer
        when:
          all:
            - probe == false
            - bearer_matches == false
        error: loom.agent.A2aRefused
        payload:
          loom.agent.A2aRefused: {reason: WrongBearer}
      - name: probe
        when: probe == true
        accepts: nothing
      - name: admitted
        accepts: nothing

  # Whether `b10x-loom agent serve` serves a spec `CheckAgentSpec` accepts, and what its host runs
  # (story agent-a2a): `channel` is whether the spec declares a `channel`, `a2a` whether it
  # declares `expose.a2a`. A spec with neither is refused: the host would run nothing. With a
  # channel the host polls it, and with `expose.a2a` as well it answers A2A beside the poll; with
  # `expose.a2a` alone it polls nothing and its main loop is the A2A listener, which SIGTERM ends
  # as it ends the poll. Decided before anything is read, a model called or a record written.
  - name: loom.agent.AdmitServe
    input:
      - name: channel
        type: Boolean
      - name: a2a
        type: Boolean
    outcomes:
      - name: nothing-to-serve
        when:
          all:
            - channel == false
            - a2a == false
        error: loom.agent.ServeRefused
        payload:
          loom.agent.ServeRefused: {reason: NothingToServe}
      - name: polls-and-answers
        when:
          all:
            - channel == true
            - a2a == true
        accepts: nothing
      - name: polls
        when: channel == true
        accepts: nothing
      - name: answers
        accepts: nothing
