# The case the governor holds, as a durable store keeps it (story governor-restart-durability).
# Nouns are read from crates/loom-governor/src/lib.rs (CaseState, HeldEvidence, the observations a
# FallibleCaseStore keeps) and Commission's commission.responsibility.Evidence and Observation,
# which this domain mirrors field for field rather than naming across systems. A store writes one
# StoredCase per case and the StoredObservation list beside it; reading them back must give the
# governor the same case, so every Json value is kept as it arrived, members in order and numbers
# in their spelling. Protocol definitions are not stored: the host registers them again.
# A decision request is kept as StoredDecisionRequest, a file each beside the cases (story
# decision-request-file-store); its fields are typed by loom.decision.
domain: loom.governor

summary: >-
  The governor's held case as a store writes it: the case id, the protocol that governs it, the
  case revision, the current revision of every declared artifact, the value of every case input
  the protocol declares, the independence dimensions the host declared for each evidence producer,
  every evidence record received with whether it applies, and every explicit decision recorded for
  it; and the observations kept beside the cases.

naming:
  wire: governor
  display: Governor

types:
  # A case id the governor issued: Commission's commission.responsibility.CaseId.
  - name: loom.governor.StoredCaseId
    kind: newtype
    of: String

  # The current revision of one artifact the case's protocol declares.
  - name: loom.governor.StoredArtifact
    kind: struct
    fields:
      - name: artifact
        type: String
      - name: revision
        type: String

  # One evidence record as submit_evidence admitted it: Commission's
  # commission.responsibility.Evidence data, field for field.
  - name: loom.governor.StoredEvidenceData
    kind: struct
    fields:
      - name: evidence_id
        type: Uuid
      - name: case_id
        type: loom.governor.StoredCaseId
      - name: kind
        type: String
      - name: subject_revision
        type: Integer
      - name: producer
        type: String
      - name: observation_ids
        type: List<Uuid>
      - name: facts
        type: Json
      - name: provenance
        type: Json

  # One evidence record received for the case, and whether it applies: decided once, when it
  # arrived, and never again.
  - name: loom.governor.StoredEvidence
    kind: struct
    fields:
      - name: data
        type: loom.governor.StoredEvidenceData
      - name: applies
        type: Boolean

  # The value of one case input the case's protocol declares (`risk: standard`), as the host
  # supplied it when the case opened. Fixed for the life of the case.
  - name: loom.governor.StoredInput
    kind: struct
    fields:
      - name: input
        type: String
      - name: value
        type: String

  # One evidence producer the host declared, when the case opened, independent of the case's work
  # on `dimensions`, each an independence dimension the case's protocol declares, in dimension
  # order and each once (story governor-independence-declarations). Trusted context, never read
  # from an evidence record or a model; fixed for the life of the case.
  - name: loom.governor.StoredIndependence
    kind: struct
    fields:
      - name: producer
        type: String
      - name: dimensions
        type: List<String>

  # One held case. `protocol` is the registered name, `<name>@<major>`; `revision` is 1 when
  # opened and one more with each artifact revision recorded; `artifacts` are in artifact order;
  # `inputs` are the value of every case input the protocol declares, in input order, and empty
  # for a protocol that declares none; `evidence` is every record received, in the order
  # received; `decisions` is every explicit decision recorded for the case, in the order recorded,
  # each at the case revision it was taken at, and absent when none was. A case stored without
  # `inputs` is not read: the store reports it as a failure
  # naming the case, and never fills the inputs in. Nor is one whose `inputs` do not satisfy its
  # protocol, checked as at opening: a declared input missing (an empty list for a protocol that
  # declares inputs included), an input given twice, one the protocol does not declare, or a
  # value its input does not list. Such a case is a store failure naming the case and the input;
  # it is never decided and its inputs are never reported. `independence` lists, in producer
  # order and each producer once, the producers the host declared independent and on which
  # dimensions; it is absent when the host declared none, as in every case Loom 0.23.0 and
  # earlier stored, which those versions evaluated with no producer declared. A case whose
  # declarations name a producer or a dimension twice, or a dimension its protocol does not
  # declare, is never decided.
  - name: loom.governor.StoredCase
    kind: struct
    fields:
      - name: id
        type: loom.governor.StoredCaseId
      - name: protocol
        type: String
      - name: revision
        type: Integer
      - name: artifacts
        type: List<loom.governor.StoredArtifact>
      - name: inputs
        type: List<loom.governor.StoredInput>
      - name: independence
        type: Optional<List<loom.governor.StoredIndependence>>
      - name: evidence
        type: List<loom.governor.StoredEvidence>
      - name: decisions
        type: Optional<List<loom.evaluation.ExplicitDecision>>

  # When a case completes while more than one outcome its protocol declares is legitimate at once
  # (story first-declared-completion). `ExactlyOne`, the default, completes only when exactly one
  # is legitimate and leaves the case open otherwise. `FirstDeclared` completes on the first
  # legitimate outcome in the protocol's declaration order, as the admitted protocol definition
  # declares it, never the order of the decision document's map. Neither ever completes on an
  # outcome Canon holds blocked, and with one legitimate outcome the two agree. Host
  # configuration, given when the governor is built: never read from a case or a model, and not
  # stored with a case.
  - name: loom.governor.CompletionRule
    kind: enum
    variants: [ExactlyOne, FirstDeclared]

  # One observation kept: Commission's commission.responsibility.Observation data, field for field.
  # Never evidence (Atlas ADR 0074).
  - name: loom.governor.StoredObservation
    kind: struct
    fields:
      - name: observation_id
        type: Uuid
      - name: source
        type: String
      - name: subject
        type: String
      - name: observed_at
        type: Timestamp
      - name: payload
        type: Json

  # One decision request as FileDecisionStore keeps it, one file per request beside the cases
  # (story decision-request-file-store): the request, field for field as loom.decision declares
  # the entity DecisionRequest, typed by that domain's types; its lifecycle state; the
  # EscalationSuppressedRecords kept beside it, in the order appended; and `position`, its place
  # in the order requests were first stored (one more than the highest the directory held when
  # the request was first written, kept by every later write), so the store lists in that order
  # after a restart. The store keeps the request and the records as the domain declares them and
  # reads nothing into them. A file that does not read as one, holds another request's id,
  # breaks an invariant of DecisionRequest or keeps a record of another request is refused,
  # naming the file, and never repaired. The domain declares no conflict of its own: a write over
  # a request that changed since it was read is the DecisionStore port's StoreConflict.
  - name: loom.governor.StoredDecisionRequest
    kind: struct
    fields:
      - name: position
        type: Integer
      - name: state
        type: loom.decision.DecisionRequest.State
      - name: request
        type: loom.governor.StoredDecisionRequestData
      - name: records
        type: List<loom.decision.EscalationSuppressedRecord>

  # The fields of loom.decision.DecisionRequest, its identity `request_id` first, each typed as
  # that entity declares it.
  - name: loom.governor.StoredDecisionRequestData
    kind: struct
    fields:
      - name: request_id
        type: loom.decision.DecisionRequestId
      - name: case_id
        type: loom.decision.CaseId
      - name: question_key
        type: String
      - name: record_key
        type: String
      - name: unblocks
        type: loom.decision.Unblocks
      - name: subject_artifact
        type: loom.decision.ArtifactId
      - name: subject_revision
        type: loom.decision.Revision
      - name: subject_path
        type: Optional<String>
      - name: question
        type: String
      - name: options
        type: List<loom.decision.DecisionOption>
      - name: autonomy_level
        type: loom.decision.AutonomyLevel
      - name: decision_class
        type: loom.decision.DecisionClassId
      - name: holder
        type: loom.decision.Holder
      - name: eligible
        type: List<loom.decision.Principal>
      - name: addressed_to
        type: loom.decision.Principal
      - name: opened_at
        type: Timestamp
      - name: expires_at
        type: Optional<Timestamp>
      - name: supersedes
        type: Optional<loom.decision.DecisionRequestId>
      - name: recommended_option
        type: Optional<loom.decision.OptionLetter>
      - name: recommended_answer
        type: Optional<String>
      - name: recommendation_strength
        type: loom.decision.Strength
      - name: default_on_silence
        type: Boolean
      - name: grounds
        type: List<loom.decision.Ground>
      - name: recommended_by
        type: Optional<loom.decision.ProposerKind>
      - name: grounding_report
        type: Optional<String>
      - name: no_recommendation_reason
        type: Optional<String>
      - name: escalated_to
        type: Optional<loom.decision.Principal>
      - name: escalation_reason
        type: Optional<String>
      - name: decided_option
        type: Optional<loom.decision.OptionLetter>
      - name: decided_answer
        type: Optional<String>
      - name: decided_by
        type: Optional<loom.decision.Principal>
      - name: decided_by_kind
        type: Optional<loom.decision.PrincipalKind>
      - name: decided_at
        type: Optional<Timestamp>
      - name: decided_case_revision
        type: Optional<loom.decision.Revision>
      - name: decision_reasons
        type: List<String>
      - name: produced_record
        type: Optional<loom.decision.ProducedRecord>
      - name: superseded_by
        type: Optional<loom.decision.DecisionRequestId>
      - name: superseded_reason
        type: Optional<String>
