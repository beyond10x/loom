# A workflow definition a host runs with Commission's runtime (story dw-workflow-definition-executor).
# Nouns are read from the story's design and crates/loom-executor/src/harness/governed.rs (the
# governed loop a judgement step runs). A definition sequences the actions its protocol's frontier
# admits; Canon still decides admission and completion. A definition is a value with no lifecycle:
# the domain declares types only. Where the workflow stands in a run is kept in process and, when
# the host gives the executor a run store (story dw-durable-run-state), written after every
# performed step as a WorkflowRunRecord keyed by the Run id, so a run continues after a restart.
domain: loom.workflow

summary: >-
  A Loom-side definition of a workflow over one protocol: an ordered list of steps, each either
  deterministic (one action with literal arguments, proposed without a model) or a judgement (the
  actions a model may choose among, with instructions). A step may be conditional on a frontier
  claim, never on a model. A run's progress over a definition may be kept as a record a store
  writes after every performed step and a later process resumes from.

naming:
  wire: workflow
  display: Workflow

types:
  # A claim's three-valued truth, as a frontier reports it: Commission's
  # commission.responsibility.Truth. A Loom type: ESS cannot name another system's type.
  - name: loom.workflow.Truth
    kind: enum
    variants: ['True', 'False', Unknown]

  # What a conditional step waits for: the frontier claim named `claim` has the truth `value`.
  - name: loom.workflow.StepCondition
    kind: struct
    fields:
      - name: claim
        type: String
      - name: value
        type: loom.workflow.Truth

  # A deterministic step: one action of the protocol, proposed with these literal arguments; no
  # model is asked.
  - name: loom.workflow.DeterministicStep
    kind: struct
    fields:
      - name: action
        type: String
      - name: arguments
        type: Json

  # An earlier step's output, named by its step and its name (story dw-judgement-step-inputs). A
  # judgement step lists the outputs it is given; the definition is refused at load unless `step`
  # is an earlier step and `output` one of its declared outputs.
  - name: loom.workflow.OutputReference
    kind: struct
    fields:
      - name: step
        type: String
      - name: output
        type: String

  # A judgement step: the one place a model is asked, offered only these actions of the protocol,
  # with these instructions. The values of the outputs `inputs` lists are put into the
  # instructions as a data block, typed as their steps declare them, never as instructions; a
  # listed output the run did not produce asks the model nothing. No model supplies an output.
  - name: loom.workflow.JudgementStep
    kind: struct
    fields:
      - name: actions
        type: List<String>
      - name: instructions
        type: String
      - name: inputs
        type: List<loom.workflow.OutputReference>

  # What a step does. On the wire the tag is `kind` and the step's fields sit beside it.
  - name: loom.workflow.StepKind
    kind: union
    tag: kind
    variants:
      Deterministic: loom.workflow.DeterministicStep
      Judgement: loom.workflow.JudgementStep

  # The type a step output's value must have (story dw-typed-step-outputs): a string, an integer,
  # a boolean, any JSON value, or a list whose every item is one of them.
  - name: loom.workflow.OutputType
    kind: enum
    variants: [String, Integer, Boolean, Json, StringList, IntegerList, BooleanList, JsonList]

  # A value a step produces, taken from its performed effect's report (Commission's
  # EffectOutcomePerformed.report) at the JSON pointer `pointer` (RFC 6901) and held to `type`. A
  # later deterministic step's arguments name it as `{"$step": <step>, "$output": <name>}` inside
  # its Json arguments; the runtime fills it in without a model. It exists only once its step was
  # performed in the run, and is dropped with the run.
  - name: loom.workflow.StepOutput
    kind: struct
    fields:
      - name: name
        type: String
      - name: pointer
        type: String
      - name: type
        type: loom.workflow.OutputType

  # One step, named uniquely within its definition, taken only while its condition holds on the
  # frontier the run is handed. It owns the outputs it declares.
  - name: loom.workflow.WorkflowStep
    kind: struct
    fields:
      - name: name
        type: String
      - name: when
        type: Optional<loom.workflow.StepCondition>
      - name: kind
        type: loom.workflow.StepKind
      - name: outputs
        type: List<loom.workflow.StepOutput>

  # A workflow definition: its name, the protocol it runs over as the host's catalog names it
  # (`software-change@1`), and its steps in order. The definition owns its steps; it does not own
  # the protocol.
  - name: loom.workflow.WorkflowDefinition
    kind: struct
    fields:
      - name: name
        type: String
      - name: protocol
        type: String
      - name: steps
        type: List<loom.workflow.WorkflowStep>

  # One request a workflow step made, as a run record keeps it (story dw-durable-run-state): the
  # step's name, and the action and arguments of its proposal, the arguments as resolved when the
  # step was proposed.
  - name: loom.workflow.StepRequest
    kind: struct
    fields:
      - name: step
        type: String
      - name: action
        type: String
      - name: arguments
        type: Json

  # One output a performed step produced, as a run record keeps it: its step, its name and its
  # value, taken from the step's report and held to its declared type when the step was performed.
  - name: loom.workflow.RecordedOutput
    kind: struct
    fields:
      - name: step
        type: String
      - name: output
        type: String
      - name: value
        type: Json

  # An output a performed step declared and its report did not hold as declared: the step, the
  # output and why. A run that records one proposes nothing more.
  - name: loom.workflow.UnproducedOutput
    kind: struct
    fields:
      - name: step
        type: String
      - name: output
        type: String
      - name: why
        type: String

  # Where one workflow run stands, as a run store keeps it (story dw-durable-run-state,
  # architecture-decision-record workflow-run-store), written after every performed step and every
  # executor call. `run` is the Commission run the workflow run began under, as a typed id
  # (`loom.run.CommissionRunId`), and keys the record: a record read for another run is refused,
  # never read. `workflow` is the definition's name and `definition_digest` the SHA-256, in
  # lowercase hex, of the definition's canonical JSON; a record whose definition does not match the
  # executor's is refused. `performed` is every step seen performed, in order, the last one being
  # the step reached; `proposed` is the step proposed and not yet seen performed, so a request
  # performed after a restart (a resume after a grant) settles it; `outputs` are the outputs the
  # performed steps produced, in the order taken; `unproduced` is the output a performed step could
  # not produce; `attempted` names the step each executor call took, in call order; `usage` is what
  # the run spent so far, carried into the meter of the process that resumes it. A request proposed
  # and not recorded performed is proposed again after a restart: an effect tolerates one repeat.
  - name: loom.workflow.WorkflowRunRecord
    kind: struct
    fields:
      - name: run
        type: loom.run.CommissionRunId
      - name: workflow
        type: String
      - name: definition_digest
        type: String
      - name: performed
        type: List<loom.workflow.StepRequest>
      - name: proposed
        type: Optional<loom.workflow.StepRequest>
      - name: outputs
        type: List<loom.workflow.RecordedOutput>
      - name: unproduced
        type: Optional<loom.workflow.UnproducedOutput>
      - name: attempted
        type: List<String>
      - name: usage
        type: loom.metering.CarriedUsage
