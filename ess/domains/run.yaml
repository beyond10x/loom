# Draft domain for Loom (story I-006). Nouns are read from docs/design/loom-design.md,
# docs/contracts/loom-action-selection.md, crates/loom/src/lib.rs and Atlas ADRs 0071-0073. Every
# relation the sources do not settle stays out of the model until a story decides it. One lifecycle
# state per entity until a command outcome moves it.
domain: loom.run

summary: >-
  The executor's record of a commission's run. Each catalogue is projected from one frontier; a
  selection names one action from that catalogue; arguments are generated for the selected action
  only. Loom never decides authority or completion.

naming:
  wire: run
  display: Run

types:
  # The executor call a catalogue was projected for: one frontier, one turn.
  - name: loom.run.TurnId
    kind: newtype
    of: Uuid

  - name: loom.run.CatalogueId
    kind: newtype
    of: Uuid

  - name: loom.run.SelectionId
    kind: newtype
    of: Uuid

  - name: loom.run.ArgumentRequestId
    kind: newtype
    of: Uuid

  - name: loom.run.SelectionRecordId
    kind: newtype
    of: Uuid

  # The id of a commission run, as a run's usage report (loom.metering) and a workflow run record
  # (loom.workflow) name it: Commission's commission.responsibility.RunId. A typed id, not a
  # relation: ESS cannot name another system's entity.
  - name: loom.run.CommissionRunId
    kind: newtype
    of: Uuid

  # docs/design/loom-design.md § Action selection strategies.
  - name: loom.run.SelectionStrategy
    kind: enum
    variants: [ReasoningModel, FastTyped, Rule, Hybrid]

  # The two projected outcomes of Commission's admission (Admissible, NeedsAuthority): an action
  # Commission refuses is not projected. A Loom type, as CommissionRunId mirrors RunId.
  - name: loom.run.CatalogueEntryStatus
    kind: enum
    variants: [Admissible, ApprovalRequired]

  # One projected action: its action id and the status its admission gives it.
  - name: loom.run.CatalogueEntry
    kind: struct
    fields:
      - name: action
        type: String
      - name: status
        type: loom.run.CatalogueEntryStatus

  # Why a workflow judgement step's chooser stopped on its budget (crates/loom-executor/src/workflow.rs,
  # `WorkflowExecutor::with_max_input_tokens`): the payload of the `LoopBudget` suspension, which
  # Commission carries as Json. On the wire the tag is `kind` and each cause's fields sit beside it.
  - name: loom.run.LoopStop
    kind: union
    tag: kind
    variants:
      max-input-tokens: loom.run.LoopStopMaxInputTokens
      budget-unobservable: loom.run.LoopStopBudgetUnobservable

  # The input tokens the endpoint reported reached the declared ceiling.
  - name: loom.run.LoopStopMaxInputTokens
    kind: struct
    fields:
      - name: limit
        type: Integer
      - name: reported
        type: Integer

  # A declared ceiling could no longer be observed after a provider omitted or contradicted the
  # accounting needed to enforce it.
  - name: loom.run.LoopStopBudgetUnobservable
    kind: struct
    fields:
      - name: name
        type: String
      - name: reason
        type: String

entities:
  # The model-visible catalogue derived from one frontier (ADR 0072), projected for one turn: one
  # executor call.
  - name: loom.run.ActionCatalogue
    identity:
      name: catalogue_id
      type: loom.run.CatalogueId
    fields:
      - name: turn_id
        type: loom.run.TurnId
      - name: frontier
        type: String
      - name: case_revision
        type: Integer
      - name: entries
        type: List<loom.run.CatalogueEntry>
    lifecycle:
      initial: Projected
      states: [Projected]
      terminal: [Projected]

  # loom-action-selection.md: one action id and an optional confidence. A selection never grants
  # authority (ADR 0073). The confidence is a Decimal: Binary64 is refused by the conformance suite.
  - name: loom.run.Selection
    identity:
      name: selection_id
      type: loom.run.SelectionId
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: strategy
        type: loom.run.SelectionStrategy
      # The case revision of the catalogue the selection was made from, held equal to that
      # catalogue's by SelectAction: revalidation compares it with the current one.
      - name: case_revision
        type: Integer
      # The stronger selector's selection that replaced this one when a confidence fallback
      # overruled it (decision-blocker:fallback-selection-record, option B); absent otherwise.
      - name: replaced_by
        type: Optional<loom.run.SelectionId>
    relations:
      - name: catalogue
        kind: references
        target: loom.run.ActionCatalogue
        cardinality: one
        via: catalogue_id
      # Zero or one: ESS has only `one` and `many`, and the Optional field makes it zero or one.
      - name: replacement
        kind: references
        target: loom.run.Selection
        cardinality: one
        via: replaced_by
      # Its telemetry for Metaharness, one record per selection
      # (decision-blocker:selection-telemetry-record).
      - name: telemetry
        kind: owns
        target: loom.run.SelectionRecord
        cardinality: one
        via: selection_id
    # Revalidated once against the frontier current at revalidation: admitted, or refused. A
    # selection a stronger selector overruled is never revalidated and never given arguments.
    lifecycle:
      initial: Selected
      states: [Selected, Admitted, Refused, Overruled]
      terminal: [Admitted, Refused, Overruled]
      transitions:
        - {name: admit, from: [Selected], to: Admitted}
        - {name: refuse, from: [Selected], to: Refused}
        - {name: overrule, from: [Selected], to: Overruled}

  # The telemetry of one selection, for Metaharness (decision-blocker:selection-telemetry-record;
  # loom-action-selection.md safety rule 7): the strategy of the selector that made it, how many
  # candidates it was offered, the action it chose and its confidence; on a fast selection a
  # confidence fallback overruled, the strategy of the selector that replaced it; how long the
  # selection took, and the tokens the selector reported spending on it. Never evidence (Atlas ADR
  # 0074).
  - name: loom.run.SelectionRecord
    identity:
      name: selection_record_id
      type: loom.run.SelectionRecordId
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: candidate_count
        type: Integer
      - name: chosen_action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: fell_back_to
        type: Optional<loom.run.SelectionStrategy>
      - name: latency_ms
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  # loom-action-selection.md: arguments are generated for the selected action only.
  - name: loom.run.ArgumentRequest
    identity:
      name: argument_request_id
      type: loom.run.ArgumentRequestId
    fields:
      - name: selection_id
        type: loom.run.SelectionId
    relations:
      - name: selection
        kind: references
        target: loom.run.Selection
        cardinality: one
        via: selection_id
    lifecycle:
      initial: Requested
      states: [Requested]
      terminal: [Requested]

errors:
  # The catalogue a selection names was never projected.
  - name: loom.run.CatalogueNotFound
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId

  # The case revision a selection claims is not the revision of the catalogue it names.
  - name: loom.run.CatalogueRevisionMismatch
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: case_revision
        type: Integer
      - name: catalogue_revision
        type: Integer

  # The selection an argument request names was never made.
  - name: loom.run.SelectionNotFound
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  # The selected action id is not among the catalogue's entries (ADR 0073). Names the id.
  - name: loom.run.ActionNotInCatalogue
    fields:
      - name: action
        type: String

  # A selection is revalidated once.
  - name: loom.run.SelectionStateConflict
    fields:
      - name: state
        type: loom.run.Selection.State

  # A catalogue is projected once: its id is never projected again.
  - name: loom.run.CatalogueExists
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId

  # Arguments are requested only for a selection still Selected.
  - name: loom.run.SelectionNotSelected
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  # A selection's telemetry is recorded once: its id is never recorded again.
  - name: loom.run.SelectionRecordExists
    fields:
      - name: selection_record_id
        type: loom.run.SelectionRecordId

commands:
  # One catalogue projected from one frontier for one turn: one entry per action, by Commission's
  # admission: Admissible when admitted, ApprovalRequired when it needs authority, none when refused.
  - name: loom.run.ProjectCatalogue
    input:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: turn_id
        type: loom.run.TurnId
      - name: frontier
        type: String
      - name: case_revision
        type: Integer
      - name: entries
        type: List<loom.run.CatalogueEntry>
    outcomes:
      - name: catalogue-exists
        existing_instance: true
        error: loom.run.CatalogueExists
        payload:
          loom.run.CatalogueExists:
            catalogue_id: input.catalogue_id
      - name: projected
        creates: loom.run.ActionCatalogue
        instance: catalogue_id
        sets:
          turn_id: input.turn_id
          frontier: input.frontier
          case_revision: input.case_revision
          entries: input.entries
        emits: [loom.run.CatalogueProjected]
        payload:
          loom.run.CatalogueProjected:
            catalogue_id: input.catalogue_id
            turn_id: input.turn_id
            case_revision: input.case_revision

  # A selector picks only from the catalogue it was handed; an action id the catalogue does not
  # list is refused whatever the confidence (ADR 0073).
  - name: loom.run.SelectAction
    input:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: strategy
        type: loom.run.SelectionStrategy
      # The case revision of the catalogue named by catalogue_id.
      - name: case_revision
        type: Integer
    outcomes:
      - name: catalogue-unknown
        when_related: {via: input.catalogue_id, exists: false}
        error: loom.run.CatalogueNotFound
        payload:
          loom.run.CatalogueNotFound:
            catalogue_id: input.catalogue_id
      - name: not-in-catalogue
        when_related:
          via: input.catalogue_id
          predicate:
            not:
              exists:
                in: entries
                as: entry
                that: entry.action == input.action
        error: loom.run.ActionNotInCatalogue
        payload:
          loom.run.ActionNotInCatalogue:
            action: input.action
      - name: revision-mismatch
        when_related:
          via: input.catalogue_id
          predicate: case_revision != input.case_revision
        error: loom.run.CatalogueRevisionMismatch
        payload:
          loom.run.CatalogueRevisionMismatch:
            catalogue_id: input.catalogue_id
            case_revision: input.case_revision
            catalogue_revision: {related: {via: input.catalogue_id, field: case_revision}}
      - name: selected
        creates: loom.run.Selection
        instance: selection_id
        sets:
          catalogue_id: input.catalogue_id
          action: input.action
          confidence: input.confidence
          strategy: input.strategy
          case_revision: input.case_revision
        emits: [loom.run.ActionSelected]
        payload:
          loom.run.ActionSelected:
            selection_id: input.selection_id
            catalogue_id: input.catalogue_id
            action: input.action

  # Arguments are generated for the selected action only.
  - name: loom.run.RequestArguments
    input:
      - name: argument_request_id
        type: loom.run.ArgumentRequestId
      - name: selection_id
        type: loom.run.SelectionId
    outcomes:
      - name: selection-unknown
        when_related: {via: input.selection_id, exists: false}
        error: loom.run.SelectionNotFound
        payload:
          loom.run.SelectionNotFound:
            selection_id: input.selection_id
      - name: selection-not-selected
        when_related:
          via: input.selection_id
          predicate: state != Selected
        error: loom.run.SelectionNotSelected
        payload:
          loom.run.SelectionNotSelected:
            selection_id: input.selection_id
      - name: requested
        creates: loom.run.ArgumentRequest
        instance: argument_request_id
        sets:
          selection_id: input.selection_id
        emits: [loom.run.ArgumentsRequested]
        payload:
          loom.run.ArgumentsRequested:
            argument_request_id: input.argument_request_id
            selection_id: input.selection_id

  # A confidence fallback overruled a fast selection: it names the stronger selector's selection
  # that replaced it, and is never revalidated nor given arguments. Only a Selected selection is
  # overruled. ESS refuses a when_related guard on the replacement beside wrong_state
  # (ESS-COMMAND-004), so the behaviour on the record refuses an unknown replacement with
  # SelectionNotFound naming it.
  - name: loom.run.OverruleSelection
    input:
      - name: selection_id
        type: loom.run.SelectionId
      - name: replacement_id
        type: loom.run.SelectionId
    outcomes:
      - name: overruled
        moves: loom.run.Selection.overrule
        instance: selection_id
        sets:
          replaced_by: input.replacement_id
        emits: [loom.run.SelectionOverruled]
        payload:
          loom.run.SelectionOverruled:
            selection_id: input.selection_id
            replacement_id: input.replacement_id
      - name: wrong-state
        wrong_state: true
        error: loom.run.SelectionStateConflict

  # The telemetry of a selection that was made, recorded once.
  - name: loom.run.RecordSelection
    input:
      - name: selection_record_id
        type: loom.run.SelectionRecordId
      - name: selection_id
        type: loom.run.SelectionId
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: candidate_count
        type: Integer
      - name: chosen_action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: fell_back_to
        type: Optional<loom.run.SelectionStrategy>
      - name: latency_ms
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
    outcomes:
      - name: record-exists
        existing_instance: true
        error: loom.run.SelectionRecordExists
        payload:
          loom.run.SelectionRecordExists:
            selection_record_id: input.selection_record_id
      - name: selection-unknown
        when_related: {via: input.selection_id, exists: false}
        error: loom.run.SelectionNotFound
        payload:
          loom.run.SelectionNotFound:
            selection_id: input.selection_id
      - name: recorded
        creates: loom.run.SelectionRecord
        instance: selection_record_id
        sets:
          selection_id: input.selection_id
          strategy: input.strategy
          candidate_count: input.candidate_count
          chosen_action: input.chosen_action
          confidence: input.confidence
          fell_back_to: input.fell_back_to
          latency_ms: input.latency_ms
          input_tokens: input.input_tokens
          output_tokens: input.output_tokens
        emits: [loom.run.SelectionRecorded]
        payload:
          loom.run.SelectionRecorded:
            selection_record_id: input.selection_record_id
            selection_id: input.selection_id
            strategy: input.strategy
            fell_back_to: input.fell_back_to

  # Before a selection is proposed it is revalidated against the case revision and the action ids
  # of the frontier current at revalidation, which come from the governor, never from the model.
  # not-in-frontier stays `external:`, answered by the executor from the input's frontier_actions:
  # ess 0.66.0 has no predicate for membership in them: it refuses one as unparsable (ESS-SPEC-012).
  - name: loom.run.RevalidateSelection
    input:
      - name: selection_id
        type: loom.run.SelectionId
      - name: case_revision
        type: Integer
      - name: frontier_actions
        type: List<String>
    outcomes:
      - name: stale-revision
        when_subject:
          predicate: case_revision != input.case_revision
        moves: loom.run.Selection.refuse
        instance: selection_id
        emits: [loom.run.SelectionStale]
        payload:
          loom.run.SelectionStale:
            selection_id: input.selection_id
            catalogue_revision: {subject: case_revision}
            case_revision: input.case_revision
      - name: not-in-frontier
        external: the frontier action ids in the input do not list the selection's action
        moves: loom.run.Selection.refuse
        instance: selection_id
        emits: [loom.run.SelectionNotInFrontier]
        payload:
          loom.run.SelectionNotInFrontier:
            selection_id: input.selection_id
            action: {subject: action}
      - name: admitted
        moves: loom.run.Selection.admit
        instance: selection_id
        emits: [loom.run.SelectionAdmitted]
        payload:
          loom.run.SelectionAdmitted:
            selection_id: input.selection_id
      - name: wrong-state
        wrong_state: true
        error: loom.run.SelectionStateConflict

events:
  - name: loom.run.CatalogueProjected
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: turn_id
        type: loom.run.TurnId
      - name: case_revision
        type: Integer

  - name: loom.run.ActionSelected
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String

  - name: loom.run.ArgumentsRequested
    fields:
      - name: argument_request_id
        type: loom.run.ArgumentRequestId
      - name: selection_id
        type: loom.run.SelectionId

  - name: loom.run.SelectionAdmitted
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  - name: loom.run.SelectionRecorded
    fields:
      - name: selection_record_id
        type: loom.run.SelectionRecordId
      - name: selection_id
        type: loom.run.SelectionId
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: fell_back_to
        type: Optional<loom.run.SelectionStrategy>

  # Overruled by a confidence fallback: names the selection that replaced it.
  - name: loom.run.SelectionOverruled
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: replacement_id
        type: loom.run.SelectionId

  # Refused: the action id is not among the current frontier's actions. Names the id.
  - name: loom.run.SelectionNotInFrontier
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: action
        type: String

  # Refused: the selection's catalogue was projected at another case revision than the current one.
  # Names both.
  - name: loom.run.SelectionStale
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_revision
        type: Integer
      - name: case_revision
        type: Integer

views:
  # Every selection with its state: what revalidation reads and what it changed.
  - name: loom.run.Selections
    source: loom.run.Selection
    consistency: read_your_writes
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: case_revision
        type: Integer
      - name: replaced_by
        type: Optional<loom.run.SelectionId>
      - name: state
        type: loom.run.Selection.State

  # Every selection's telemetry: what Metaharness reads (decision-blocker:selection-telemetry-record).
  # The confidence is not published: the conformance suite cannot replay a Decimal.
  - name: loom.run.SelectionRecords
    source: loom.run.SelectionRecord
    consistency: read_your_writes
    fields:
      - name: selection_record_id
        type: loom.run.SelectionRecordId
      - name: selection_id
        type: loom.run.SelectionId
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: candidate_count
        type: Integer
      - name: chosen_action
        type: String
      - name: fell_back_to
        type: Optional<loom.run.SelectionStrategy>
      - name: latency_ms
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: state
        type: loom.run.SelectionRecord.State

  # Every catalogue with its state: what a second projection of one id is checked against.
  - name: loom.run.Catalogues
    source: loom.run.ActionCatalogue
    consistency: read_your_writes
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: case_revision
        type: Integer
      - name: state
        type: loom.run.ActionCatalogue.State
