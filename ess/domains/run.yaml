# Draft domain for Loom (story I-006). Nouns are read from docs/design/loom-design.md,
# docs/contracts/loom-action-selection.md, crates/loom/src/lib.rs and Atlas ADRs 0071-0073. Every
# relation the sources do not settle stays out of the model until a story decides it. One lifecycle
# state per entity until a command outcome moves it.
domain: loom.run

summary: >-
  One model session executing a commission's run. Each catalogue is projected from one frontier;
  a selection names one action from that catalogue; arguments are generated for the selected action
  only. Loom never decides authority or completion.

naming:
  wire: run
  display: Run

types:
  - name: loom.run.SessionId
    kind: newtype
    of: Uuid

  - name: loom.run.TurnId
    kind: newtype
    of: Uuid

  - name: loom.run.CatalogueId
    kind: newtype
    of: Uuid

  - name: loom.run.SelectionId
    kind: newtype
    of: Uuid

  - name: loom.run.ArgumentRequestId
    kind: newtype
    of: Uuid

  # The id of the commission run a session executes: Commission's commission.responsibility.RunId.
  # A typed id, not a relation: ESS cannot name another system's entity.
  - name: loom.run.CommissionRunId
    kind: newtype
    of: Uuid

  # docs/design/loom-design.md § Action selection strategies.
  - name: loom.run.SelectionStrategy
    kind: enum
    variants: [ReasoningModel, FastTyped, Rule, Hybrid]

  # The two projected outcomes of Commission's admission (Admissible, NeedsAuthority): an action
  # Commission refuses is not projected. A Loom type, as CommissionRunId mirrors RunId.
  - name: loom.run.CatalogueEntryStatus
    kind: enum
    variants: [Admissible, ApprovalRequired]

  # One projected action: its action id and the status its admission gives it.
  - name: loom.run.CatalogueEntry
    kind: struct
    fields:
      - name: action
        type: String
      - name: status
        type: loom.run.CatalogueEntryStatus

  # How the run a session is filed after ended: it answered; it stopped short of an answer without
  # an error (a budget bound, a cancel, a provider cut the turn short, an approval is awaited); or
  # it failed (the endpoint dropped the connection, the stream broke, the loop panicked). A session
  # is filed in every case.
  - name: loom.run.RunEnding
    kind: enum
    variants: [Answered, Stopped, Failed]

entities:
  # Session and transcript state for one run (loom-design.md § Owns). Filed outside the workspace
  # whether the run answered or failed; a resume continues the same session by id (Harness
  # transcript.rs Session::save and Session::load at 798325f0).
  - name: loom.run.Session
    identity:
      name: session_id
      type: loom.run.SessionId
    fields:
      - name: commission_run
        type: loom.run.CommissionRunId
      # The wire the session's items were produced on. An opaque provider item may not cross
      # wires, so a resume on another wire is refused naming both.
      - name: wire
        type: String
    relations:
      # A turn is part of one session's transcript (loom-design.md: "model turn loop",
      # "session/transcript state").
      - name: turns
        kind: owns
        target: loom.run.Turn
        cardinality: many
        via: session_id
    # Active while a run takes turns in it; Filed once the run ended and the session was written;
    # Active again when a later run resumes it. A session left Active by a run that died without
    # filing it is released back to Filed by an operator.
    lifecycle:
      initial: Active
      states: [Active, Filed]
      terminal: []
      transitions:
        - {name: file, from: [Active], to: Filed}
        - {name: resume, from: [Filed], to: Active}
        - {name: release, from: [Active], to: Filed}

  # One completed model turn. A turn that did not complete is never recorded, so a filed session
  # holds exactly the turns completed before the run ended.
  - name: loom.run.Turn
    identity:
      name: turn_id
      type: loom.run.TurnId
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: index
        type: Integer
      # The provider items the turn added to the conversation, verbatim, opaque ones included.
      # Streamed reasoning text is not an item and is never stored.
      - name: items
        type: List<String>
    relations:
      # A catalogue is projected once per turn and does not outlive it (operator decision
      # 2026-10-04, decision-blocker:catalogue-ownership).
      - name: catalogue
        kind: owns
        target: loom.run.ActionCatalogue
        cardinality: one
        via: turn_id
    lifecycle:
      initial: Taken
      states: [Taken]
      terminal: [Taken]

  # The model-visible catalogue derived from one frontier (ADR 0072), projected for one turn.
  - name: loom.run.ActionCatalogue
    identity:
      name: catalogue_id
      type: loom.run.CatalogueId
    fields:
      - name: turn_id
        type: loom.run.TurnId
      - name: frontier
        type: String
      - name: case_revision
        type: Integer
      - name: entries
        type: List<loom.run.CatalogueEntry>
    lifecycle:
      initial: Projected
      states: [Projected]
      terminal: [Projected]

  # loom-action-selection.md: one action id and an optional confidence. A selection never grants
  # authority (ADR 0073). The confidence is a Decimal: Binary64 is refused by the conformance suite.
  - name: loom.run.Selection
    identity:
      name: selection_id
      type: loom.run.SelectionId
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: strategy
        type: loom.run.SelectionStrategy
      # The case revision of the catalogue the selection was made from, held equal to that
      # catalogue's by SelectAction: revalidation compares it with the current one.
      - name: case_revision
        type: Integer
    relations:
      - name: catalogue
        kind: references
        target: loom.run.ActionCatalogue
        cardinality: one
        via: catalogue_id
    # Revalidated once against the frontier current at revalidation: admitted, or refused.
    lifecycle:
      initial: Selected
      states: [Selected, Admitted, Refused]
      terminal: [Admitted, Refused]
      transitions:
        - {name: admit, from: [Selected], to: Admitted}
        - {name: refuse, from: [Selected], to: Refused}

  # loom-action-selection.md: arguments are generated for the selected action only.
  - name: loom.run.ArgumentRequest
    identity:
      name: argument_request_id
      type: loom.run.ArgumentRequestId
    fields:
      - name: selection_id
        type: loom.run.SelectionId
    relations:
      - name: selection
        kind: references
        target: loom.run.Selection
        cardinality: one
        via: selection_id
    lifecycle:
      initial: Requested
      states: [Requested]
      terminal: [Requested]

errors:
  # The catalogue a selection names was never projected.
  - name: loom.run.CatalogueNotFound
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId

  # The case revision a selection claims is not the revision of the catalogue it names.
  - name: loom.run.CatalogueRevisionMismatch
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: case_revision
        type: Integer
      - name: catalogue_revision
        type: Integer

  # The selection an argument request names was never made.
  - name: loom.run.SelectionNotFound
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  # The selected action id is not among the catalogue's entries (ADR 0073). Names the id.
  - name: loom.run.ActionNotInCatalogue
    fields:
      - name: action
        type: String

  # A selection is revalidated once.
  - name: loom.run.SelectionStateConflict
    fields:
      - name: state
        type: loom.run.Selection.State

  # A catalogue is projected once: its id is never projected again.
  - name: loom.run.CatalogueExists
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId

  # Arguments are requested only for a selection still Selected.
  - name: loom.run.SelectionNotSelected
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  # A session is opened once: its id is never opened again.
  - name: loom.run.SessionExists
    fields:
      - name: session_id
        type: loom.run.SessionId

  # The session a turn names was never opened.
  - name: loom.run.SessionNotFound
    fields:
      - name: session_id
        type: loom.run.SessionId

  # Turns are recorded only into a session a run is taking turns in.
  - name: loom.run.SessionNotActive
    fields:
      - name: session_id
        type: loom.run.SessionId

  # A session is filed only while Active and resumed only while Filed.
  - name: loom.run.SessionStateConflict
    fields:
      - name: state
        type: loom.run.Session.State

  # A session recorded on one wire is resumed on another: its opaque items may not cross wires.
  # Names both wires.
  - name: loom.run.SessionWireMismatch
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: session_wire
        type: String
      - name: wire
        type: String

commands:
  # A run opens a new session on the wire it speaks.
  - name: loom.run.OpenSession
    input:
      - name: session_id
        type: loom.run.SessionId
      - name: commission_run
        type: loom.run.CommissionRunId
      - name: wire
        type: String
    outcomes:
      - name: session-exists
        existing_instance: true
        error: loom.run.SessionExists
        payload:
          loom.run.SessionExists:
            session_id: input.session_id
      - name: opened
        creates: loom.run.Session
        instance: session_id
        sets:
          commission_run: input.commission_run
          wire: input.wire
        emits: [loom.run.SessionOpened]
        payload:
          loom.run.SessionOpened:
            session_id: input.session_id
            commission_run: input.commission_run
            wire: input.wire

  # A completed turn is recorded into its session with the items it added, verbatim. A turn the
  # endpoint broke off is never recorded.
  - name: loom.run.RecordTurn
    input:
      - name: turn_id
        type: loom.run.TurnId
      - name: session_id
        type: loom.run.SessionId
      - name: index
        type: Integer
      - name: items
        type: List<String>
    outcomes:
      - name: session-unknown
        when_related: {via: input.session_id, exists: false}
        error: loom.run.SessionNotFound
        payload:
          loom.run.SessionNotFound:
            session_id: input.session_id
      - name: session-not-active
        when_related:
          via: input.session_id
          predicate: state != Active
        error: loom.run.SessionNotActive
        payload:
          loom.run.SessionNotActive:
            session_id: input.session_id
      - name: recorded
        creates: loom.run.Turn
        instance: turn_id
        sets:
          session_id: input.session_id
          index: input.index
          items: input.items
        emits: [loom.run.TurnRecorded]
        payload:
          loom.run.TurnRecorded:
            turn_id: input.turn_id
            session_id: input.session_id
            index: input.index

  # The run ended, answered, stopped or failed, and its session is written: outside the
  # workspace, the directory 0700 and the file 0600, holding no credential and no instruction text,
  # and holding its conversation up to the last completed turn.
  - name: loom.run.FileSession
    input:
      - name: session_id
        type: loom.run.SessionId
      - name: ending
        type: loom.run.RunEnding
    outcomes:
      - name: filed
        moves: loom.run.Session.file
        instance: session_id
        emits: [loom.run.SessionFiled]
        payload:
          loom.run.SessionFiled:
            session_id: input.session_id
            ending: input.ending
      - name: wrong-state
        wrong_state: true
        error: loom.run.SessionStateConflict

  # A later run continues a filed session by id, replaying its stored items in stored order. A
  # session recorded on another wire is refused before anything is sent, naming both wires. Once
  # claimed, a session is filed again in every case: a run refused on another wire files it back
  # unchanged.
  - name: loom.run.ResumeSession
    input:
      - name: session_id
        type: loom.run.SessionId
      - name: wire
        type: String
    outcomes:
      - name: cross-wire
        when_subject:
          predicate: wire != input.wire
        error: loom.run.SessionWireMismatch
        payload:
          loom.run.SessionWireMismatch:
            session_id: input.session_id
            session_wire: {subject: wire}
            wire: input.wire
      - name: resumed
        moves: loom.run.Session.resume
        instance: session_id
        emits: [loom.run.SessionResumed]
        payload:
          loom.run.SessionResumed:
            session_id: input.session_id
            wire: input.wire
      - name: wrong-state
        wrong_state: true
        error: loom.run.SessionStateConflict

  # A session left Active by a run that died without filing it (killed, out of memory) is filed
  # back as Failed by an operator, so a later run can resume it. Only an Active session is released.
  - name: loom.run.ReleaseSession
    input:
      - name: session_id
        type: loom.run.SessionId
    outcomes:
      - name: released
        moves: loom.run.Session.release
        instance: session_id
        emits: [loom.run.SessionReleased]
        payload:
          loom.run.SessionReleased:
            session_id: input.session_id
            ending: Failed
      - name: wrong-state
        wrong_state: true
        error: loom.run.SessionStateConflict

  # One catalogue projected from one frontier for one turn: one entry per action, by Commission's
  # admission: Admissible when admitted, ApprovalRequired when it needs authority, none when refused.
  - name: loom.run.ProjectCatalogue
    input:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: turn_id
        type: loom.run.TurnId
      - name: frontier
        type: String
      - name: case_revision
        type: Integer
      - name: entries
        type: List<loom.run.CatalogueEntry>
    outcomes:
      - name: catalogue-exists
        existing_instance: true
        error: loom.run.CatalogueExists
        payload:
          loom.run.CatalogueExists:
            catalogue_id: input.catalogue_id
      - name: projected
        creates: loom.run.ActionCatalogue
        instance: catalogue_id
        sets:
          turn_id: input.turn_id
          frontier: input.frontier
          case_revision: input.case_revision
          entries: input.entries
        emits: [loom.run.CatalogueProjected]
        payload:
          loom.run.CatalogueProjected:
            catalogue_id: input.catalogue_id
            turn_id: input.turn_id
            case_revision: input.case_revision

  # A selector picks only from the catalogue it was handed; an action id the catalogue does not
  # list is refused whatever the confidence (ADR 0073).
  - name: loom.run.SelectAction
    input:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: confidence
        type: Optional<Decimal>
      - name: strategy
        type: loom.run.SelectionStrategy
      # The case revision of the catalogue named by catalogue_id.
      - name: case_revision
        type: Integer
    outcomes:
      - name: catalogue-unknown
        when_related: {via: input.catalogue_id, exists: false}
        error: loom.run.CatalogueNotFound
        payload:
          loom.run.CatalogueNotFound:
            catalogue_id: input.catalogue_id
      - name: not-in-catalogue
        when_related:
          via: input.catalogue_id
          predicate:
            not:
              exists:
                in: entries
                as: entry
                that: entry.action == input.action
        error: loom.run.ActionNotInCatalogue
        payload:
          loom.run.ActionNotInCatalogue:
            action: input.action
      - name: revision-mismatch
        when_related:
          via: input.catalogue_id
          predicate: case_revision != input.case_revision
        error: loom.run.CatalogueRevisionMismatch
        payload:
          loom.run.CatalogueRevisionMismatch:
            catalogue_id: input.catalogue_id
            case_revision: input.case_revision
            catalogue_revision: {related: {via: input.catalogue_id, field: case_revision}}
      - name: selected
        creates: loom.run.Selection
        instance: selection_id
        sets:
          catalogue_id: input.catalogue_id
          action: input.action
          confidence: input.confidence
          strategy: input.strategy
          case_revision: input.case_revision
        emits: [loom.run.ActionSelected]
        payload:
          loom.run.ActionSelected:
            selection_id: input.selection_id
            catalogue_id: input.catalogue_id
            action: input.action

  # Arguments are generated for the selected action only.
  - name: loom.run.RequestArguments
    input:
      - name: argument_request_id
        type: loom.run.ArgumentRequestId
      - name: selection_id
        type: loom.run.SelectionId
    outcomes:
      - name: selection-unknown
        when_related: {via: input.selection_id, exists: false}
        error: loom.run.SelectionNotFound
        payload:
          loom.run.SelectionNotFound:
            selection_id: input.selection_id
      - name: selection-not-selected
        when_related:
          via: input.selection_id
          predicate: state != Selected
        error: loom.run.SelectionNotSelected
        payload:
          loom.run.SelectionNotSelected:
            selection_id: input.selection_id
      - name: requested
        creates: loom.run.ArgumentRequest
        instance: argument_request_id
        sets:
          selection_id: input.selection_id
        emits: [loom.run.ArgumentsRequested]
        payload:
          loom.run.ArgumentsRequested:
            argument_request_id: input.argument_request_id
            selection_id: input.selection_id

  # Before a selection is proposed it is revalidated against the case revision and the action ids
  # of the frontier current at revalidation, which come from the governor, never from the model.
  # not-in-frontier is `external:`: ess 0.52.0 does not witness a stored action in an input list
  # (ESS-SYNTH-003).
  - name: loom.run.RevalidateSelection
    input:
      - name: selection_id
        type: loom.run.SelectionId
      - name: case_revision
        type: Integer
      - name: frontier_actions
        type: List<String>
    outcomes:
      - name: stale-revision
        when_subject:
          predicate: case_revision != input.case_revision
        moves: loom.run.Selection.refuse
        instance: selection_id
        emits: [loom.run.SelectionStale]
        payload:
          loom.run.SelectionStale:
            selection_id: input.selection_id
            catalogue_revision: {subject: case_revision}
            case_revision: input.case_revision
      - name: not-in-frontier
        external: the frontier action ids in the input do not list the selection's action
        moves: loom.run.Selection.refuse
        instance: selection_id
        emits: [loom.run.SelectionNotInFrontier]
        payload:
          loom.run.SelectionNotInFrontier:
            selection_id: input.selection_id
            action: {subject: action}
      - name: admitted
        moves: loom.run.Selection.admit
        instance: selection_id
        emits: [loom.run.SelectionAdmitted]
        payload:
          loom.run.SelectionAdmitted:
            selection_id: input.selection_id
      - name: wrong-state
        wrong_state: true
        error: loom.run.SelectionStateConflict

events:
  - name: loom.run.SessionOpened
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: commission_run
        type: loom.run.CommissionRunId
      - name: wire
        type: String

  - name: loom.run.TurnRecorded
    fields:
      - name: turn_id
        type: loom.run.TurnId
      - name: session_id
        type: loom.run.SessionId
      - name: index
        type: Integer

  - name: loom.run.SessionFiled
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: ending
        type: loom.run.RunEnding

  - name: loom.run.SessionResumed
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: wire
        type: String

  # Released by an operator after its run died: filed as Failed.
  - name: loom.run.SessionReleased
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: ending
        type: loom.run.RunEnding

  - name: loom.run.CatalogueProjected
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: turn_id
        type: loom.run.TurnId
      - name: case_revision
        type: Integer

  - name: loom.run.ActionSelected
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String

  - name: loom.run.ArgumentsRequested
    fields:
      - name: argument_request_id
        type: loom.run.ArgumentRequestId
      - name: selection_id
        type: loom.run.SelectionId

  - name: loom.run.SelectionAdmitted
    fields:
      - name: selection_id
        type: loom.run.SelectionId

  # Refused: the action id is not among the current frontier's actions. Names the id.
  - name: loom.run.SelectionNotInFrontier
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: action
        type: String

  # Refused: the selection's catalogue was projected at another case revision than the current one.
  # Names both.
  - name: loom.run.SelectionStale
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_revision
        type: Integer
      - name: case_revision
        type: Integer

views:
  # Every session with its wire and state: what a resume is checked against.
  - name: loom.run.Sessions
    source: loom.run.Session
    consistency: read_your_writes
    fields:
      - name: session_id
        type: loom.run.SessionId
      - name: commission_run
        type: loom.run.CommissionRunId
      - name: wire
        type: String
      - name: state
        type: loom.run.Session.State

  # Every selection with its state: what revalidation reads and what it changed.
  - name: loom.run.Selections
    source: loom.run.Selection
    consistency: read_your_writes
    fields:
      - name: selection_id
        type: loom.run.SelectionId
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: action
        type: String
      - name: strategy
        type: loom.run.SelectionStrategy
      - name: case_revision
        type: Integer
      - name: state
        type: loom.run.Selection.State

  # Every catalogue with its state: what a second projection of one id is checked against.
  - name: loom.run.Catalogues
    source: loom.run.ActionCatalogue
    consistency: read_your_writes
    fields:
      - name: catalogue_id
        type: loom.run.CatalogueId
      - name: case_revision
        type: Integer
      - name: state
        type: loom.run.ActionCatalogue.State
