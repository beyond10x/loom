# What one Commission run spent on its model (story dw-run-model-meter): the model calls, the
# tokens the provider reported and the cost at a declared rate card, in total and per step. Calls
# are counted at the `ModelPort` boundary (crates/loom-executor/src/harness/wire/port.rs), one per
# `turn`, whether the turn answered or failed; a step is one executor call of the run, which the
# runtime makes through `AgentExecutor::run_with_usage` (crates/loom-commission/src/runtime.rs,
# module docs item 6), counted from 1. The report is a
# value a host reads when the run ends: it has no lifecycle, so the domain declares types only.
# A workflow run record (`loom.workflow.WorkflowRunRecord`) carries the usage so far as
# CarriedUsage, so a run resumed in another process reports every segment.
domain: loom.metering

summary: >-
  One run's usage report: how many model calls it made, the input, output and cached input tokens
  the provider reported for them and their cost in millionths of a US dollar at the run's rate
  card, in total and for each executor call of the run. A cost no rate card priced is absent,
  never zero.

naming:
  wire: metering
  display: Metering

types:
  # One executor call of the run: its number, counted from 1, the model calls made while it ran,
  # (step 0, listed only when there was such a call, holds the calls made while no executor call
  # ran, so the steps always sum to the totals),
  # the tokens the provider reported for the calls that answered, and their cost in micro-US-
  # dollars, each turn priced and rounded once (crates/loom-executor/src/harness/turn_loop/price.rs).
  # The cost is absent when a turn was made without a rate card, when the card does not price the
  # model a turn reported, when a turn that answered reported no usage, or when a turn failed (its
  # tokens, and so its cost, are unknown).
  # story:executor-reports-usage: an executor call that reports what it spent through
  # `AgentExecutor::run_with_usage` (`commission.responsibility.ExecutorStep.usage`, an executor
  # that is not a model loop) adds the reported input and output tokens to its step, and the
  # reported cost to the cost of the step's priced calls. A step that made no model call needs no
  # price, so without a rate card its cost is the cost the executor reported, absent when the
  # reported usage carried none, and zero when it reported no usage. It is no model call, and its
  # wall time is charged to the run's budget only. A call through `AgentExecutor::run` hands on no
  # usage, so the meter records none, as the run is charged none. An executor whose calls the
  # meter counts reports none of them, so no usage is counted twice.
  # `label` is the name the executor gave its call: the workflow step it took
  # (story dw-workflow-definition-executor, `loom.workflow.WorkflowStep.name`). It is absent for
  # step 0 and for a call that took no named step.
  - name: loom.metering.StepUsage
    kind: struct
    fields:
      - name: step
        type: Integer
      - name: label
        type: Optional<String>
      - name: model_calls
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: cached_input_tokens
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>

  # One run's report: the commission run it covers, as a typed id (`loom.run.CommissionRunId`,
  # Commission's `commission.responsibility.RunId`; ESS cannot name another system's entity), the
  # totals over every step, and the steps in order. The totals are the sums of the steps; the
  # cost is absent when any step's cost is absent. It covers one process segment of the run and,
  # when its meter was resumed from a run record (story dw-durable-run-state), every earlier
  # segment the record carried: their steps first, numbered as they were, and their effects summed
  # with this segment's.
  # story:run-and-action-budgets: `effects` is what the run's performed effects reported they spent
  # on their own model calls, beside the model-port usage above and never summed into it.
  # story:executor-reports-usage: the usage an executor call reported is in its step, and so in
  # the totals, never in `effects`, though the runtime charges both to the run.
  - name: loom.metering.RunUsageReport
    kind: struct
    fields:
      - name: commission_run
        type: loom.run.CommissionRunId
      - name: model_calls
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: cached_input_tokens
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>
      - name: steps
        type: List<loom.metering.StepUsage>
      - name: effects
        type: loom.metering.EffectsUsage

  # story:run-and-action-budgets: what one action's performed effects reported they spent, as the
  # Commission runtime charged it (`commission.responsibility.ActionCharge`): the requests handed
  # to the effect port for it, the input and output tokens, the wall time in milliseconds and the
  # cost in micro-US-dollars, absent once an effect reported usage without a cost.
  - name: loom.metering.ActionUsage
    kind: struct
    fields:
      - name: action
        type: String
      - name: trials
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: duration_ms
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>

  # story:run-and-action-budgets: the effect usage charged to the run
  # (`commission.responsibility.RunCharges`): the totals over every action, and each action in the
  # order a request for it was first handed to the effect port. All zero, with no actions, when the
  # meter was charged nothing.
  - name: loom.metering.EffectsUsage
    kind: struct
    fields:
      - name: trials
        type: Integer
      - name: input_tokens
        type: Integer
      - name: output_tokens
        type: Integer
      - name: duration_ms
        type: Integer
      - name: cost_micro_usd
        type: Optional<Integer>
      - name: actions
        type: List<loom.metering.ActionUsage>

  # story:dw-durable-run-state: what the earlier process segments of one run spent, as a run record
  # carries it into the meter of the process that resumes the run: every step they counted, step 0
  # included when it holds a call, numbered as the run numbers them, and the effect usage charged
  # to them. A resumed meter numbers its own steps after the last one carried.
  - name: loom.metering.CarriedUsage
    kind: struct
    fields:
      - name: steps
        type: List<loom.metering.StepUsage>
      - name: effects
        type: loom.metering.EffectsUsage
