# The `LoomAgent` Kubernetes custom resource and its lifecycle (story loom-agent-resource-domain;
# the status's `deployment` and `conditions`, story loom-operator). Sources read: the CRD
# deployment design (`docs/design/loom-agent-crd-deployment.md`, D1, D2, D8, § 5.1, § 5.2, § 8)
# and `loom.agent.AgentSpec` (`ess/domains/agent.yaml`), which `spec.agent` holds
# verbatim, so there is no second agent schema (D1). The resource is namespaced and one controller
# instance watches one namespace (design § 11), so its name alone identifies it. The lifecycle is
# the controller's view of the resource: what it records as it reconciles, never what the model
# or the pod says about itself. The CRD's `openAPIV3Schema` is projected from this domain and from
# `loom.agent` by `loom-xtask crd-generate` (`deploy/crd/loomagents.loom.beyond10x.dev.yaml`);
# `spec` is `LoomAgentSpec`, `status` is the entity's fields other than its name. The spec itself
# is held by the cluster, in the resource; the controller re-reads it on every reconcile and the
# record keeps only the generation it applied, because a stored `AgentSpec` holds a `Decimal`
# (`loops.inner.classify_threshold`) that no view can observe exactly (ESS 0.69.0, ESS-SYNTH-001
# "Decimal and Binary64 replay results are unsupported"), which would leave the refusals and the
# preserving outcomes below without a scenario.
domain: loom.resource

summary: >-
  The `LoomAgent` custom resource (group `loom.beyond10x.dev`, version `v1alpha1`): its spec, the
  `loom.agent/1` document and what the pod needs beside it, and its lifecycle as the controller
  reconciles it: applied into Pending, Running or Refused by the spec check, Degraded and back by
  the child Deployment's availability, Completed or Failed when the child Job's run ends, with the
  program's exit code and the time it ended, or, on a schedule, Running with each finished
  run's end recorded in turn, Pending again on a new generation, and gone on delete.

naming:
  wire: resource
  display: Resource

types:
  # The resource's `metadata.name`, unique in the controller's namespace.
  - name: loom.resource.ResourceName
    kind: newtype
    of: String

  # The Secret the pod's environment is read from, by name; the Secret itself is created outside
  # the resource and never read by the controller (design § 7).
  - name: loom.resource.SecretRef
    kind: struct
    fields:
      - name: name
        type: String

  # A Secret whose keys are files in the container, read-only at `mount_path`, owned by the pod's
  # user, the directory mode 0700 and each file 0600: an init container copies them out of the
  # Secret volume, whose files the kubelet owns (story loom-agent-trial-fixes).
  - name: loom.resource.SecretFiles
    kind: struct
    fields:
      - name: name
        type: String
      - name: mount_path
        type: String
        naming: {wire: mountPath}

  # One plain environment variable of the agent container, beside the environment of
  # `secret_ref` (story loom-agent-spec-env): a value that is not a secret, such as a cache
  # directory or an offline switch. The controller refuses a value holding a credential, a name
  # that is not an environment variable name, a name given twice and a name it sets itself.
  - name: loom.resource.EnvVar
    kind: struct
    fields:
      - name: name
        type: String
      - name: value
        type: String

  # One configuration file of a `Command` resource, written verbatim at `/config/<name>` (story
  # command-opaque-config-files): the program's own configuration, which the controller decodes
  # nothing of. The controller refuses a name that is not a plain file name, a name given twice,
  # a name the spec's ConfigMap already holds and a content holding a credential.
  - name: loom.resource.ConfigFile
    kind: struct
    fields:
      - name: name
        type: String
      - name: content
        type: String

  # The agent image, overriding the controller's default (design § 5.1).
  - name: loom.resource.ImageRef
    kind: struct
    fields:
      - name: repository
        type: String
      - name: tag
        type: String

  # The program the pod runs instead of `b10x-loom agent serve` (design § 9a, slice C): the
  # container's entrypoint and its arguments, each left to the image when absent, so an empty
  # command runs the image's own entrypoint.
  - name: loom.resource.CommandSpec
    kind: struct
    fields:
      - name: entrypoint
        type: Optional<List<String>>
      - name: args
        type: Optional<List<String>>

  # A writable volume for a repository checkout, mounted at `mount_path`: an emptyDir, or the
  # PersistentVolumeClaim `claim_name` in the resource's namespace.
  - name: loom.resource.Workspace
    kind: struct
    fields:
      - name: mount_path
        type: String
        naming: {wire: mountPath}
      - name: claim_name
        type: Optional<String>
        naming: {wire: claimName}

  # What the pod runs: `AgentServe`, `b10x-loom agent serve` over the spec; `Command`, the
  # program `spec.command` names, reading its configuration under `/config`: the spec at
  # `/config/agent.yaml` when the resource has one, and each of its configuration files.
  - name: loom.resource.AgentVariant
    kind: enum
    variants: [AgentServe, Command]

  # What the controller read of the child Deployment: available, its pod is ready; unavailable, it
  # is not (design § 5.2, status from the Deployment's conditions).
  - name: loom.resource.DeploymentAvailability
    kind: enum
    variants: [Available, Unavailable]

  # What the controller read of the child Job of a `Command` resource, which runs its program once
  # (story command-variant-runs-once): active, the run has not ended (its pod not yet started,
  # or running); succeeded, it ended with exit code 0 (the Job's condition `Complete`); failed, it
  # ended otherwise (the Job's condition `Failed`, or one failed pod, since the Job retries none).
  - name: loom.resource.RunPhase
    kind: enum
    variants: [Active, Succeeded, Failed]

  # How the child Job's run ended (story command-run-exit-status), read from the Job's own pod,
  # the one whose controller is the Job: `exit_code` and `finished_at` are the program
  # container's `state.terminated` (`exitCode`, `finishedAt`), `reason` its terminated reason
  # (`Completed`, `Error`, `OOMKilled`). A run whose program container's end was never read (its
  # pod deleted before the controller read it, or a pod that ended before its container ran) has
  # neither an exit code nor an end time, and `reason` is then the reason of the Job's own
  # `Failed` or `Complete` condition (`BackoffLimitExceeded`).
  - name: loom.resource.RunEnd
    kind: struct
    fields:
      - name: exit_code
        type: Optional<Integer>
        naming: {wire: exitCode}
      - name: finished_at
        type: Optional<Timestamp>
        naming: {wire: finishedAt}
      - name: reason
        type: Optional<String>

  # What the spec check said of the spec: its exit code (0, the spec is served) and its message
  # (empty on 0). The controller runs the check in-process before any child exists, with the
  # library behind `b10x-loom agent check`, and records its own refusals of the resource (a Secret
  # or an egress host it does not allow, a namespace other than the resource's) the same way.
  - name: loom.resource.CheckResult
    kind: struct
    fields:
      - name: exit_code
        type: Integer
        naming: {wire: exitCode}
      - name: message
        type: String

  # The Kubernetes condition types the controller publishes: `Checked`, whether the spec check
  # passed for the observed generation; `Available`, whether the child Deployment is; and, for a
  # `Command` resource only, `Completed`, whether its run ended with exit code 0 (story
  # command-run-exit-status), or, for a scheduled one, `LastRunSucceeded`, whether its most recent
  # finished run did (story command-schedule).
  - name: loom.resource.ConditionType
    kind: enum
    variants: [Checked, Available, Completed, LastRunSucceeded]

  # A condition's status as Kubernetes spells it, quoted so YAML reads text and not a boolean.
  - name: loom.resource.ConditionStatus
    kind: enum
    variants: ['True', 'False', Unknown]

  # One condition: its type and status, a CamelCase reason and a message for a person.
  - name: loom.resource.Condition
    kind: struct
    fields:
      - name: type
        type: loom.resource.ConditionType
      - name: status
        type: loom.resource.ConditionStatus
      - name: reason
        type: String
      - name: message
        type: String

  # What the controller last read of the child Deployment (design § 5.2: the status comes from the
  # Deployment's conditions).
  - name: loom.resource.DeploymentStatus
    kind: struct
    fields:
      - name: availability
        type: loom.resource.DeploymentAvailability

  # Which seccomp or AppArmor profile confines the program's container (story
  # command-confinement-profiles): `RuntimeDefault`, the container runtime's own profile;
  # `Localhost`, a profile the node holds, named by `localhost_profile` (for seccomp a path
  # relative to the kubelet's seccomp directory, for AppArmor the loaded profile's name), which
  # no other kind carries; `Unconfined`, no profile. Only a `Command` resource declares one, and
  # the controller's configuration decides which it admits: `Unconfined` and every `Localhost`
  # name only when the operator listed them.
  - name: loom.resource.ConfinementProfileKind
    kind: enum
    variants: [RuntimeDefault, Localhost, Unconfined]

  - name: loom.resource.ConfinementProfile
    kind: struct
    fields:
      - name: type
        type: loom.resource.ConfinementProfileKind
      - name: localhost_profile
        type: Optional<String>
        naming: {wire: localhostProfile}

  # One upstream the boundary relays to (story boundary-container-projected-token, design D243
  # § 4): `upstream`, the base URL of a cluster service (`http://<service>.<namespace>.svc`, an
  # optional `.cluster.local` and port, and an optional path the relayed path is appended to);
  # `audience`, the audience of the projected service-account token the boundary adds to each
  # call, which the upstream checks by TokenReview. The controller refuses an upstream its
  # configuration does not list.
  - name: loom.resource.BoundaryUpstream
    kind: struct
    fields:
      - name: upstream
        type: String
      - name: audience
        type: String

  # The Connectors instance the boundary relays to, and the operation ids (`merge_request.create`)
  # it admits on `/v1alpha2/invoke`; every other operation is refused in the pod.
  - name: loom.resource.ConnectorsBoundary
    kind: struct
    fields:
      - name: upstream
        type: String
      - name: audience
        type: String
      - name: operations
        type: List<String>

  # The git smart-HTTP upstream the boundary relays to, and the repositories (`<owner>/<repo>`) it
  # admits; every other repository is refused in the pod.
  - name: loom.resource.GitBoundary
    kind: struct
    fields:
      - name: upstream
        type: String
      - name: audience
        type: String
      - name: repositories
        type: List<String>

  # A credential-free agent (epic credential-free-agent-pod): a second container, `boundary`,
  # holds the pod's only credential, a projected service-account token per declared upstream,
  # and relays the agent's calls on loopback to the model, to the declared Connectors operations
  # and to the declared git repositories. A resource that declares it holds no Secret: the
  # controller refuses it beside `secret_ref` or `secret_files`.
  - name: loom.resource.Boundary
    kind: struct
    fields:
      - name: model
        type: Optional<loom.resource.BoundaryUpstream>
      - name: connectors
        type: Optional<loom.resource.ConnectorsBoundary>
      - name: git
        type: Optional<loom.resource.GitBoundary>

  # A key of a ConfigMap in the resource's namespace (story command-schedule, amendment "a
  # declarative input"). The controller never reads that ConfigMap: the pod mounts the key
  # read-only, and a missing ConfigMap leaves the pod unstarted.
  - name: loom.resource.ConfigMapKeyRef
    kind: struct
    fields:
      - name: name
        type: String
      - name: key
        type: String

  # The task text each scheduled run is given, passed to `b10x-loom agent run` as `--input
  # <file>`: exactly one of `text`, written into the resource's own ConfigMap and read from
  # `/config`, or `config_map_key_ref`, a key of another ConfigMap mounted read-only. The
  # controller refuses both, neither, and an empty text, name or key, and walks `text` for a
  # credential as it walks `spec.env`.
  - name: loom.resource.ScheduleInput
    kind: struct
    fields:
      - name: text
        type: Optional<String>
      - name: config_map_key_ref
        type: Optional<loom.resource.ConfigMapKeyRef>
        naming: {wire: configMapKeyRef}

  # When a `Command` resource runs (story command-schedule, design § 12.2): a `batch/v1` CronJob
  # in the Job's place, on the five-field `cron` expression (or a descriptor such as `@hourly`),
  # in the IANA `time_zone` (the controller's when absent), no new run starting while `suspend`
  # holds, and none starting later than `starting_deadline_seconds` after its time. That deadline
  # lies in 0 to 9223372036: the controller refuses a negative value, and a value above
  # 9223372036, which Kubernetes' CronJob controller holds as nanoseconds in a signed 64-bit
  # duration, where it wraps.
  # `run_deadline_seconds` (story schedule-run-deadline) bounds how long one run may last once it
  # started: a run still going after that many seconds is ended and reported as a failed run
  # (`last-run-failed`, reason `DeadlineExceeded`), so a hung run does not hold the later ones.
  # It lies in 1 to 9223372036: the controller refuses zero and a negative value, and a value
  # above 9223372036, which Kubernetes' Job controller holds as nanoseconds in a signed 64-bit
  # duration and wraps negative, so either would end every run as it starts. ESS declares no
  # bound on an `Integer` field, so the bound is written here and the controller holds it.
  # `input`, when present, makes the program `b10x-loom agent run` over the resource's spec with
  # that task text; without it the CronJob runs `spec.command` as the Job would.
  - name: loom.resource.ScheduleSpec
    kind: struct
    fields:
      - name: cron
        type: String
      - name: time_zone
        type: Optional<String>
        naming: {wire: timeZone}
      - name: suspend
        type: Optional<Boolean>
      - name: starting_deadline_seconds
        type: Optional<Integer>
        naming: {wire: startingDeadlineSeconds}
      - name: run_deadline_seconds
        type: Optional<Integer>
        naming: {wire: runDeadlineSeconds}
      - name: input
        type: Optional<loom.resource.ScheduleInput>

  # How the most recent finished run of a scheduled resource ended (story command-schedule): the
  # newest finished Job the CronJob owns, read as `RunEnd` is (the Job's own pod, the program
  # container's `state.terminated`). Unlike `RunEnd` it carries the phase, because the resource
  # stays Running and the condition `LastRunSucceeded` needs to know whether a run whose
  # container's end was never read succeeded.
  - name: loom.resource.LastRun
    kind: struct
    fields:
      - name: phase
        type: loom.resource.RunPhase
      - name: exit_code
        type: Optional<Integer>
        naming: {wire: exitCode}
      - name: finished_at
        type: Optional<Timestamp>
        naming: {wire: finishedAt}
      - name: reason
        type: Optional<String>

  # The resource's `spec`: the `loom.agent/1` document verbatim, required for `AgentServe` and
  # optional for `Command`; the llm `routes.yaml` inline, a
  # document of llm's own format that Loom passes through, so it is untyped here and holds secrets
  # only as `env:` or `file:` references; the connectors-local TOML, only for `connectors`
  # bindings; the Secret the environment comes from and the one mounted as files; plain
  # environment values, in the order the container receives them; an image overriding the
  # controller's default; the program the pod runs instead of `agent serve`; a workspace
  # volume, the program's own configuration files, and the seccomp and AppArmor profiles of its
  # container (a resource that declares none keeps `RuntimeDefault` seccomp and the runtime's
  # AppArmor default), only for `Command`; on either variant, the boundary that holds a
  # credential-free agent's only credential; and, only for `Command`, the schedule its runs
  # start on. Wire names are Kubernetes's.
  - name: loom.resource.LoomAgentSpec
    kind: struct
    fields:
      - name: agent
        type: Optional<loom.agent.AgentSpec>
      - name: routes
        type: Json
      - name: connectors_config
        type: Optional<String>
        naming: {wire: connectorsConfig}
      - name: secret_ref
        type: Optional<loom.resource.SecretRef>
        naming: {wire: secretRef}
      - name: secret_files
        type: Optional<loom.resource.SecretFiles>
        naming: {wire: secretFiles}
      - name: env
        type: Optional<List<loom.resource.EnvVar>>
      - name: image
        type: Optional<loom.resource.ImageRef>
      - name: command
        type: Optional<loom.resource.CommandSpec>
      - name: workspace
        type: Optional<loom.resource.Workspace>
      - name: config_files
        type: Optional<List<loom.resource.ConfigFile>>
        naming: {wire: configFiles}
      - name: seccomp_profile
        type: Optional<loom.resource.ConfinementProfile>
        naming: {wire: seccompProfile}
      - name: app_armor_profile
        type: Optional<loom.resource.ConfinementProfile>
        naming: {wire: appArmorProfile}
      - name: boundary
        type: Optional<loom.resource.Boundary>
      - name: schedule
        type: Optional<loom.resource.ScheduleSpec>

  # Why the controller refuses a resource before any child exists (story
  # operator-constraints-in-ess), one reason per refusal of `AdmitLoomAgent`. The first fourteen
  # are `loom.agent.RefusalReason`'s, answered for `spec.agent` by the check `b10x-loom agent
  # check` runs on an `AgentServe` resource, and by its credential walk and its decoder on a
  # `Command` resource; `Malformed` and `SecretLiteral` also answer the controller's own reading
  # of the other members. The rest are the controller's: empty routes and no model the pod can
  # reach (`NoModelRoute`); a text beyond what the credential walk reads, or a ConfigMap beyond
  # Kubernetes's 1 MiB (`TooLarge`); a `spec.boundary` beside a Secret (`BoundaryWithSecret`), an
  # upstream that is no plain `http://` URL of a cluster service (`BoundaryUpstreamInvalid`), an
  # upstream or audience no `allowedBoundaryUpstreams` entry gives (`BoundaryUpstreamNotAllowed`),
  # an egress entry naming a host or a namespace beside it (`BoundaryEgressHost`,
  # `BoundaryEgressNamespace`); a Secret outside `allowedSecretNames` (`SecretNotAllowed`); a
  # `deploy.kubernetes.namespace` other than the resource's (`NamespaceMismatch`); an egress entry
  # naming no destination or a host outside `allowedEgressHosts` (`EgressHostNotAllowed`); a
  # `spec.env` name the controller sets or an earlier entry gives (`EnvNameConflict`); a
  # `spec.configFiles` name that is no plain file name (`ConfigFileInvalid`) or one the ConfigMap
  # already holds (`ConfigFileConflict`); a mount path that is not absolute and plain or overlaps
  # one the controller mounts (`MountPathInvalid`); a claim outside `allowedClaimNames`
  # (`ClaimNotAllowed`); a seccomp or AppArmor profile out of form (`ProfileInvalid`) or not allowed
  # (`ProfileNotAllowed`); a `Command` resource nobody sized (`ResourcesRequired`).
  - name: loom.resource.AdmissionRefusalReason
    kind: enum
    variants:
      [Malformed, SecretLiteral, UnknownFormat, BlankText, NotAVariableName, PortOutOfRange,
       NotAPlainPath, NotAnInstant, UnknownProtocol, UnknownAction, UnboundSource, HttpMethod,
       SendWithoutWrites, EmptyChannelAllow, NoModelRoute, TooLarge, BoundaryWithSecret,
       BoundaryUpstreamInvalid, BoundaryUpstreamNotAllowed, BoundaryEgressHost,
       BoundaryEgressNamespace, SecretNotAllowed, NamespaceMismatch, EgressHostNotAllowed,
       EnvNameConflict, ConfigFileInvalid, ConfigFileConflict, MountPathInvalid, ClaimNotAllowed,
       ProfileInvalid, ProfileNotAllowed, ResourcesRequired]

  # What `b10x-loom agent stage-files --to` names when it starts (story
  # operator-constraints-in-ess): nothing, a directory, a symbolic link, or anything else.
  - name: loom.resource.StageDestination
    kind: enum
    variants: [Absent, Directory, Link, Other]

  # Why `b10x-loom agent stage-files` stages nothing (story operator-constraints-in-ess), one
  # reason per refusal of `StageFiles`: `--to` is a link, which a copy would follow
  # (`DestinationIsALink`), or neither absent nor a directory (`DestinationNotADirectory`); a name
  # in the Secret volume is not UTF-8 (`NameNotUtf8`); a key resolves to a path outside the volume
  # (`KeyOutsideVolume`); `--to` holds a directory, keyed or not, which staging would have to
  # recurse into or replace (`StaleDirectory`).
  - name: loom.resource.StageRefusalReason
    kind: enum
    variants:
      [DestinationIsALink, DestinationNotADirectory, NameNotUtf8, KeyOutsideVolume,
       StaleDirectory]

entities:
  # One `LoomAgent` resource as the controller holds it. `observed_generation` is the
  # `metadata.generation` of the spec the controller last applied, the spec staying in the cluster;
  # `check` is the spec check's result for that generation, absent until it ran. The state
  # is the controller's phase: Pending from apply until the check ran; Running when the check
  # passed; Refused when it failed, until a new generation is applied; Degraded while the child
  # Deployment is unavailable, Running again when it is. A `Command` resource's pod is a Job that
  # runs once: Completed when its run succeeded, Failed when it did not, and either stays as it is
  # until a new generation, so the controller never starts a finished run again (story
  # command-variant-runs-once). A scheduled `Command` resource's pod is a CronJob's: it stays
  # Running and records each finished run as `last_run` (story command-schedule). A new
  # generation returns every state to Pending with the check cleared. Nothing is terminal: a
  # resource leaves by deletion.
  # `deployment` is what the controller last read of the child Deployment, absent until it read
  # one and cleared by a new generation, whose Deployment is not yet read. An observation that
  # leaves Running or Degraded as it is moves over a self-transition (`observe-running`,
  # `observe-degraded`) so it can record what it read: on ESS 0.69.0 an `updates:` outcome beside
  # `moves:` outcomes under one subject predicate makes the whole command a hand-written
  # obligation, and a `preserves:` outcome sets nothing.
  - name: loom.resource.LoomAgent
    identity:
      name: name
      type: loom.resource.ResourceName
    fields:
      - name: observed_generation
        type: Integer
        naming: {wire: observedGeneration}
      - name: check
        type: Optional<loom.resource.CheckResult>
      - name: deployment
        type: Optional<loom.resource.DeploymentStatus>
      # What the pod of the checked generation runs, recorded with the check and cleared by a new
      # generation (story loom-agent-command-variant).
      - name: variant
        type: Optional<loom.resource.AgentVariant>
      # How the `Command` resource's run of this generation ended, recorded when it moves to
      # Completed or Failed and cleared by a new generation, so a caller reads the program's exit
      # code from the resource and not from the pod (story command-run-exit-status).
      - name: run
        type: Optional<loom.resource.RunEnd>
      # How the most recent finished run of a scheduled `Command` resource ended, recorded each
      # time the controller reads a newer finished run while the resource stays Running, and
      # cleared by a new generation (story command-schedule).
      - name: last_run
        type: Optional<loom.resource.LastRun>
        naming: {wire: lastRun}
      # The controller's projection of `state`, `check` and `deployment` as Kubernetes conditions,
      # computed when it publishes the status. No command sets it, because a `sets:` value on ESS
      # 0.69.0 admits no list (a list is read only as the `via:` of a related read, and `[]` needs
      # `ess/31`); the declaration gives the CRD its schema. ESS 0.69.0 workaround, reported as an
      # ESS gap.
      - name: conditions
        type: Optional<List<loom.resource.Condition>>
    lifecycle:
      initial: Pending
      states: [Pending, Running, Refused, Degraded, Completed, Failed]
      terminal: []
      transitions:
        - name: run
          from: [Pending]
          to: Running
        - name: refuse
          from: [Pending]
          to: Refused
        - name: degrade
          from: [Running]
          to: Degraded
        - name: recover
          from: [Degraded]
          to: Running
        - name: observe-running
          from: [Running]
          to: Running
        - name: observe-degraded
          from: [Degraded]
          to: Degraded
        - name: complete
          from: [Running]
          to: Completed
        - name: fail
          from: [Running]
          to: Failed
        - name: respecify
          from: [Pending, Running, Refused, Degraded, Completed, Failed]
          to: Pending

errors:
  # The command names a generation older than the one the controller holds: an informer replaying
  # an earlier event, or a check result of a pod the controller already replaced.
  - name: loom.resource.StaleGeneration
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: observed_generation
        type: Integer

  - name: loom.resource.LoomAgentNotFound
    fields:
      - name: name
        type: loom.resource.ResourceName

  # The command does not apply in the resource's state: a check result for a resource that is not
  # Pending, a Deployment observation for one that has no Deployment, or a run observation for one
  # that has no Job running or finished.
  - name: loom.resource.LoomAgentStateConflict
    fields:
      - name: name
        type: loom.resource.ResourceName

  # The refusal of `AdmitLoomAgent`: why, which member of the resource (spelt from it, such as
  # `spec.agent.bindings[1].base_url` or `spec.workspace.mountPath`), and what is wrong with it,
  # never repeating a value of the resource. The controller records it as `RecordCheck`'s message,
  # `refused: <reason> at <member>: <detail>`.
  - name: loom.resource.AdmissionRefused
    fields:
      - name: reason
        type: loom.resource.AdmissionRefusalReason
      - name: member
        type: String
      - name: detail
        type: String

  # The refusal of `StageFiles`: why. The command exits 1 naming the path, and stages nothing.
  - name: loom.resource.StageRefused
    fields:
      - name: reason
        type: loom.resource.StageRefusalReason

events:
  - name: loom.resource.LoomAgentApplied
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer

  - name: loom.resource.LoomAgentRunning
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer

  - name: loom.resource.LoomAgentRefused
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: message
        type: String

  - name: loom.resource.LoomAgentDegraded
    fields:
      - name: name
        type: loom.resource.ResourceName

  - name: loom.resource.LoomAgentRecovered
    fields:
      - name: name
        type: loom.resource.ResourceName

  - name: loom.resource.LoomAgentDeleted
    fields:
      - name: name
        type: loom.resource.ResourceName

  # An observation of the child Deployment that left the state as it was, with what was read.
  - name: loom.resource.LoomAgentObserved
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: availability
        type: loom.resource.DeploymentAvailability

  # The child Job's run of a generation ended with exit code 0, as far as its pod was read.
  - name: loom.resource.LoomAgentCompleted
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: exit_code
        type: Optional<Integer>

  # The child Job's run of a generation ended otherwise: the program's exit code, absent when no
  # container of the run terminated.
  - name: loom.resource.LoomAgentFailed
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: exit_code
        type: Optional<Integer>

  # An observation of the child Job whose run has not ended.
  - name: loom.resource.LoomAgentRunObserved
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer

  # A finished run of a scheduled resource's CronJob, newer than the one the record held: its
  # phase and the program's exit code, absent when no container of the run terminated.
  - name: loom.resource.LoomAgentLastRunObserved
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: phase
        type: loom.resource.RunPhase
      - name: exit_code
        type: Optional<Integer>

commands:
  # The controller saw the resource at a generation: created, or changed. A generation the
  # controller already holds is a reconcile of what it has and changes nothing; an older one is
  # stale and refused; a newer one returns the resource to Pending, its check and its Deployment
  # observation cleared, from whatever state it held, Pending included (design § 5.1: the check
  # runs again for every generation).
  - name: loom.resource.ApplyLoomAgent
    input:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
    outcomes:
      - name: created
        unknown_instance: true
        creates: loom.resource.LoomAgent
        instance: name
        sets:
          observed_generation: input.generation
        emits: [loom.resource.LoomAgentApplied]
        payload:
          loom.resource.LoomAgentApplied:
            name: input.name
            generation: input.generation
      - name: stale
        when_subject:
          predicate: observed_generation > input.generation
        error: loom.resource.StaleGeneration
        payload:
          loom.resource.StaleGeneration:
            name: input.name
            generation: input.generation
            observed_generation: {subject: observed_generation}
      - name: unchanged
        when_subject:
          predicate: observed_generation == input.generation
        preserves: loom.resource.LoomAgent
        instance: name
      - name: respecified
        moves: loom.resource.LoomAgent.respecify
        instance: name
        sets:
          observed_generation: input.generation
          check: {cleared: true}
          deployment: {cleared: true}
          variant: {cleared: true}
          run: {cleared: true}
          last_run: {cleared: true}
        emits: [loom.resource.LoomAgentApplied]
        payload:
          loom.resource.LoomAgentApplied:
            name: input.name
            generation: input.generation

  # The spec check ran for a generation: exit code 0 runs the agent, any other refuses it; either
  # records the variant the spec selects. A result for a generation the controller has moved past
  # is stale; a result for a resource that is not Pending is out of order and changes nothing.
  - name: loom.resource.RecordCheck
    input:
      - name: name
        type: loom.resource.ResourceName
      - name: generation
        type: Integer
      - name: exit_code
        type: Integer
      - name: message
        type: String
      - name: variant
        type: loom.resource.AgentVariant
    outcomes:
      - name: unknown
        unknown_instance: true
        error: loom.resource.LoomAgentNotFound
        payload:
          loom.resource.LoomAgentNotFound:
            name: input.name
      - name: stale
        when_subject:
          predicate: observed_generation != input.generation
        error: loom.resource.StaleGeneration
        payload:
          loom.resource.StaleGeneration:
            name: input.name
            generation: input.generation
            observed_generation: {subject: observed_generation}
      - name: running
        when: exit_code == 0
        moves: loom.resource.LoomAgent.run
        instance: name
        sets:
          check: {exit_code: input.exit_code, message: input.message}
          variant: input.variant
        emits: [loom.resource.LoomAgentRunning]
        payload:
          loom.resource.LoomAgentRunning:
            name: input.name
            generation: input.generation
      - name: refused
        moves: loom.resource.LoomAgent.refuse
        instance: name
        sets:
          check: {exit_code: input.exit_code, message: input.message}
          variant: input.variant
        emits: [loom.resource.LoomAgentRefused]
        payload:
          loom.resource.LoomAgentRefused:
            name: input.name
            generation: input.generation
            message: input.message
      - name: out-of-order
        wrong_state: true
        error: loom.resource.LoomAgentStateConflict
        payload:
          loom.resource.LoomAgentStateConflict:
            name: input.name

  # The controller read the child Deployment's availability: a Running resource whose Deployment
  # is unavailable is Degraded, a Degraded one whose Deployment is available is Running again,
  # and one already in the state the observation says stays in it. Every outcome that reads a
  # Deployment records the availability as `deployment`, so a Running resource whose Deployment is
  # available shows it. A resource without a Deployment to observe (Pending, Refused) answers a
  # state conflict.
  - name: loom.resource.ObserveDeployment
    input:
      - name: name
        type: loom.resource.ResourceName
      - name: availability
        type: loom.resource.DeploymentAvailability
    outcomes:
      - name: unknown
        unknown_instance: true
        error: loom.resource.LoomAgentNotFound
        payload:
          loom.resource.LoomAgentNotFound:
            name: input.name
      - name: degraded
        when_subject_state: Running
        when: availability == Unavailable
        moves: loom.resource.LoomAgent.degrade
        instance: name
        sets:
          deployment: {availability: input.availability}
        emits: [loom.resource.LoomAgentDegraded]
        payload:
          loom.resource.LoomAgentDegraded:
            name: input.name
      - name: still-running
        when_subject_state: Running
        when: availability == Available
        moves: loom.resource.LoomAgent.observe-running
        instance: name
        sets:
          deployment: {availability: input.availability}
        emits: [loom.resource.LoomAgentObserved]
        payload:
          loom.resource.LoomAgentObserved:
            name: input.name
            availability: input.availability
      - name: recovered
        when_subject_state: Degraded
        when: availability == Available
        moves: loom.resource.LoomAgent.recover
        instance: name
        sets:
          deployment: {availability: input.availability}
        emits: [loom.resource.LoomAgentRecovered]
        payload:
          loom.resource.LoomAgentRecovered:
            name: input.name
      - name: still-degraded
        when_subject_state: Degraded
        when: availability == Unavailable
        moves: loom.resource.LoomAgent.observe-degraded
        instance: name
        sets:
          deployment: {availability: input.availability}
        emits: [loom.resource.LoomAgentObserved]
        payload:
          loom.resource.LoomAgentObserved:
            name: input.name
            availability: input.availability
      - name: no-deployment
        error: loom.resource.LoomAgentStateConflict
        payload:
          loom.resource.LoomAgentStateConflict:
            name: input.name

  # The controller read the child Job of a `Command` resource (story command-variant-runs-once). A
  # Running resource whose run has not ended stays Running, over the self-transition
  # `observe-running`, and records the observation as an event; one whose run succeeded is
  # Completed, one whose run failed is Failed, each event naming the generation the record holds.
  # A finished resource observed again stays as it is, whatever was read, so a Job someone deletes
  # or replaces starts no second run of that generation. A resource with no Job (Pending, Refused)
  # or whose pod is a Deployment (Degraded) answers a state conflict. The command carries no
  # generation: on `format: ess/25` a guard on a subject field (`observed_generation !=
  # input.generation`) and guards on the held state cannot share a command, so the controller
  # observes only a Job whose pod template names the generation the record holds, and deletes any
  # other. The observation carries how the run ended as far as the Job's own pod says
  # (`exit_code`, `finished_at`, `reason`, story command-run-exit-status); `completed` and `failed`
  # record it as `run`, and the other outcomes leave `run` as it was.
  - name: loom.resource.ObserveRun
    input:
      - name: name
        type: loom.resource.ResourceName
      - name: phase
        type: loom.resource.RunPhase
      - name: exit_code
        type: Optional<Integer>
      - name: finished_at
        type: Optional<Timestamp>
      - name: reason
        type: Optional<String>
    outcomes:
      - name: unknown
        unknown_instance: true
        error: loom.resource.LoomAgentNotFound
        payload:
          loom.resource.LoomAgentNotFound:
            name: input.name
      - name: still-active
        when_subject_state: Running
        when: phase == Active
        moves: loom.resource.LoomAgent.observe-running
        instance: name
        emits: [loom.resource.LoomAgentRunObserved]
        payload:
          loom.resource.LoomAgentRunObserved:
            name: input.name
            generation: {subject: observed_generation}
      - name: completed
        when_subject_state: Running
        when: phase == Succeeded
        moves: loom.resource.LoomAgent.complete
        instance: name
        sets:
          run: {exit_code: input.exit_code, finished_at: input.finished_at, reason: input.reason}
        emits: [loom.resource.LoomAgentCompleted]
        payload:
          loom.resource.LoomAgentCompleted:
            name: input.name
            generation: {subject: observed_generation}
            exit_code: input.exit_code
      - name: failed
        when_subject_state: Running
        when: phase == Failed
        moves: loom.resource.LoomAgent.fail
        instance: name
        sets:
          run: {exit_code: input.exit_code, finished_at: input.finished_at, reason: input.reason}
        emits: [loom.resource.LoomAgentFailed]
        payload:
          loom.resource.LoomAgentFailed:
            name: input.name
            generation: {subject: observed_generation}
            exit_code: input.exit_code
      - name: finished
        when_subject_state: [Completed, Failed]
        preserves: loom.resource.LoomAgent
        instance: name
      - name: no-run
        error: loom.resource.LoomAgentStateConflict
        payload:
          loom.resource.LoomAgentStateConflict:
            name: input.name

  # The controller read the most recent finished Job of a scheduled `Command` resource's CronJob
  # (story command-schedule, design § 12.2). A scheduled resource never reaches Completed or
  # Failed: it stays Running, over the self-transition `observe-running`, and records how that run
  # ended as `last_run`, so each finished run is reported in turn, the newest last. The controller
  # observes a Job only when it is newer than the one it last recorded, so an unchanged Job emits
  # no second event. A run read before it ended changes nothing. A resource that is not Running
  # (Pending, Refused, and the Job variant's Completed and Failed) answers a state conflict.
  - name: loom.resource.ObserveScheduledRun
    input:
      - name: name
        type: loom.resource.ResourceName
      - name: phase
        type: loom.resource.RunPhase
      - name: exit_code
        type: Optional<Integer>
      - name: finished_at
        type: Optional<Timestamp>
      - name: reason
        type: Optional<String>
    outcomes:
      - name: unknown
        unknown_instance: true
        error: loom.resource.LoomAgentNotFound
        payload:
          loom.resource.LoomAgentNotFound:
            name: input.name
      - name: last-run-succeeded
        when_subject_state: Running
        when: phase == Succeeded
        moves: loom.resource.LoomAgent.observe-running
        instance: name
        sets:
          last_run:
            phase: input.phase
            exit_code: input.exit_code
            finished_at: input.finished_at
            reason: input.reason
        emits: [loom.resource.LoomAgentLastRunObserved]
        payload:
          loom.resource.LoomAgentLastRunObserved:
            name: input.name
            generation: {subject: observed_generation}
            phase: input.phase
            exit_code: input.exit_code
      - name: last-run-failed
        when_subject_state: Running
        when: phase == Failed
        moves: loom.resource.LoomAgent.observe-running
        instance: name
        sets:
          last_run:
            phase: input.phase
            exit_code: input.exit_code
            finished_at: input.finished_at
            reason: input.reason
        emits: [loom.resource.LoomAgentLastRunObserved]
        payload:
          loom.resource.LoomAgentLastRunObserved:
            name: input.name
            generation: {subject: observed_generation}
            phase: input.phase
            exit_code: input.exit_code
      - name: run-active
        when_subject_state: Running
        when: phase == Active
        preserves: loom.resource.LoomAgent
        instance: name
      - name: not-running
        error: loom.resource.LoomAgentStateConflict
        payload:
          loom.resource.LoomAgentStateConflict:
            name: input.name

  # The resource is gone from the cluster: the controller forgets it. Its children go with it by
  # owner reference (design § 5.2), which is Kubernetes's, not this domain's.
  - name: loom.resource.DeleteLoomAgent
    input:
      - name: name
        type: loom.resource.ResourceName
    outcomes:
      - name: deleted
        deletes: loom.resource.LoomAgent
        instance: name
        emits: [loom.resource.LoomAgentDeleted]
        payload:
          loom.resource.LoomAgentDeleted:
            name: input.name
      - name: unknown
        unknown_instance: true
        error: loom.resource.LoomAgentNotFound
        payload:
          loom.resource.LoomAgentNotFound:
            name: input.name

  # Whether the controller admits the `LoomAgent` document at `path` (story
  # operator-constraints-in-ess): the checks before any child is rendered, whose answer
  # `RecordCheck` records for the generation (`b10x-loom-operator`'s `admission::admit`, then the
  # name a scheduled resource's CronJob carries). The resource and the controller's configuration
  # it is admitted under (its allowed Secrets, egress hosts, claims, profiles and boundary
  # upstreams, its model route and its default sizes) are outside the input, so every refusal is
  # external. The first refusal is the answer, in the order the operator's admission module
  # documents; a resource none of them claims is admitted. Nothing is rendered, nothing is read but
  # the resource and the configuration, and nothing is held between two admissions.
  - name: loom.resource.AdmitLoomAgent
    input:
      - name: path
        type: String
    outcomes:
      - name: malformed
        external: a member of the resource does not decode, or breaks a rule no other reason names
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: Malformed}
      - name: secret-literal
        external: a member of the resource holds a credential
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: SecretLiteral}
      - name: unknown-format
        external: spec.agent's format is not loom.agent/1
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: UnknownFormat}
      - name: blank-text
        external: a text member of spec.agent is empty or only whitespace
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BlankText}
      - name: not-a-variable-name
        external: a bearer_env of spec.agent, or a spec.env name, is not an environment variable name
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: NotAVariableName}
      - name: port-out-of-range
        external: a port of spec.agent is outside 1 to 65535
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: PortOutOfRange}
      - name: not-a-plain-path
        external: an allow_paths entry of an http binding of spec.agent is not a plain path
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: NotAPlainPath}
      - name: not-an-instant
        external: a Timestamp member of spec.agent is not an RFC 3339 instant
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: NotAnInstant}
      - name: unknown-protocol
        external: the inner loop of an AgentServe resource's spec.agent names a protocol the plugin catalog does not hold
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: UnknownProtocol}
      - name: unknown-action
        external: a state of an AgentServe resource's spec.agent names an action its protocol does not declare
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: UnknownAction}
      - name: unbound-source
        external: a state, the outer loop or the channel of an AgentServe resource's spec.agent names a source no binding declares
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: UnboundSource}
      - name: http-method
        external: an http binding of an AgentServe resource's spec.agent has a method other than GET
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: HttpMethod}
      - name: send-without-writes
        external: an AgentServe resource's spec.agent has reply.send among its capabilities while writes are none or undeclared
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: SendWithoutWrites}
      - name: empty-channel-allow
        external: the channel of an AgentServe resource's spec.agent allows no channel id
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: EmptyChannelAllow}
      - name: no-model-route
        external: spec.routes is empty and the pod would reach no model
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: NoModelRoute}
      - name: too-large
        external: a member is beyond what the credential walk reads, or the ConfigMap beyond 1 MiB
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: TooLarge}
      - name: boundary-with-secret
        external: spec.boundary stands beside spec.secretRef or spec.secretFiles
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BoundaryWithSecret}
      - name: boundary-upstream-invalid
        external: a boundary upstream is no plain http URL of a cluster service
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BoundaryUpstreamInvalid}
      - name: boundary-upstream-not-allowed
        external: no allowedBoundaryUpstreams entry gives a boundary upstream's kind, URL and audience exactly
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BoundaryUpstreamNotAllowed}
      - name: boundary-egress-host
        external: beside spec.boundary, an egress entry of spec.agent names a host
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BoundaryEgressHost}
      - name: boundary-egress-namespace
        external: beside spec.boundary, an egress entry of spec.agent names a namespace
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: BoundaryEgressNamespace}
      - name: secret-not-allowed
        external: spec.secretRef or spec.secretFiles names a Secret outside allowedSecretNames
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: SecretNotAllowed}
      - name: namespace-mismatch
        external: spec.agent's deploy.kubernetes.namespace is not the resource's namespace
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: NamespaceMismatch}
      - name: egress-host-not-allowed
        external: an egress entry of spec.agent names no destination, or a host outside allowedEgressHosts
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: EgressHostNotAllowed}
      - name: env-name-conflict
        external: a spec.env name is one the controller sets, or one an earlier entry gives
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: EnvNameConflict}
      - name: config-file-invalid
        external: a spec.configFiles name is no plain file name
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ConfigFileInvalid}
      - name: config-file-conflict
        external: a spec.configFiles name is one an earlier entry gives, or one the ConfigMap already holds
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ConfigFileConflict}
      - name: mount-path-invalid
        external: a workspace or Secret mount path is not absolute and plain, or overlaps a mount the controller makes or the other one
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: MountPathInvalid}
      - name: claim-not-allowed
        external: spec.workspace names a claim outside allowedClaimNames
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ClaimNotAllowed}
      - name: profile-invalid
        external: a seccomp or AppArmor profile is out of form
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ProfileInvalid}
      - name: profile-not-allowed
        external: a seccomp or AppArmor profile is Unconfined or Localhost without the configuration allowing it
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ProfileNotAllowed}
      - name: resources-required
        external: a Command resource declares no size and the configuration gives no defaultCommandResources
        error: loom.resource.AdmissionRefused
        payload:
          loom.resource.AdmissionRefused: {reason: ResourcesRequired}
      - name: admitted
        accepts: nothing

  # What `b10x-loom agent stage-files --from <volume> --to <dir>` does with what it found (story
  # operator-constraints-in-ess), decided before it writes anything: `destination` is what `--to`
  # is; `names_utf8` whether every name in the Secret volume `--from` is UTF-8; `keys_inside`
  # whether every key (a name not starting with `..`) resolves to a path inside the volume;
  # `stale_directory` whether `--to` holds any directory, keyed or not. The
  # first refusal in declaration order is the answer, and a refused staging writes nothing.
  # Otherwise `--to` is created when absent, its mode set to `directory_mode` and each key that is
  # a regular file copied, in name order, to a new file of mode `file_mode` (never through what
  # stood there before), and each other entry of `--to` removed, so a key dropped from the Secret
  # does not stay staged. Both are owned by the user the command runs as, the pod's.
  - name: loom.resource.StageFiles
    input:
      - name: destination
        type: loom.resource.StageDestination
      - name: names_utf8
        type: Boolean
      - name: keys_inside
        type: Boolean
      - name: stale_directory
        type: Boolean
    response:
      - name: directory_mode
        type: Integer
      - name: file_mode
        type: Integer
    outcomes:
      - name: destination-is-a-link
        when: destination == Link
        error: loom.resource.StageRefused
        payload:
          loom.resource.StageRefused: {reason: DestinationIsALink}
      - name: destination-not-a-directory
        when: destination == Other
        error: loom.resource.StageRefused
        payload:
          loom.resource.StageRefused: {reason: DestinationNotADirectory}
      - name: name-not-utf8
        when: names_utf8 == false
        error: loom.resource.StageRefused
        payload:
          loom.resource.StageRefused: {reason: NameNotUtf8}
      - name: key-outside-volume
        when: keys_inside == false
        error: loom.resource.StageRefused
        payload:
          loom.resource.StageRefused: {reason: KeyOutsideVolume}
      - name: stale-directory
        when: stale_directory == true
        error: loom.resource.StageRefused
        payload:
          loom.resource.StageRefused: {reason: StaleDirectory}
      - name: staged
        returns: true

views:
  # Every resource the controller holds, one row each, with the fields its status publishes. It
  # carries `deployment` and `conditions` too, so a scenario of a preserving outcome of
  # `ApplyLoomAgent` reads every field it leaves as it was.
  - name: loom.resource.LoomAgents
    source: loom.resource.LoomAgent
    consistency: read_your_writes
    fields:
      - name: name
        type: loom.resource.ResourceName
      - name: observed_generation
        type: Integer
      - name: check
        type: Optional<loom.resource.CheckResult>
      - name: deployment
        type: Optional<loom.resource.DeploymentStatus>
      - name: variant
