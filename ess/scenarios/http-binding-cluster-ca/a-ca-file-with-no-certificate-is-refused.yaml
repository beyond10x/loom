# TLS client takes as a root, is refused: a setting that trusts nothing is a mistake, not a default.
type: ess-scenario/4
domain: loom.agent
scenario: a-ca-file-with-no-certificate-is-refused
summary: An empty `LOOM_HTTP_CA_FILE`, or one holding no certificate, is refused `NoCertificate`.

