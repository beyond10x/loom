# story operator-constraints-in-ess: a destination that is a symbolic link is refused before
# anything is written, whatever it points at, so a planted link cannot redirect the copy.
type: ess-scenario/4
domain: loom.resource
scenario: a-destination-that-is-a-link-is-refused
summary: A destination that is a link is refused.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.StageFiles
    input: {destination: Link, names_utf8: true, keys_inside: true, stale_directory: false}
    outcome: destination-is-a-link
    error:
      name: loom.resource.StageRefused
      fields: {reason: DestinationIsALink}
