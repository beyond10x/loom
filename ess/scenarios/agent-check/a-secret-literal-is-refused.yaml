# story agent-check: a credential written into the document is refused before anything else is
# checked, naming the member and never repeating the value. The fixture is the operator example
# whose `logs` binding carries a user name and password in its URL.
type: ess-scenario/4
domain: loom.agent
scenario: a-secret-literal-is-refused
summary: A binding URL carrying a password is refused, naming the member and not the password.

timeline:
  - at: 2026-10-25T00:00:00Z
    command: loom.agent.CheckAgentSpec
    input: {path: ess/scenarios/agent-check/specs/secret-literal.yaml}
    outcome: secret-literal
    error:
      name: loom.agent.SpecRefused
      fields: {reason: SecretLiteral, member: "bindings[1].base_url", detail: a URL carrying a user name and password}
