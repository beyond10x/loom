# story operator-constraints-in-ess: the agent-check fixture of the same reason, held as
# spec.agent, is refused for that reason at its member under spec.agent.
type: ess-scenario/4
domain: loom.resource
scenario: a-secret-literal-in-the-agent-is-refused
summary: A spec.agent carrying a credential in a URL is refused SecretLiteral at that member.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.AdmitLoomAgent
    input: {path: ess/scenarios/resource-admission/resources/secret-literal.yaml}
    outcome: secret-literal
    error:
      name: loom.resource.AdmissionRefused
      fields:
        reason: SecretLiteral
        member: spec.agent.bindings[1].base_url
        detail: "a URL carrying a user name and password"
