# story operator-constraints-in-ess: a pod behind a boundary holds no credential, so a Secret
# beside the boundary is refused at the Secret's member.
type: ess-scenario/4
domain: loom.resource
scenario: a-boundary-beside-a-secret-is-refused
summary: A model boundary beside a Secret as the environment is refused BoundaryWithSecret.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.AdmitLoomAgent
    input: {path: ess/scenarios/resource-admission/resources/boundary-with-secret.yaml}
    outcome: boundary-with-secret
    error:
      name: loom.resource.AdmissionRefused
      fields:
        reason: BoundaryWithSecret
        member: spec.secretRef
        detail: "a resource with spec.boundary holds no credential in its pod; its boundary's projected tokens stand in for a Secret"
