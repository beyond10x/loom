# story operator-constraints-in-ess: a Command resource declares its size in spec.agent, or
# the controller configures defaultCommandResources; with neither it is refused.
type: ess-scenario/4
domain: loom.resource
scenario: an-unsized-command-resource-is-refused
summary: A Command resource without a size, under a configuration without defaultCommandResources, is refused ResourcesRequired.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.AdmitLoomAgent
    input: {path: ess/scenarios/resource-admission/resources/resources-required.yaml}
    outcome: resources-required
    error:
      name: loom.resource.AdmissionRefused
      fields:
        reason: ResourcesRequired
        member: spec.agent.deploy.kubernetes.resources
        detail: "Loom cannot size a program it does not know: declare its cpu and memory in spec.agent.deploy.kubernetes.resources, or set defaultCommandResources in the controller's configuration"
