# story operator-constraints-in-ess: a pod behind a boundary reaches no external host; an egress
# host in spec.agent is refused at that entry.
type: ess-scenario/4
domain: loom.resource
scenario: a-boundary-beside-an-egress-host-is-refused
summary: A model boundary beside an egress host in spec.agent is refused BoundaryEgressHost.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.AdmitLoomAgent
    input: {path: ess/scenarios/resource-admission/resources/boundary-egress-host.yaml}
    outcome: boundary-egress-host
    error:
      name: loom.resource.AdmissionRefused
      fields:
        reason: BoundaryEgressHost
        member: spec.agent.deploy.kubernetes.egress[0].host
        detail: "a resource with spec.boundary reaches the outside only through its boundary's upstreams, so its NetworkPolicy opens no host"
