# story operator-constraints-in-ess: the environment comes only from a Secret the controller's
# allowedSecretNames holds.
type: ess-scenario/4
domain: loom.resource
scenario: a-secret-the-configuration-does-not-allow-is-refused
summary: A Secret allowedSecretNames does not hold is refused SecretNotAllowed.

timeline:
  - at: 2026-11-04T00:00:00Z
    command: loom.resource.AdmitLoomAgent
    input: {path: ess/scenarios/resource-admission/resources/secret-not-allowed.yaml}
    outcome: secret-not-allowed
    error:
      name: loom.resource.AdmissionRefused
      fields:
        reason: SecretNotAllowed
        member: spec.secretRef.name
        detail: "the controller's allowedSecretNames does not hold it"
