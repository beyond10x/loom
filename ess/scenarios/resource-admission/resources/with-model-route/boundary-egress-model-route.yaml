# story boundary-admits-declared-http-egress: a Command resource with an allowed model boundary
# whose spec.agent names an egress namespace, `models`, that is the namespace of the
# configuration's model route, with a selector, a credential-free GET binding there and an
# allowedBoundaryHttpEgress entry equal to it.
apiVersion: loom.beyond10x.dev/v1alpha1
kind: LoomAgent
metadata: {name: nightly, namespace: agents}
spec:
  agent:
    format: loom.agent/1
    agent: {id: nightly, name: Nightly, brief: Runs the nightly check.}
    model: {routes: routes.yaml, roles: [{role: agent, model: small}]}
    bindings:
      - {name: route, kind: http, base_url: 'http://model-route.models.svc:8080', allow_paths: [/v1/models], method: GET, max_bytes: 262144}
    deploy:
      kubernetes:
        namespace: agents
        service_account: nightly
        resources: {cpu: 500m, memory: 512Mi}
        egress: [{name: route, namespace: models, selector: [{name: app, value: model-route}], port: 8080}]
  routes: {}
  command: {args: [--once]}
  boundary:
    model: {upstream: 'http://llm-gateway.llm.svc:8080', audience: llm-gateway}
