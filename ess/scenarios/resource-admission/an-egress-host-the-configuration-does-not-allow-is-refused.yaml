# story operator-constraints-in-ess: each egress host of spec.agent is one the controller's
# allowedEgressHosts holds.
type: ess-scenario/4
domain: loom.resource
scenario: an-egress-host-the-configuration-does-not-allow-is-refused
summary: An egress host allowedEgressHosts does not hold is refused EgressHostNotAllowed.

timeline:
