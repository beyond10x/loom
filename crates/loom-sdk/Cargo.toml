[package]
name = "b10x-loom-sdk"
description = "One crate an application depends on to embed a governed agent: Commission's contracts and runtime, the Loom executor, the governor and intake, re-exported."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "loom_sdk"

[dependencies]
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-governor = { path = "../loom-governor" }
b10x-loom-intake-router = { path = "../loom-intake-router" }
b10x-loom-intake-slice = { path = "../loom-intake-slice" }
b10x-loom-executor = { path = "../loom-executor" }
