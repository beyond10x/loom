[package]
name = "b10x-loom-sdk"
description = "One crate an application depends on to embed a governed agent: Commission's contracts and runtime, the Loom executor, the governor and intake, re-exported."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "loom_sdk"

[dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-connectors = { path = "../loom-connectors" }
b10x-loom-governor = { path = "../loom-governor" }
b10x-loom-intake-router = { path = "../loom-intake-router" }
b10x-loom-intake-slice = { path = "../loom-intake-slice" }
b10x-loom-executor = { path = "../loom-executor" }
b10x-llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.6.0" }
b10x-llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.6.0", features = ["environment", "file"] }
b10x-llm-http = { git = "https://github.com/beyond10x/llm", tag = "0.6.0" }
models_config = { package = "loom", path = "../../generated/rust/loom" }
serde = "1"
serde_yaml_ng = "0.10"
libc = "0.2"
serde_json = "1"
tokio = { version = "1.53", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
