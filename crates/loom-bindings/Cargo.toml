[package]
name = "b10x-loom-bindings"
description = "Decodes the loom.bindings/1 document, in which an operator declares per protocol action its executor, result table, tools, budget and timeout, checks it against the compiled protocol when it is loaded, and runs an action bound to a program through the host's runner, recording evidence by the binding's result table, and gives each artifact placed at a workspace path the content digest of what is there as its revision."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_bindings"

[dependencies]
b10x-canon = { git = "https://github.com/beyond10x/canon", tag = "0.10.0" }
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-governor = { path = "../loom-governor" }
b10x-loom-intake-slice = { path = "../loom-intake-slice" }
b10x-loom-protocols = { path = "../loom-protocols" }
loom = { path = "../../generated/rust/loom" }
rustix = { version = "1", features = ["fs", "std"] }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
b10x-loom-commission-testkit = { path = "../loom-commission-testkit" }
