[package]
name = "b10x-loom-executor"
description = "The Loom executor: Commission's AgentExecutor over a projected catalogue, with action selection kept apart from argument generation, each model request one turn of an llm Model."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
b10x-loom-commission = { path = "../loom-commission" }
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
loom = { path = "../../generated/rust/loom" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "time", "macros"] }

[dev-dependencies]
b10x-loom-commission-testkit = { path = "../loom-commission-testkit" }
