[package]
name = "b10x-loom-intake-model"
description = "Model access for intake through the llm crates: a Responses model over the operator's Codex login, and one forced tool call (story model-access)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_model"

[dependencies]
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.1.6" }
llm-credentials = { package = "b10x-llm-credentials", git = "https://github.com/beyond10x/llm", tag = "0.1.6", features = ["codex-auth-file"] }
llm-http = { package = "b10x-llm-http", git = "https://github.com/beyond10x/llm", tag = "0.1.6" }
llm-providers = { package = "b10x-llm-providers", git = "https://github.com/beyond10x/llm", tag = "0.1.6" }
llm-responses = { package = "b10x-llm-responses", git = "https://github.com/beyond10x/llm", tag = "0.1.6" }
serde_json = "1"
tokio = { version = "1.53", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros", "time", "net", "io-util"] }
