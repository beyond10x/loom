[package]
name = "b10x-loom-intake-references"
description = "Deterministic extraction of an intent's key references: tracker keys, chat permalinks, merge requests, pull requests and URLs (story intent-references)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_references"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat", "unicode-perl"] }
