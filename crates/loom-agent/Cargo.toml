[package]
name = "b10x-loom-agent"
description = "Checks a loom.agent/1 document before anything runs, naming the member and the reason of the first refusal, and serves one: the plugin host over the spec's channel, states, authority and governed writes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_agent"

[dependencies]
b10x-loom-plugin = { path = "../loom-plugin" }
b10x-loom-plugin-slack = { path = "../loom-plugin-slack" }
b10x-loom-sdk = { path = "../loom-sdk" }
chrono = "0.4"
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
intake_model = { package = "intake", path = "../../generated/rust/intake" }
loom = { path = "../../generated/rust/loom" }
reqwest = { version = "0.12", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1.53", features = ["rt"] }

[dev-dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
