[package]
name = "b10x-loom-operator"
description = "The Kubernetes controller of the LoomAgent resource: checks each resource's agent spec in-process and reconciles it into one pod with its ConfigMap, ServiceAccount, NetworkPolicy and Service, publishing the lifecycle as the resource's status."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_operator"

[[bin]]
name = "b10x-loom-operator"
path = "src/main.rs"

[dependencies]
b10x-llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
b10x-loom-agent = { path = "../loom-agent" }
b10x-loom-protocols = { path = "../loom-protocols" }
b10x-loom-resource = { path = "../loom-resource" }
b10x-loom-sdk = { path = "../loom-sdk" }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
http = "1"
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower-test = "0.4"
