apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  labels:
    app.kubernetes.io/instance: platform-operator
    app.kubernetes.io/managed-by: b10x-loom-operator
    app.kubernetes.io/name: loom-agent
  name: platform-operator
  namespace: agents
  ownerReferences:
  - apiVersion: loom.beyond10x.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: LoomAgent
    name: platform-operator
    uid: 00000000-0000-4000-8000-000000000001
---
apiVersion: v1
kind: ConfigMap
data:
  connectors.toml: ''
  routes.yaml: |
    format: llm.routes/1
    endpoints:
      model-route:
        base_url: http://127.0.0.1:8401/v1
        protocol: messages
        auth:
          kind: anonymous
    routes: {}
  run.toml: |
    iterations = 1
metadata:
  labels:
    app.kubernetes.io/instance: platform-operator
    app.kubernetes.io/managed-by: b10x-loom-operator
    app.kubernetes.io/name: loom-agent
  name: platform-operator-spec
  namespace: agents
  ownerReferences:
  - apiVersion: loom.beyond10x.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: LoomAgent
    name: platform-operator
    uid: 00000000-0000-4000-8000-000000000001
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/instance: platform-operator
    app.kubernetes.io/managed-by: b10x-loom-operator
    app.kubernetes.io/name: loom-agent
  name: platform-operator
  namespace: agents
  ownerReferences:
  - apiVersion: loom.beyond10x.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: LoomAgent
    name: platform-operator
    uid: 00000000-0000-4000-8000-000000000001
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        loom.beyond10x.dev/generation: '1'
      labels:
        app.kubernetes.io/instance: platform-operator
        app.kubernetes.io/managed-by: b10x-loom-operator
        app.kubernetes.io/name: loom-agent
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --iterations
        - '1'
        env:
        - name: HOME
          value: /var/lib/agent
        - name: LOOM_BOUNDARY_MODEL_URL
          value: http://127.0.0.1:8401/v1
        - name: LOOM_BOUNDARY_CONNECTORS_URL
          value: http://127.0.0.1:8402
        - name: LOOM_BOUNDARY_GIT_URL
          value: http://127.0.0.1:8403
        - name: CARGO_NET_OFFLINE
          value: 'true'
        image: registry.example/takt:0.12.0
        name: loom-agent
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - mountPath: /config
          name: spec
          readOnly: true
        - mountPath: /var/lib/agent
          name: state
          subPath: home
        - mountPath: /tmp
          name: tmp
          subPath: tmp
        - mountPath: /workspace
          name: workspace
      initContainers:
      - command:
        - b10x-loom
        - agent
        - prepare-dirs
        - --dir
        - /var/run/loom/tmp/tmp
        - --dir
        - /var/run/loom/state/home
        image: registry.example/loom-agent:0.40.0
        name: prepare-writable-dirs
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
        volumeMounts:
        - mountPath: /var/run/loom/tmp
          name: tmp
        - mountPath: /var/run/loom/state
          name: state
      - args:
        - agent
        - boundary
        - --model-upstream
        - http://llm-gateway.llm.svc:8080
        - --model-token
        - /var/run/loom/boundary/tokens/model
        - --connectors-upstream
        - http://connectors.connectors.svc.cluster.local:8080
        - --connectors-token
        - /var/run/loom/boundary/tokens/connectors
        - --operation
        - merge_request.create
        - --operation
        - merge_request.get
        - --git-upstream
        - http://connectors.connectors.svc/git
        - --git-token
        - /var/run/loom/boundary/tokens/git
        - --repository
        - agents/takt-target
        - --repository
        - agents/takt-docs
        command:
        - b10x-loom
        image: registry.example/loom-agent:0.40.0
        name: boundary
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 100m
            memory: 64Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 10002
          runAsNonRoot: true
          runAsUser: 10002
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          exec:
            command:
            - b10x-loom
            - agent
            - boundary-ready
            - --port
            - '8401'
            - --port
            - '8402'
            - --port
            - '8403'
          failureThreshold: 30
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/loom/boundary/tokens
          name: boundary-tokens
          readOnly: true
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: platform-operator
      volumes:
      - configMap:
          name: platform-operator-spec
        name: spec
      - emptyDir: {}
        name: state
      - emptyDir: {}
        name: tmp
      - name: workspace
        persistentVolumeClaim:
          claimName: takt-workspace
      - name: boundary-tokens
        projected:
          sources:
          - serviceAccountToken:
              audience: llm-gateway
              expirationSeconds: 600
              path: model
          - serviceAccountToken:
              audience: connectors
              expirationSeconds: 600
              path: connectors
          - serviceAccountToken:
              audience: connectors-git
              expirationSeconds: 600
              path: git
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: platform-operator
    app.kubernetes.io/managed-by: b10x-loom-operator
    app.kubernetes.io/name: loom-agent
  name: platform-operator
  namespace: agents
  ownerReferences:
  - apiVersion: loom.beyond10x.dev/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: LoomAgent
    name: platform-operator
    uid: 00000000-0000-4000-8000-000000000001
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: llm
  - ports:
    - port: 8080
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: connectors
  - ports:
    - port: 80
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: connectors
  ingress: []
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: platform-operator
      app.kubernetes.io/name: loom-agent
  policyTypes:
  - Ingress
  - Egress
