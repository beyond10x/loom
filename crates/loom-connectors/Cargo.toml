[package]
name = "b10x-loom-connectors"
description = "Commission's ConnectorInvoker over a Connectors service: invokes a bound Connector operation once and reports the attempt Connectors recorded."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
b10x-loom-commission = { path = "../loom-commission" }
connectors-client = { git = "https://github.com/beyond10x/connectors", tag = "v0.62.0" }
connectors-core = { git = "https://github.com/beyond10x/connectors", tag = "v0.62.0" }
loom = { path = "../../generated/rust/loom" }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[dev-dependencies]
b10x-loom-commission-testkit = { path = "../loom-commission-testkit" }
b10x-loom-governor = { path = "../loom-governor" }
