[package]
name = "loom-xtask"
description = "Repository checks for Loom: generated-model drift and hand-written model types."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde_json = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
