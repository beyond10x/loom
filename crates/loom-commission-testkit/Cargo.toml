[package]
name = "b10x-loom-commission-testkit"
description = "Fakes of the Commission ports and conformance kits for adapters."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-governor = { path = "../loom-governor" }

[dev-dependencies]
b10x-loom-executor = { path = "../loom-executor" }
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
serde_json = "1"
serde_yaml_ng = "0.10"
syn ={ version = "3", default-features = false, features = ["full", "parsing", "visit"] }
