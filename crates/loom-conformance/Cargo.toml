[package]
name = "b10x-loom-conformance"
description = "The Rust ESS conformance target that holds b10x-loom-executor, b10x-loom-session-executor, b10x-loom-agent and b10x-loom-resource to the suite synthesized from Loom's run, session and agent domains."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
b10x-loom-agent = { path = "../loom-agent" }
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-protocols = { path = "../loom-protocols" }
b10x-loom-executor = { path = "../loom-executor" }
b10x-loom-resource = { path = "../loom-resource" }
b10x-loom-session-executor = { path = "../loom-session-executor" }
ess-conformance = { git = "https://github.com/beyond10x/ess.git", tag = "0.75.0" }
ess-primitives = { git = "https://github.com/beyond10x/ess.git", tag = "0.75.0" }
serde_json = "1"
