[package]
name = "b10x-loom-cli"
description = "The b10x-loom command line: route an intent to a protocol and run it until it is blocked."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_cli"

[[bin]]
name = "b10x-loom"
path = "src/main.rs"

[dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
serde_json = "1"
b10x-loom-governor = { path = "../loom-governor" }
b10x-llm-tool-call = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
b10x-loom-intake-slice = { path = "../loom-intake-slice" }
b10x-llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
b10x-llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
b10x-llm-routing = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
b10x-llm-http = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
b10x-llm-credentials = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
intake_model = { package = "intake", path = "../../generated/rust/intake" }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
b10x-loom-commission = { path = "../loom-commission" }
b10x-loom-intake-references = { path = "../loom-intake-references" }
serde_json = "1"
