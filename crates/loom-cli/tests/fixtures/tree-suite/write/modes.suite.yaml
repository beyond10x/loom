format: loom.tree-suite/1
defaults:
  protocol: finding@1
  bindings: bindings/finding.bindings.yaml
cycles:
  - name: makes
    seed:
      - {from: stubs/mode.sh, to: stubs/first.sh}
      - {from: stubs/apply.sh, to: stubs/apply.sh}
      - {from: seeds/ledger.txt, to: ledger.txt}
    steps:
      - {do: open}
      - {do: run, rounds: 1, exit: 3}
      - {do: write, name: new, from: seeds/findings-decided.yaml, to: a/b/new.txt}
      - {do: write, name: over, from: seeds/findings-decided.yaml, to: old.txt}
