format: loom.tree-suite/1
defaults:
  protocol: review@1
  bindings: bindings/review.bindings.yaml
  principal: reviewer
  seed: [{from: stubs, to: stubs}, {from: seeds/draft.txt, to: draft.txt}]
cycles:
  - name: step-result
    steps:
      - {do: open}
      - {do: run, exit: 3}
      - {do: approve, action: draft.review, result: rejected, reasons: ["one", "two"]}
      - {do: run, exit: 3}
      - {do: approve, action: draft.review}
      - {do: run}
    expect:
      exit: 0
      outcome: done
      checks:
        - check: sequence
          name: rejected-then-approved
          select: [{records: {case: ".", kind: draft_review}}, {path: result}]
          is: [rejected, approved]
        - check: contains
          name: reasons-in-the-blob
          select:
            - {doc: {in: store, path: observations.json}}
            - {path: "[source=loom/person].payload"}
            - {where: {action: draft.review}}
            - {pick: first}
            - {follow: {blob: blob_sha256}}
          is: "one\ntwo"

  - name: entry-result
    decide:
      - {take: approve, action: draft.review, result: rejected, reasons: [r], times: 1}
      - {take: approve, action: draft.review, times: 1}
    steps: [{do: open}, {do: run, exit: 3}, {do: run, exit: 3}, {do: run}]
    expect:
      exit: 0
      outcome: done
      checks:
        - check: sequence
          name: rejected-then-approved
          select: [{records: {case: ".", kind: draft_review}}, {path: result}]
          is: [rejected, approved]

  - name: reasons-at-the-limit
    steps:
      - {do: open}
      - {do: run, exit: 3}
      - do: approve
        action: draft.review
        result: rejected
        exit: 0
        reasons: [r01, r02, r03, r04, r05, r06, r07, r08, r09, r10,
                  r11, r12, r13, r14, r15, r16, r17, r18, r19, r20,
                  r21, r22, r23, r24, r25, r26, r27, r28, r29, r30,
                  r31, r32, r33, r34, r35, r36, r37, r38, r39, r40,
                  r41, r42, r43, r44, r45, r46, r47, r48, r49, r50,
                  r51, r52, r53, r54, r55, r56, r57, r58, r59, r60]
    expect:
      exit: 3

  - name: reasons-over-the-limit
    steps:
      - {do: open}
      - {do: run, exit: 3}
      - do: approve
        action: draft.review
        result: rejected
        exit: 1
        refusal: NotAPersonAction
        reasons: [r01, r02, r03, r04, r05, r06, r07, r08, r09, r10,
                  r11, r12, r13, r14, r15, r16, r17, r18, r19, r20,
                  r21, r22, r23, r24, r25, r26, r27, r28, r29, r30,
                  r31, r32, r33, r34, r35, r36, r37, r38, r39, r40,
                  r41, r42, r43, r44, r45, r46, r47, r48, r49, r50,
                  r51, r52, r53, r54, r55, r56, r57, r58, r59, r60,
                  r61]
    expect:
      exit: 3
