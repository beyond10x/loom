format: loom.tree-suite/1
defaults:
  protocol: step@1
  bindings: bindings/step.bindings.yaml
  steps: [{do: open}, {do: run}]
cycles:
  - name: one
    seed: [{from: stubs/gate.sh, to: stubs/gate.sh}, {from: stubs/look.sh, to: stubs/program.sh}, {from: names/one.txt, to: name.txt}, {from: peers/one, to: peer}]
  - name: two
    seed: [{from: stubs/gate.sh, to: stubs/gate.sh}, {from: stubs/look.sh, to: stubs/program.sh}, {from: names/two.txt, to: name.txt}, {from: peers/two, to: peer}]
