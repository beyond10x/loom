format: loom.tree-suite/1
defaults:
  protocol: step@1
  bindings: bindings/step.bindings.yaml
  steps: [{do: open}, {do: run}]
cycles:
  - name: one
    seed: [{from: stubs/kept.sh, to: stubs/program.sh}, {from: names/one.txt, to: name.txt}, {from: names/one.txt, to: tag.txt}]
  - name: fails
    seed: [{from: stubs/fails.sh, to: stubs/program.sh}, {from: names/two.txt, to: name.txt}]
