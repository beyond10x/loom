format: loom.bindings/1
protocol: tour@1
artifacts:
  route: route.txt
actions:
  - action: first.open
    executor:
      kind: open
      name: first
      bindings: tour-leg.bindings.yaml
    evidence:
      - kind: first_leg_opened
        subject: route
        producer: loom
        from: effect
        results: {performed: opened}
  - action: approval.copy
    executor:
      kind: copy
      evidence: route_approval
      from: tour.leg
  - action: legs.open
    executor:
      kind: open
      each: legs
      bindings: tour-leg.bindings.yaml
    arguments_from: [sh, stubs/legs.sh]
    evidence:
      - kind: legs_opened
        subject: route
        producer: loom
        from: effect
        results: {performed: opened}
