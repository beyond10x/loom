format: loom.bindings/1
protocol: tour-leg@1
artifacts:
  route: route.txt
  notes: notes.txt
  ticket: ticket.txt
actions:
  - action: route.write
    executor:
      kind: program
      argv: [sh, stubs/route-write.sh]
    retry_when:
      route_check: [invalid]
    handoff: Answer the finding in findings.txt, then run the tree again.
    handoff_when: [sh, stubs/handoff-when.sh, exit]
  - action: route.check
    executor:
      kind: program
      argv: [sh, stubs/route-check.sh]
    evidence:
      - kind: route_check
        subject: route
        producer: route-check
        from: exit
        results: {"0": valid, "*": invalid}
      - kind: route_shape
        subject: route
        producer: route-check
        from: exit
        results: {"0": two-stops, "*": short}
  - action: route.approve
    executor:
      kind: person
      principal: guide
    evidence:
      - kind: route_approval
        subject: route
        producer: guide
        from: effect
        results: {performed: approved}
  - action: ticket.issue
    executor:
      kind: program
      argv: [sh, stubs/ticket-issue.sh]
    evidence:
      - kind: ticket_issued
        subject: ticket
        producer: ticket-office
        from: exit
        results: {"0": issued, "*": refused}
