format: loom.bindings/1
protocol: fork@1
artifacts:
  road: road.txt
actions:
  - action: road.look
    executor:
      kind: program
      argv: [sh, stubs/road-look.sh]
    evidence:
      - kind: road_look
        subject: road
        producer: walker
        from: exit
        results: {"0": seen, "*": unseen}
