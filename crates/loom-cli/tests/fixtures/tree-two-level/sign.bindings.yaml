format: loom.bindings/1
protocol: sign@1
artifacts:
  post: road.txt
actions:
  - action: post.sign
    executor:
      kind: person
      principal: walker
    evidence:
      - kind: post_signed
        subject: post
        producer: walker
        from: effect
        results: {performed: signed}
  - action: post.seal
    executor:
      kind: person
      principal: clerk
    evidence:
      - kind: post_sealed
        subject: post
        producer: clerk
        from: effect
        results: {performed: sealed}
  - action: post.stamp
    executor:
      kind: program
      argv: [sh, stubs/post-stamp.sh]
    evidence:
      - kind: post_stamped
        subject: post
        producer: stamp
        from: exit
        results: {"0": stamped, "*": smudged}
