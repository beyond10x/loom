[package]
name = "b10x-loom-intake-slice"
description = "The vertical slice: open a case on the picked protocol through the governor and run Commission's runtime over it, with Loom proposing and a local effect adapter performing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_slice"

[dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
chrono = "0.4"
jiff = "0.2"
b10x-loom-commission = { path = "../loom-commission" }
b10x-canon-engineering = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.9.0" }
b10x-loom-governor = { path = "../loom-governor" }
b10x-loom-intake-references = { path = "../loom-intake-references" }
b10x-loom-intake-router = { path = "../loom-intake-router" }
llm-routing = { package = "b10x-llm-routing", git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
b10x-llm-tool-call = { git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
b10x-llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.8.1" }
b10x-loom-executor = { path = "../loom-executor" }
serde_json = "1"
serde = "1"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt", "time", "macros"] }
# Substrate's embedded host and wire are one released contract, ported from Harness.
substrate-host = { package = "b10x-substrate-host", git = "https://github.com/beyond10x/substrate", rev = "17e0e96946b9588c150298ac0f951211681b2043", version = "=0.7.18" }
substrate-wire = { package = "b10x-substrate-wire", git = "https://github.com/beyond10x/substrate", rev = "17e0e96946b9588c150298ac0f951211681b2043", version = "=0.7.18" }
intake_model = { package = "intake", path = "../../generated/rust/intake" }
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
