[package]
name = "b10x-loom-intake-slice"
description = "The vertical slice: open a case on the picked protocol through the governor and run Commission's runtime over it, with Loom proposing and a local effect adapter performing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_slice"

[dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
chrono = "0.4"
b10x-loom-commission = { path = "../loom-commission" }
b10x-canon-engineering = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.1.0" }
b10x-loom-governor = { path = "../loom-governor" }
b10x-loom-intake-references = { path = "../loom-intake-references" }
b10x-loom-intake-router = { path = "../loom-intake-router" }
b10x-llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.1.7" }
b10x-loom-executor = { path = "../loom-executor" }
serde_json = "1"
serde = "1"
sha2 = "0.10"
tokio = { version = "1.53", features = ["rt"] }
# Substrate's embedded host and wire are one released contract, ported from Harness.
substrate-host = { package = "b10x-substrate-host", git = "https://github.com/beyond10x/substrate", rev = "65304edf6ebdf4a95f9c2c6138b0c20ea47d157e", version = "=0.7.10" }
substrate-wire = { package = "b10x-substrate-wire", git = "https://github.com/beyond10x/substrate", rev = "65304edf6ebdf4a95f9c2c6138b0c20ea47d157e", version = "=0.7.10" }
intake_model = { package = "intake", path = "../../generated/rust/intake" }
tempfile = "3"
