[package]
name = "loom-docs"
description = "Generates the derived pages of the Loom documentation site (CLI, crates, ESS reference) and checks them for drift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
b10x-loom-cli = { path = "../loom-cli" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
b10x-llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.8.0" }
b10x-loom-sdk = { path = "../loom-sdk" }
