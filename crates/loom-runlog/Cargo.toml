[package]
name = "b10x-loom-runlog"
description = "Keeps one run log per case beside the case file: one JSON line per event, each naming the SHA-256 of the line before it, appended atomically under the store's lock, and a reader that refuses a cut, shortened, reordered or changed log."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false

[lib]
name = "b10x_loom_runlog"

[dependencies]
b10x-loom-governor = { path = "../loom-governor" }
loom = { path = "../../generated/rust/loom" }
sha2 = "0.11.0"

[dev-dependencies]
b10x-loom-commission = { path = "../loom-commission" }
serde_json = "1"

[[test]]
name = "main"
path = "tests/main.rs"
