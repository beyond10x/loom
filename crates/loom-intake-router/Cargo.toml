[package]
name = "b10x-loom-intake-router"
description = "Propose the ELS registry protocol an intent should run under, refusing a pick outside the registry or below a confidence threshold (story router-classifier)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_router"

[dependencies]
els = { package = "b10x-els", git = "https://github.com/beyond10x/els", rev = "ac7dd03" }
b10x-loom-intake-model = { path = "../loom-intake-model" }
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.1.6" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros"] }
