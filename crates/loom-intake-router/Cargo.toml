[package]
name = "b10x-loom-intake-router"
description = "Propose the engineering protocol an intent should run under, refusing a pick outside the registry or below a confidence threshold."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "b10x_loom_intake_router"

[dependencies]
b10x-loom-protocols = { path = "../loom-protocols" }
b10x-canon-engineering = { git = "https://github.com/beyond10x/engineering-protocols", tag = "0.3.0" }
b10x-llm-tool-call = { git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
llm-core = { package = "b10x-llm-core", git = "https://github.com/beyond10x/llm", tag = "0.4.0" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt", "macros"] }
