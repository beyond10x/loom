apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loom-agents.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "loom-agents.labels" . | nindent 4 }}
data:
  config.yaml: |
    namespace: {{ .Release.Namespace | quote }}
    defaultImage:
      repository: {{ .Values.agentImage.repository | quote }}
      tag: {{ .Values.agentImage.tag | quote }}
    defaultResources:
      cpu: {{ .Values.defaultAgentResources.cpu | quote }}
      memory: {{ .Values.defaultAgentResources.memory | quote }}
    {{- with .Values.modelRoute }}
    {{- if .url }}
    modelRoute:
      url: {{ .url | quote }}
      protocol: {{ required "modelRoute.protocol is required with modelRoute.url" .protocol | quote }}
      model: {{ required "modelRoute.model is required with modelRoute.url" .model | quote }}
    {{- end }}
    {{- end }}
    allowedSecretNames: {{ .Values.allowedSecretNames | toJson }}
    allowedEgressHosts: {{ .Values.allowedEgressHosts | toJson }}
    allowedClaimNames: {{ .Values.allowedClaimNames | toJson }}
