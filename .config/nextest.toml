experimental = ["setup-scripts"]

[scripts.setup.shared-trees]
command = "cargo run --locked -p loom-xtask -- shared-trees"

[profile.default]
default-filter = "not test(/(^|::)slow_/) and not ((binary_id(/^b10x-loom-executor::(ess_gate|main)$/) and (not binary(=main) or test(/^ess_gate::/))) | (binary_id(/^b10x-loom-commission::(ess_gate|main)$/) and (not binary(=main) or test(/^ess_gate::/))))"
slow-timeout = { period = "60s", terminate-after = 1 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"
store-success-output = true

[[profile.default.overrides]]
filter = "(binary_id(b10x-loom-cli::tree_run) or (binary_id(b10x-loom-cli::main) and test(/^tree_run::/))) and not test(/(^|::)slow_/)"
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.default.scripts]]
filter = "(binary_id(/^b10x-loom-cli::(tree_run|main)$/) and (not binary(=main) or test(/^tree_run::/)))"
setup = "shared-trees"

[profile.slow]
default-filter = "test(/(^|::)slow_/)"
slow-timeout = { period = "60s", terminate-after = 20 }
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
