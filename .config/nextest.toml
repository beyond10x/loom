[profile.default]
default-filter = "not test(/(^|::)slow_/)"
slow-timeout = { period = "60s", terminate-after = 1 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[profile.slow]
default-filter = "test(/(^|::)slow_/)"
slow-timeout = { period = "60s", terminate-after = 20 }
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
