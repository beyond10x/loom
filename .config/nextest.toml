[profile.default]
default-filter = "not test(/(^|::)slow_/) and not (binary_id(b10x-loom-executor::ess_gate) | binary_id(b10x-loom-conformance::conform) | binary_id(b10x-loom-commission::ess_gate) | binary_id(b10x-loom-commission-conformance::conform) | binary_id(b10x-loom-intake-conformance::conform))"
slow-timeout = { period = "60s", terminate-after = 1 }
fail-fast = false

[profile.default.junit]
path = "junit.xml"

[profile.slow]
default-filter = "test(/(^|::)slow_/)"
slow-timeout = { period = "60s", terminate-after = 20 }
fail-fast = false

[profile.slow.junit]
path = "junit.xml"
